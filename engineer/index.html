const L138 = [{"k":"Front matter","r":"Front matter, page 1","p":1,"t":"Approved Code of Practice and guidance This Approved Code of Practice (ACOP) and guidance provide practical advice on how to comply with the Dangerous Substances and Explosive Atmospheres Regulations 2002 (DSEAR). These Regulations require the elimination or reduction of risk of fire and explosion from substances connected with work activities.","h":"Dangerous substances and explosive atmospheres Dangerous Substances and Explosive Atmospheres"},{"k":"Front matter","r":"Front matter, page 1 (continued)","p":1,"t":"The ACOP is primarily for an informed and experienced audience such as health and safety professionals. It applies to workplaces that manufacture, store, process or use dangerous substances as defined in this publication."},{"k":"Front matter","r":"Front matter, page 1 (continued 2)","p":1,"t":"This second edition of L138 incorporates the four previous DSEAR ACOPs on design, storage, control and safe maintenance."},{"k":"Front matter","r":"Front matter, page 1 (continued 3)","p":1,"t":"The consolidated ACOP text and guidance have been simplified, streamlined, and restructured to help the reader. No significant new duties are placed on businesses L138 (Second edition) that are in compliance with the replaced ACOPs, although the content has been Published 2013 updated in light of changes to European and domestic legislation, such as substance classification and labelling and general fire safety. The Regulations themselves are unchanged."},{"k":"Front matter","r":"Front matter, page 1 (continued 4)","p":1,"t":"You may reuse this information (excluding logos) free of charge in any format or medium, under the terms of the Open Government Licence. To view the licence visit www.nationalarchives.gov.uk/doc/open-government-licence/, write to the Information Policy Team, The National Archives, Kew, London TW9 4DU, or email psi@nationalarchives.gsi.gov.uk.","h":"ISBN 978 0 7176 6616 4"},{"k":"Front matter","r":"Front matter, page 1 (continued 5)","p":1,"t":"Some images and illustrations may not be owned by the Crown so cannot be reproduced without permission of the copyright owner. Enquiries should be sent to copyright@hse.gsi.gov.uk."},{"k":"Front matter","r":"Front matter, page 1 (continued 6)","p":1,"t":"This Code has been approved by the Health and Safety Executive, with the consent of the Secretary of State. It gives practical advice on how to comply with the law. If you follow the advice you will be doing enough to comply with the law in respect of those specific matters on which the Code gives advice. You may use alternative methods to those set out in the Code in order to comply with the law.","h":"Approved Code of Practice"},{"k":"Front matter","r":"Front matter, page 1 (continued 7)","p":1,"t":"However, the Code has a special legal status. If you are prosecuted for breach of health and safety law, and it is proved that you did not follow the relevant provisions of the Code, you will need to show that you have complied with the law in some other way or a Court will find you at fault."},{"k":"Front matter","r":"Front matter, page 1 (continued 8)","p":1,"t":"This guidance is issued by the Health and Safety Executive. Following the guidance is not compulsory, unless specifically stated, and you are free to take other action. But if you do follow the guidance you will normally be doing enough to comply with the law. Health and safety inspectors seek to secure compliance with the law and may refer to this guidance.","h":"Guidance"},{"k":"Front matter","r":"Front matter, page 2","p":2,"t":"Introduction 9 About this book 9 About ACOPs 10 Presentation of regulation, guidance and ACOP text 10 About DSEAR 10 Scope of ‘employer’ 10 Information for use in risk assessment 10 The legislative background 11 DSEAR and other legislation on dangerous substances or hazardous activities 11 Consulting employees and safety representatives 13 The Regulations 14 Regulation uropean CLP Regulation 103 Implications for DSEAR 103 What does this mean for chemical users? 103 Withdrawal of the HSE Approved Supply List 104 Guidance on the CLP Regulation 105 Appendix 4 Fire resistance 106 Appendix 5 Fire reaction 107 Appendix 6 Workplace and work equipment transitional provisions under regulation 17 108 Reference and further reading 110 Glossary 116 Further information 119"},{"k":"Introduction","r":"Paragraph 1","p":8,"t":"1 The Dangerous Substances and Explosive Atmospheres Regulations 2002 (DSEAR) Approved Code of Practice (ACOP) text and associated guidance provide practical advice on how you can comply with the requirements of the Regulations.","h":"About this book","sub":1},{"k":"Introduction","r":"Paragraph 2","p":8,"t":"2 The ACOP is intended primarily for an informed and experienced audience such as professional health and safety staff and those who may give advice to smaller businesses rather than the small businesses themselves. The leaflet INDG3701 provides a short guide to DSEAR and is aimed at small and medium- sized businesses. Information on DSEAR can also be accessed via the Fire and explosion pages of HSE’s website at www.hse.gov.uk/fireandexplosion.","sub":2},{"k":"Introduction","r":"Paragraph 3","p":8,"t":"3 This publication is for places of work that manufacture, store, process or use dangerous substances as defined in paragraph 33. It contains an ACOP explaining what is required for compliance, together with guidance on the duties in DSEAR. It has been prepared by the Health and Safety Executive (HSE) after consultation with stakeholders in industry, trades unions, local authorities and fire authorities. While Unloading petrol from road tankers2 continues as a separate ACOP, four DSEAR ACOP publications from 2003 have been merged into the original main ACOP L138 Dangerous Substances and Explosive Atmospheres namely: (a) L134 Design of plant, equipment and workplaces; (b) L135 Storage of dangerous substances; (c) L136 Control and mitigation measures; (d) L137 Safe maintenance, repair and cleaning procedures.","sub":3},{"k":"Introduction","r":"Paragraph 4","p":8,"t":"4 The ACOP text and guidance have been simplified, streamlined and any previous ambiguities removed. The changes, which are summarised below, have been widely consulted on.","sub":4},{"k":"Introduction","r":"Paragraph 5","p":8,"t":"5 Changes in this edition include: (a) some guidance has been assigned ACOP status and vice versa. For example, previously no ACOP material existed for regulations 7 and 10. However, these changes were introduced to provide clarification on how to comply and do not introduce any new requirements; (b) adjustments in light of European and other legislation that has or will be introduced after DSEAR came into force such as: (i) general fire safety legislation (see paragraph 20); (ii) classification for labelling and packaging (see Appendix 3); (c) clarification on the scope of the Regulations in relation to incompatible substances being outside the scope of DSEAR but within the scope of the Health and Safety at Work etc Act (the HSW Act) (see paragraph 255); (d) Schedules to the Regulations have been moved from the end of the document to sit near their respective regulation; (e) the list of references and further reading has been updated.","sub":5},{"k":"Introduction","r":"Paragraph 6","p":9,"t":"6 Approved Codes of Practice are approved by the HSE Board with the consent of the Secretary of State (see Appendix 1: Notice of Approval for details).","h":"About ACOPs","sub":6},{"k":"Introduction","r":"Paragraph 7","p":9,"t":"7 The ACOP describes preferred or recommended methods that can be used (or standards to be met) to comply with the Regulations and the duties imposed by the HSW Act. The accompanying guidance also provides advice on achieving compliance, or it may give information of a general nature, including explanation of the requirements of the law, more specific technical information or references to further sources of information.","sub":7},{"k":"Introduction","r":"Paragraph 8","p":9,"t":"8 The legal status of ACOP and guidance text is given on the copyright page.","sub":8},{"k":"Introduction","r":"Paragraph 9","p":9,"t":"9 The ACOP text is set out in bold and the accompanying guidance in normal type, the text of the Regulations is in italics. Coloured borders also indicate each section clearly. Each regulation is preceded by a short summary of the main duties imposed by that regulation and aims to help the reader navigate the document. This summary text is for information only.","h":"Presentation of regulation, guidance and ACOP text","sub":9},{"k":"Introduction","r":"Paragraph 10","p":9,"t":"10 The Dangerous Substances and Explosive Atmospheres Regulations 2002 (SI 2002/2776) set minimum requirements for the protection of workers from fire and explosion risks related to dangerous substances and potentially explosive atmospheres. The Regulations apply to employers and the self-employed at most workplaces in Great Britain where a dangerous substance is present or could be present.","h":"About DSEAR","sub":10},{"k":"Introduction","r":"Paragraph 11","p":9,"t":"11 DSEAR revoked or modified a large amount of old legislation relating to flammable substances and dusts including the Highly Flammable Liquids and Liquefied Petroleum Gases Regulations 1972 (SI 1972/917) and section 31 of the Factories Act 1961. Safety standards were maintained through a combination of the requirements of DSEAR and ACOPs reflecting practices in the preceding legislation.","sub":11},{"k":"Introduction","r":"Paragraph 12","p":9,"t":"12 The term ‘employer’ is used throughout the document and should be understood to include the self-employed as a consequence of regulation 4(2). Less frequently the less-specific term ‘dutyholder’ may also be used which includes both.","h":"Scope of ‘employer’","sub":12},{"k":"Introduction","r":"Paragraph 13","p":9,"t":"13 A key part of compliance with DSEAR is the risk assessment and an important principle is to separate storage areas from process areas where the two occur on the same or shared premises. Employers will find generic information on the storage of dangerous substances in other HSE and non-HSE guidance. In contrast process activities are, by their nature, very variable, and the employer should consider these in much more detail and apply the principles of risk assessment themselves as there may be less guidance available.","h":"Information for use in risk assessment","sub":13},{"k":"Introduction","r":"Paragraph 14","p":9,"t":"14 Health effects from substances and preparations are not within the scope of DSEAR and are covered by legislation such as the Control of Substances Hazardous to Health Regulations 2002 (SI 2002/2677) (COSHH).","sub":14},{"k":"Introduction","r":"Paragraph 15","p":10,"t":"15 DSEAR 2002 was made under the Health and Safety at Work etc Act 1974 (the HSW Act). The Regulations apply to workplaces in Great Britain. The Regulations implement two European Directives: (a) the safety aspects of the Chemical Agents Directive 98/24/EC (CAD); and (b) the Explosive Atmospheres Directive 99/92/EC (ATEX).","h":"The legislative background","sub":15},{"k":"Introduction","r":"Paragraph 16","p":10,"t":"16 The primary purpose of DSEAR is to protect workers and others who may be at risk from dangerous substances that can cause a fire, explosion or similar energy-releasing event, such as a runaway exothermic reaction.","sub":16},{"k":"Introduction","r":"Paragraph 17","p":10,"t":"17 Subject to regulation 3(1), risks from dangerous substances or explosive atmospheres may also be subject to other specific legislation dealing with, for example: (a) risks from major hazard activities, covered by the Control of Major Accident Hazards Regulations 1999 (SI 1999/743) (COMAH); (b) the prevention of fires and explosions offshore through the Offshore Installations (Prevention of Fire and Explosion, and Emergency Response) Regulations 1995 (SI 1995/743) (PFEER) or the Offshore Installations and Pipeline Works (Management and Administration) Regulations 1995 (SI 1995/738); and (c) the transport of dangerous goods, covered by specific carriage legislation, such as the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations 2007 (CDG). (These have been superseded by the Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations 2009 (SI 2009/1348). Reference to the amendment has yet to be reflected formally in DSEAR but section 17(2)(a) of the Interpretation Act 1978 means that reference to the earlier Regulations includes the later Regulations.)","h":"DSEAR and other legislation on dangerous substances or hazardous activities","sub":17},{"k":"Introduction","r":"Paragraph 18","p":10,"t":"18 The above list is not exclusive and other legislation includes provisions on preventing fires and explosions for example in quarries, mines and harbour areas. In many cases, compliance with the specific requirements of such other legislation will go a long way towards meeting the requirements of DSEAR.","sub":18},{"k":"Introduction","r":"Paragraph 19","p":10,"t":"19 The duties in DSEAR apply alongside the HSW Act, other regulations made under the Act, and legislation on fire precautions and within a wider legislative context. See Appendix 2 for more information. Certain significant regulations are highlighted below.","h":"Relationship with other health and safety legislation","sub":19},{"k":"Introduction","r":"Paragraph 20","p":10,"t":"20 General fire safety requirements in the workplace in England and Wales are applied through the Regulatory Reform (Fire Safety) Order 2005 (SI 2005/1541). The Scottish equivalents are the Fire (Scotland) Act 2005 (2005 (asp 5)) and the Fire Safety (Scotland) Regulations 2006 (SSI 2006/456). The legislation consolidated and revoked legislation that previously covered general fire safety, including the requirement for fire certification. Current legislation requires the employer to carry out a risk assessment to determine the general fire safety requirements for their workplace and implement those requirements, including maintaining a general fire safety management plan.","h":"General fire safety legislation","sub":20},{"k":"Introduction","r":"Paragraph 21","p":11,"t":"21 General fire safety legislation is normally enforced by the local fire and rescue authority or in Scotland, the Scottish Fire and Rescue Service. However, there are other enforcing authorities for certain specific workplaces/worksites. HSE is the enforcing authority for general fire safety in shipbuilding and on most construction sites. At the time of publication, HSE – via the Office for Nuclear Regulation (ONR) – is the enforcing authority for fire safety in licensed nuclear premises.","sub":21},{"k":"Introduction","r":"Paragraph 22","p":11,"t":"22 Any general fire safety provision which could be imposed by regulations 1–6, 8, 9 and 11 of DSEAR is covered instead under this general fire safety legislation, with enforcement responsibility falling to the relevant authority, depending on the activity at the premises. The Equipment and Protective Systems Intended for Use in Potentially Explosive Atmospheres Regulations 1996","sub":22},{"k":"Introduction","r":"Paragraph 23","p":11,"t":"23 The Equipment and Protective Systems Intended for Use in Potentially Explosive Atmospheres Regulations 1996 (SI 1996/192) (EPS) implement Directive 94/9/EC (the ATEX Product Directive). EPS applies to both electrical and mechanical equipment and protective systems intended for use in potentially explosive atmospheres.","sub":23},{"k":"Introduction","r":"Paragraph 24","p":11,"t":"24 New equipment etc supplied for use in places where an explosive atmosphere may occur must meet the requirements of EPS whatever its source. Second-hand equipment and equipment already on the shelf (for example, as spares) brought into use after 1 July 2003 also has to meet the requirements of EPS.","sub":24},{"k":"Introduction","r":"Paragraph 25","p":11,"t":"25 Regulation 7(6) of DSEAR made provisions in regulation 17 for transitional delays before certain requirements of regulation 7 and Schedule 3 (in relation to equipment in hazardous areas) became entirely active. All of the transitional delay periods have now expired but guidance on regulation 17 can now be found under regulation 7.","sub":25},{"k":"Introduction","r":"Paragraph 26","p":11,"t":"26 DSEAR deals only with risks to people from dangerous substances but such substances could also harm the environment during disposal or in the event of a spill. In undertaking any risk assessment, or developing emergency arrangements, the potential for environmental harm should also be considered. Safety and environmental risks will need to be balanced and judgements will need to be made when considering substitution or other risk control/mitigation measures. Further guidance on environmental considerations is available from: • the Environment Agency in England www.environment-agency.gov.uk/ business/sectors/wastemanagement.aspx • the Scottish Environment Protection Agency (SEPA) www.sepa.org.uk/waste.aspx • Natural Resources Wales Cyfoeth Naturiol Cymru http://naturalresourceswales.gov.uk","h":"Environmental issues","sub":26},{"k":"Introduction","r":"Paragraph 27","p":11,"t":"27 DSEAR is enforced by HSE or local authority inspectors in accordance with the Health and Safety (Enforcing Authority) Regulations 1998 (SI 1998/494) except at commercial premises holding petroleum licences. At these premises the regulations are enforced by petroleum licensing authorities in respect of any activities related to refuelling means of transport such as motor vehicles.","h":"Enforcement arrangements","sub":27},{"k":"Introduction","r":"Paragraph 28","p":11,"t":"28 At most workplaces, fire and rescue authorities will enforce equivalent provisions to DSEAR that relate to general fire safety.","sub":28},{"k":"Introduction","r":"Paragraph 29","p":12,"t":"29 Proper consultation with those who know precisely how the work is done, including identifying the implications of any short cuts, is crucial and helps to build a culture of awareness of health and safety.","h":"Consulting employees and safety representatives","sub":29},{"k":"Introduction","r":"Paragraph 30","p":12,"t":"30 Employers must consult safety representatives appointed by recognised trades unions under the Safety Representatives and Safety Committees Regulations 1977 (SI 1977/500). Employees who are not covered by such representatives must be consulted either directly or indirectly, through elected representatives of employee safety under the Health and Safety (Consultation with Employees) Regulations 1996 (SI 1996/1513).","sub":30},{"k":"Law","r":"Paragraph 31","p":13,"t":"31 Regulations 1 to 4 deal with preliminary issues, ie the date of entry into force of the Regulations, scope and definitions.","h":"The Regulations","sub":31},{"k":"Law","r":"Paragraph 32","p":13,"t":"32 The DSEAR Regulations reproduced in this ACOP include amendments made since 2002 up to mid-2013 only. You should ensure that the most recent version of any regulation is consulted. You can search for changes to legislation at www.legislation.co.uk.","sub":32},{"k":"Law","r":"Regulation 1","p":13,"t":"Regulation 1 Citation and commencement Summary of regulation 1 All parts of the regulations are now in force. These Regulations may be cited as the Dangerous Substances and Explosive Atmospheres Regulations 2002 and shall come into force – (a) as respects all regulations except for regulations 5(4)(c), 7, 11, 15(2), 16(2) and 17(1) to (3) on 9th December 2002; (b) as respects regulations 15(2) and 16(2) on 5th May 2003; and (c) as respects regulations 5(4)(c), 7, 11 and 17(1) to (3) on 30th June 2003."},{"k":"Law","r":"Regulation 2","p":13,"t":"Regulation 2 Interpretation Summary of regulation 2 Use the definitions listed here to check the exact meaning of terms used, eg a ‘dangerous substance’."},{"k":"Law","r":"Regulation 2 (continued)","p":13,"t":"“approved classification and labelling guide” means the “Approved Guide to the Classification and Labelling of Dangerous Substances and Dangerous Preparations” (5th edition)(a) approved by the Health and Safety Commission on 16th April 2002; “the CHIP Regulations” means the Chemicals (Hazard Information and Packaging for Supply) Regulations 2009;","h":"In these Regulations –"},{"k":"Law","r":"Regulation 2 (continued 2)","p":13,"t":"(a) a substance or preparation which meets the criteria in the approved classification and labelling guide for classification as a substance or preparation which is explosive, oxidising, extremely flammable, highly flammable or flammable, whether or not that substance or preparation is classified under the CHIP Regulations; (b) a substance or preparation which because of its physico-chemical or chemical properties and the way it is used or is present at the workplace creates a risk, not being a substance or preparation falling within subparagraph (a) above; or (c) any dust, whether in the form of solid particles or fibrous materials or otherwise, which can form an explosive mixture with air or an explosive atmosphere, not being a substance or preparation falling within subparagraphs (a) or (b) above; “explosive atmosphere” means a mixture, under atmospheric conditions, of air and one or more dangerous substances in the form of gases, vapours, mists or dusts in which, after ignition has occurred, combustion spreads to the entire unburned mixture; “hazard” means the physico-chemical or chemical property of a dangerous substance which has the potential to give rise to fire, explosion, or other events which can result in harmful physical effects of a kind similar to those which can be caused by fire or explosion, affecting the safety of a person, and references in these Regulations to “hazardous” shall be construed accordingly; “offshore installation” has the same meaning as it is given by regulation 3 of the Offshore Installations and Pipeline Works (Management and Administration) Regulations 1995 insofar as that regulation extends to mineral extracting industries within the scope of Article 2(a) of Council Directive 92/91/EEC concerning the minimum requirements for improving the safety and health protection of workers in the mineral-extracting industries through drilling; “personal protective equipment” means all equipment which is intended to be worn or held by a person at work and which protects that person against one or more risks to his safety, and any addition or accessory designed to meet that objective; “preparation” means a mixture or solution of two or more substances; “public road” means (in England and Wales) a highway maintainable at public expense within the meaning of section 329 of the Highways Act 1980 and (in Scotland) a public road within the meaning assigned to that term by section 151 of the Roads (Scotland) Act 1984; “risk” means the likelihood of a person’s safety being affected by harmful physical effects being caused to him from fire, explosion or other events arising from the hazardous properties of a dangerous substance in connection with work and also the extent of that harm; “risk assessment” means the assessment of risks required by regulation 5(1); “safety data sheet” means a safety data sheet within the meaning of Regulation (EC) No 1907/2006 of the European Parliament and of the Council concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals; “substance” means any natural or artificial substance whether in solid or liquid form or in the form of a gas or vapour; “workplace” means any premises or part of premises used for or in connection with work, and includes – (a) any place within the premises to which an employee has access while at work; and","h":"“dangerous substance” means –"},{"k":"Law","r":"Regulation 2 (continued)","p":15,"t":"(b) any room, lobby, corridor, staircase, road or other place – (i) used as a means of access to or egress from that place of work; or, (ii) where facilities are provided for use in connection with that place of work; other than a public road; and “work processes” means all technical aspects of work involving dangerous substances and includes – (a) appropriate technical means of supervision, (b) connecting devices, (c) control and protection systems, (d) engineering controls and solutions, (e) equipment, (f) materials, (g) machinery, (h) plant, (i) protective systems, and (j) warning and other communication systems. (a) The Approved Guide to the Classification and Labelling of Dangerous Substances and Dangerous Preparations (Sixth edition) 2009 is the most current version."},{"k":"Guidance","r":"Paragraph 33","p":15,"t":"33 In this regulation: (a) ‘Other events’ under the regulation 2 definition of ‘hazard’ of the dangerous substance include exothermic runaway reactions. (b) ‘Connecting devices’ under the regulation 2 definition of ‘work processes’ are the means by which discrete parts of the process are interconnected, eg conveyor belts, trunking, pipework etc. (c) ‘Dangerous substance’ includes any substance or preparation which, because of its properties or the way it is used, could cause harm to people from fires and explosions. Dangerous substances include those with potential energy releasing events similar to fire and explosion such as exothermic reactions. Examples include: petrol; liquefied petroleum gas (LPG); paints; varnishes; solvents; and dusts which when mixed with air could cause an explosive atmosphere (eg dusts from milling and sanding operations).","sub":33},{"k":"Guidance","r":"Paragraph 34","p":15,"t":"34 Substances and preparations are potentially within the scope of the Regulations – whether in solid, liquid or gaseous form. This includes substances that are naturally occurring or produced in a chemical or manufacturing process. Substances are also included if they are produced by a work activity, for example, intermediates in a chemical process, waste products of any kind, or substances produced in accident conditions, eg in a runaway chemical reaction.","sub":34},{"k":"Guidance","r":"Paragraph 35","p":15,"t":"35 The Regulations apply wherever a dangerous substance is, or is liable to be, used or present in connection with a work activity carried out by an employer.","sub":35},{"k":"Guidance","r":"Paragraph 36","p":15,"t":"36 Although the chemical and petroleum industries will by their very nature store, use and process the majority of dangerous substances, most other sectors (such as manufacturing, food, retailing etc) will also have dangerous substances present but possibly in small quantities.","sub":36},{"k":"Guidance","r":"Paragraph 37","p":16,"t":"37 The following provides definition of some terms used within this ACOP: (a) ‘control’ is used to describe steps taken or provisions put in place to reduce the likelihood of a fire, explosion, or similar event happening. Control measures should be considered before considering mitigation; (b) ‘mitigation’ is used to describe what steps are taken to minimise the consequences during and after the occurrence of a fire, explosion or similar event; (c) certain combustible dusts are explosible. This means that when dispersed in air in the right dust/air mixture they can cause an explosion if ignited. For simplicity the term ‘explosive’ is used in this ACOP to describe these dusts. In this context the term does not mean materials which are in the class of intentionally explosive materials (UN class 1); (d) reducing risk as low as reasonably practicable (ALARP) – detailed guidance on the principles of ALARP may be found on the HSE website at www.hse.gov.uk/risk/theory/alarp.htm.","h":"Key terms explained","sub":37},{"k":"Guidance","r":"Paragraph 38","p":16,"t":"38 See Appendix 3 which explains changes in classification arrangements.","h":"Approved classification and labelling","sub":38},{"k":"Guidance","r":"Paragraph 39","p":16,"t":"39 This definition sets out the criteria to determine whether an atmosphere is explosive within the scope of the Regulations. The definition is particularly important in deciding when certain requirements in DSEAR will apply, particularly regulations 7 and 11.","h":"Explosive atmospheres","sub":39},{"k":"Guidance","r":"Paragraph 40","p":16,"t":"40 The following three points are consistent with the guidance on EPS, where ‘explosive atmosphere’ is similarly defined. This is relevant to regulation 7 of DSEAR and the selection of equipment for use in explosive atmospheres. For the purposes of DSEAR the following elements must all be present for an explosive atmosphere which is subject to regulations 5(4)(c), 7 and 11 to form: (a) atmospheric conditions – for the purposes of standardisation, normal atmospheric conditions are defined as -20 °C to 40 °C, and 0.8 to 1.1 bar; (b) mixtures of air and dangerous substances – dangerous substances or mixtures of such substances, that are explosive with an oxidant other than air, for example pure oxygen or chlorine, are outside the scope of the definition of explosive atmosphere. The provisions of regulations 5(4)(c), 7 and 11 do not apply although other requirements in DSEAR may do; (c) combustion – the definition of explosive atmosphere in regulation 2 is intended to make clear that where it can be ensured that the gas or dust is present in a concentration below the lower explosive limit, the atmosphere is not explosive, and regulations 5(4)(c), 7 and 11 do not apply. In this guidance, in the terms ‘flammable limit’ and ‘explosive limit’ (as used for example in ‘lower flammable limit’), the words ‘flammable’ and ‘explosive’ are intended to have the same meaning and are interchangeable. For simplicity, the term ‘lower explosive limit’ (LEL) is used throughout this document.","sub":40},{"k":"Guidance","r":"Paragraph 41","p":17,"t":"41 In common usage, a hazard is anything with the potential to cause harm in any way, but a more restricted meaning is specified within DSEAR when considering dangerous substances and preparations. In DSEAR the term ‘hazard’ is confined to the properties of a substance that can potentially lead to fire or explosion or other similar energetic effects which could affect a person’s safety.","h":"Hazard","sub":41},{"k":"Guidance","r":"Paragraph 42","p":17,"t":"42 The Regulations are concerned with dangerous substances that can create harmful physical effects. However, DSEAR does not apply to all possible physical effects, such as crushing injuries resulting, for example, from the storage and handling of heavy containers of dangerous substances and preparations. The Regulations are intended to cover the following harmful physical effects caused directly or indirectly by fires, explosions and other similar events including: (a) thermal radiation (burns caused by radiating heat); (b) thermal injury (burning substances on the skin); (c) over-pressure (blast injuries); (d) smoke, fire gases, unintended releases (asphyxiation).","sub":42},{"k":"Guidance","r":"Paragraph 43","p":17,"t":"43 Harmful physical effects can also be caused by other energetic events such as runaway exothermic reactions or decompositions of unstable substances, eg decomposition of peroxides. These words are included in the definition of hazard to ensure that not only fires and explosions are covered, but also other similar energetic events.","h":"Other events","sub":43},{"k":"Guidance","r":"Paragraph 44","p":17,"t":"44 Ultimately the hazard is created by the physico-chemical and chemical properties of the substance or preparation and the way it is used or present.","h":"Physico-chemical or chemical property","sub":44},{"k":"Guidance","r":"Paragraph 45","p":17,"t":"45 Examples of relevant physical properties include: (a) boiling point, flashpoint, auto-ignition temperature; (b) flammability, vapour pressure, thermal sensitivity; (c) mechanical sensitivity and oxidising properties.","sub":45},{"k":"Guidance","r":"Paragraph 46","p":17,"t":"46 Relevant chemical properties would include: (a) reactivity, heat of reaction; (b) self-acceleration and decomposition temperature.","sub":46},{"k":"Guidance","r":"Paragraph 47","p":17,"t":"47 Other properties of substances relating to radioactivity, toxicity and ecotoxicity are not within the scope of the Regulations.","sub":47},{"k":"Guidance","r":"Paragraph 48","p":17,"t":"48 Test methods that can be used to determine physico-chemical properties are detailed in the Test Methods Regulation (TMR) (EC) No 440/2008 or the UN Manual of Tests and Criteria. Further information on TMR can be found on the European Chemicals Agency website at http://echa.europa.eu.","sub":48},{"k":"Guidance","r":"Paragraph 49","p":17,"t":"49 For materials that could be dispersed in air to give rise to a risk of a dust explosion, the consequences and magnitude of this are significantly influenced by the composition and nature of the material, including its particle size. A number of European Standards for test methods to help determine the risk and the precautionary measures required are available (BS EN 14034 Parts 1–43 and BS EN 138214).","sub":49},{"k":"Guidance","r":"Paragraph 50","p":18,"t":"50 Safety data sheets (SDSs) are no longer covered by the Chemicals (Hazard Information and Packaging for Supply) Regulations 2009 (SI 2009/716) (CHIP). The legal requirements to provide an SDS have been transferred to the direct-acting Registration, Evaluation, Authorisation and Restricting of Chemicals Regulations (EC 1907/2006) (REACH Regulation).","h":"Safety data sheets","sub":50},{"k":"Guidance","r":"Paragraph 51","p":18,"t":"51 The definition of ‘workplace’ is based on that used in the Workplace (Health, Safety and Welfare) Regulations 1992 (SI 1992/3004). It is however wider in scope as it also includes areas in private dwellings where work is carried out.","h":"Workplace","sub":51},{"k":"Guidance","r":"Paragraph 52","p":18,"t":"52 The term ‘premises’, used in the definition of ‘workplace’, means any place whether or not there is a structure at that place. It includes (subject to the disapplications in regulation 3) vehicles, vessels, any land-based or offshore installations, movable areas to which employees have access while at work and their means of access to and egress from, the workplace. Common parts of shared buildings, private roads and paths on industrial estates and business parks are therefore included.","sub":52},{"k":"Guidance","r":"Paragraph 53","p":18,"t":"53 Public roads which are used to get to or from the workplace are not included in the definition. However, in some circumstances, a public road may itself become the workplace, and if dangerous substances are used or produced during the work activity concerned, these Regulations may apply, for example during road repairing or work on utilities.","sub":53},{"k":"Guidance","r":"Paragraph 54","p":18,"t":"54 This includes the use of the ‘hardware’ aspects of work involving dangerous substances that are of a technical nature, eg gas detectors, flameproof enclosures, regulating devices. It excludes systems of work, eg management and non-technical supervisory arrangements, but does include appropriate technical measures for supervision. Work processes can involve a range of activities, eg storage, manufacture, disposal, cleaning and some forms of energy generation.","h":"Work processes","sub":54},{"k":"Guidance","r":"Paragraph 55","p":18,"t":"55 Technical means of supervision are those technical measures that are required by the risk assessment to prevent employees from working in or entering an explosive atmosphere. They will include monitoring and interlock devices that are designed to stop a process or alert an employee in the event of a mechanical fault, procedural error or foreseeable process deviation that could result in the formation of a hazardous explosive atmosphere. Examples of such technical measures include: (a) gas monitoring and alarm systems for employees working in confined spaces where flammable vapours may be present or likely to be released by the activity; (b) interlocks on coating operations that would stop the application of flammable coating products if the associated mechanical exhaust ventilation is interrupted.","h":"Technical supervision measures","sub":55},{"k":"Guidance","r":"Paragraph 56","p":18,"t":"56 Technical means of supervision may be used as a separate supervisory function or as part of a wider management system for controlling risks. Regulation 3 Application Summary of regulation 3 To avoid overlaps with other more specific legislation regulation 3 disapplies some named work activities from some individual DSEAR regulations. These work activities include maritime, medical, gas appliances, explosives manufacture, mines and quarries, and offshore installations.","sub":56},{"k":"Law","r":"Regulation 3(1)","p":19,"t":"(1) These Regulations, apart from regulations 15, 16 and 17(4) to (5), shall not apply to the master or crew of a ship or to the employer of such persons in respect of the normal ship-board activities of a ship’s crew which are carried out solely by the crew under the direction of the master and, for the purposes of this paragraph – (a) “ship” includes every description of vessel used in navigation, other than a ship forming part of Her Majesty’s Navy or an offshore installation; and (b) the reference to the normal ship-board activities of a ship’s crew includes – (i) the construction, reconstruction or conversion of a ship outside, but not inside, Great Britain; and (ii) the repair of a ship save repair when carried out in dry dock."},{"k":"Law","r":"Regulation 3(2)","p":19,"t":"(2) Regulations 5(4)(c), 7 and 11 shall not apply to – (a) areas used directly for and during the medical treatment of patients; (b) the use of gas appliances burning gaseous fuel (that is to say, any fuel which is in a gaseous state at a temperature of 15°C under a pressure of 1 bar) which – (i) are used for cooking, heating, hot water production, refrigeration, lighting or washing; and (ii) have, where applicable, a normal water temperature not exceeding 105°C; including forced draught burners and heating bodies to be equipped with such burners but not including an appliance specifically designed for use in an industrial process carried out on industrial premises; (c) gas fittings within the meaning of the Gas Safety (Installation and Use) Regulations 1998 located in domestic premises, not being gas appliances falling within subparagraph (b); (d) the manufacture, handling, use, storage and transport of explosives or chemically unstable substances; (e) any activity at a mine within the meaning of section 180 of the Mines and Quarries Act 1954 carried out for the purposes of the mine; (f) any activity at a quarry within the meaning of regulation 3 of the Quarries Regulations 1999 carried out for the purposes of the quarry; (g) any activity at a borehole site within the meaning of regulation 2(1) of the Borehole Sites and Operations Regulations 1995 carried out for the purposes of the borehole site; (h) any activity at an offshore installation carried out for the purposes of the offshore installation; and (i) the use of means of transport by land, water or air which is regulated by international agreements and the European Community Directives giving effect to them insofar as they fall within the disapplication in Article 1.2.(e) of Council Directive 99/92/EC on minimum requirements for improving the safety and health protection of workers potentially at risk from explosive atmospheres, except for any means of transport intended for use in a potentially explosive atmosphere."},{"k":"Law","r":"Regulation 3(3)","p":20,"t":"(3) Regulations 5(2)(f), (g), (h) and (i), 6(4)(d), 6(5)(b) and (e) and 8(1)(d) and (e) and the requirements of paragraphs 5 and 6 of Schedule 1 shall not apply to any activity at an offshore installation carried out for the purposes of the offshore installation."},{"k":"Guidance","r":"Paragraph 57","p":20,"t":"57 The Regulations do not apply to most activities on ships carried out solely by a ship’s crew involving dangerous substances on ships under the direction of the ship’s master. For example, use of flammable paints for maintenance purposes. Similarly when the ship is tied up in a port or harbour, minor ‘running repairs’ involving dangerous substances (eg repairs involving flammable adhesives) carried out solely by the crew under the direction of the ship’s master are not covered by DSEAR. The crew’s safety is subject to maritime legislation enforced by the Maritime and Coastguard Agency, who also deal with navigation and other operational matters.","h":"Maritime activities","sub":57},{"k":"Guidance","r":"Paragraph 58","p":20,"t":"58 However, DSEAR does apply when a ship is in a British port and ‘shoreside’ workers and the ship’s crew work together: (a) in port/dock operations; (b) in carrying out construction, reconstruction, or conversion repairs to the ship in dry dock.","sub":58},{"k":"Guidance","r":"Paragraph 59","p":20,"t":"59 Any work on offshore installations is not regarded as normal shipboard activities (and DSEAR applies). But where only the offshore staff are involved the operations are only excluded from DSEAR regulations 5(2)(f), (g), (h) and (i), 6(5)(b) and (e), 8(1)(d) and (e) and paragraphs 5 and 6 of Schedule 1. (There are specific requirements in offshore legislation.)","sub":59},{"k":"Guidance","r":"Paragraph 60","p":20,"t":"60 Regulation 3(1) also enables the provisions of regulations 15, 16, 17(4) and 17(5) to be applied in full to water transport and shipping activities where they may be subject to the legislation referred to in those regulations.","sub":60},{"k":"Guidance","r":"Paragraph 61","p":20,"t":"61 Regulation 3(2) lists a number of areas and activities to which regulations 5(4)(c) (recording information where an explosive atmosphere may occur at the workplace), 7 (places where explosive atmospheres may occur) and 11 (duty of co-ordination) do not apply.","h":"Exclusions from regulations 5(4)(c), 7 and 11","sub":61},{"k":"Guidance","r":"Paragraph 62","p":20,"t":"62 Only specific areas where medical treatment takes place such as treatment rooms and operating theatres are excluded. Other areas in hospitals or surgeries where treatment does not take place, such as waiting rooms, corridors, boiler rooms, laundries, fitters’ workshops, and treatment areas closed for repairs or refurbishment, are not excluded.","h":"Areas used directly for and during the medical treatment of patients","sub":62},{"k":"Guidance","r":"Paragraph 63","p":21,"t":"63 Appliances excluded from DSEAR are those which burn gaseous fuels used for cooking, heating, water heating, refrigeration, lighting and washing with, where applicable, a normal water temperature not exceeding 105 °C. Appliances designed for use in industrial processes on industrial premises and appliances that heat water to a temperature greater than 105 °C are covered by DSEAR. Points to note: (a) ‘Gaseous fuels’ means any fuel which is a gas at a temperature of 15 °C and a pressure of 1 bar (normal atmospheric pressure). (b) ‘Use of appliances’ does not include installation and maintenance. (c) The pipework supplying an appliance is not included in the term ‘use of the appliance’ although the section between (and adjacent to) the appliance and the isolation valve may be. (d) The use of gas appliances is covered by the Gas Appliances (Safety) Regulations 1995 (SI 1995/1629).","h":"The use of gas appliances burning gaseous fuels","sub":63},{"k":"Guidance","r":"Paragraph 64","p":21,"t":"64 The requirements of regulations 5(4)(c), 7 and 11 do not apply to work in domestic premises involving the installation and use of gas fittings as defined in the Gas Safety (Installation and Use) Regulations 1998 (SI 1998/2451). The manufacture, handling, use, storage and transport of explosives or chemically unstable substances","h":"Gas fittings","sub":64},{"k":"Guidance","r":"Paragraph 65","p":21,"t":"65 Regulations 5(4)(c), 7 and 11 (recording information, places where explosive atmospheres may occur and duty of co-ordination) do not apply to activities involving the manufacture, handling, use and storage of explosives and chemically unstable substances, or to their transport by road, rail, water and air.","sub":65},{"k":"Guidance","r":"Paragraph 66","p":21,"t":"66 In DSEAR, ‘explosives’ means those substances (and articles) that meet the interpretation of ‘explosive’ given in the Manufacture and Storage of Explosives Regulations 2005 (SI 2005/1082).","sub":66},{"k":"Guidance","r":"Paragraph 67","p":21,"t":"67 In DSEAR, ‘chemically unstable substances’ means substances or preparations which in foreseeable conditions and without the need for air, either individually or when mixed with another substance, can undergo a self-sustaining chemical reaction. This reaction can produce heat and/or gas at such a temperature or rate that it poses a risk to safety from blast, thermal or projectile effects. They include many organic peroxides5 and various blowing agents of the ‘azo’ type. For regulations 5(4)(c), 7 and 11 to apply, the explosive atmosphere must be formed under normal atmospheric conditions, ie as a mixture in air.","sub":67},{"k":"Guidance","r":"Paragraph 68","p":21,"t":"68 Some substances have both the properties of a flammable gas, vapour, dust etc that can form an explosive atmosphere with air under normal atmospheric conditions and can also explode in the absence of air. Examples include acetylene, methyl acetylene and ethylene oxide. Regulations 5(4)(c), 7 and 11 therefore apply to these substances in relation to the possible formation of explosive atmospheres in the presence of air. The three DSEAR regulations do not apply in relation to their explosive/chemically unstable properties. Further information on the additional legal and practical controls applying to acetylene can be found on the HSE website at www.hse.gov.uk/fireandexplosion/acetylene.htm.","sub":68},{"k":"Guidance","r":"Paragraph 69","p":22,"t":"69 Regulations 5(4)(c), 7 and 11 do not apply to activities at mines (within the meaning of the Mines and Quarries Act 1954), quarries (within the meaning of the Quarries Regulations 1999 (SI 1999/2024)) or borehole sites (Borehole Sites and Operations Regulations 1995 (SI 1995/2038)) where these are carried out for the specific purpose of the extraction. Activities at an offshore installation carried out for the purposes of the installation are also excluded from these regulations.","h":"Mineral extracting industries","sub":69},{"k":"Guidance","r":"Paragraph 70","p":22,"t":"70 Specifically the requirements for visual or audible warnings (regulations 5(2)(f), (g), (h) and (i), 6(4)(d), 6(5)(b) and (e)) and escape facilities in emergencies (regulations 8(1)(d) and (e)) and appropriate systems of work (paragraphs 5 and 6 of Schedule 1) also do not apply to activities at offshore installations because similar requirements exist in other specific offshore legislation.","sub":70},{"k":"Guidance","r":"Paragraph 71","p":22,"t":"71 Regulation 3(2)(i) means that the provisions in regulations 5(4)(c), 7 and 11 (outlined in paragraph 62) do not apply to means of transport of dangerous goods covered by EU directives and international agreements (ADR, RID etc) as implemented nationally, unless the transport (eg a vehicle) is intended to be used in a potentially explosive atmosphere. Even if these three sections are disapplied because other requirements cover the issues during transit, the rest of DSEAR will still apply to any workplace where a dangerous substance is liable to be present and where there may be a risk of an explosive atmosphere, eg from a spillage. Therefore where no international transport agreements are involved, regulations 5(4)(c), 7 and 11 will not be disapplied.","h":"Use of means of transport","sub":71},{"k":"Guidance","r":"Paragraph 72","p":22,"t":"72 Loading/unloading operations which take place in an area of a site where there is normally a risk of a potentially explosive atmosphere are not excluded and the requirements of regulations 5(4)(c), 7 and 11 apply to the means of transport. If an explosive atmosphere is likely to occur solely as a result of a loading/unloading operation itself then the operation would be excluded only from the three specific sections mentioned – the rest of DSEAR would apply. For example, a visiting road tanker transporting a dangerous substance would not bring application of hazardous area classification to the site it was visiting, where the site is not initially considered to have a potentially explosive atmosphere because of its location with respect to the storage facility.","sub":72},{"k":"Guidance","r":"Paragraph 73","p":22,"t":"73 The more specific provisions of the legislation on the transport of dangerous goods apply as normal to ensure safety during transport, loading and unloading.","sub":73},{"k":"Guidance","r":"Paragraph 74","p":22,"t":"74 Any transport of dangerous goods outside the scope of international agreements etc is not excluded and is fully subject to regulations 5(4)(c), 7 and 11. This includes vehicles that remain on the employer’s premises, such as forklift trucks, working/loading/unloading in potentially explosive atmospheres. Regulation 4 Duties under these Regulations Summary of regulation 4 This explains the scope of the Regulations as they apply to the duties of employers and the self-employed who are included within the term ‘employer’. Duties to employees and others are outlined including provision of protective equipment and instruction.","sub":74},{"k":"Law","r":"Regulation 4(1)","p":23,"t":"(1) Where a duty is placed by these Regulations on an employer in respect of his employees, he shall, so far as is reasonably practicable, be under a like duty in respect of any other person, whether at work or not, who may be affected by the work carried on by the employer, except that – (a) the duties of the employer under regulations 6(5)(f) and 7(5) (which relate, respectively, to the provision of suitable personal protective equipment and the provision of appropriate work clothing) shall not extend to persons who are not his employees; and (b) the duties of the employer under regulations 8 and 9 (which relate, respectively, to dealing with accidents and to provision of information, instruction and training) shall not extend to persons who are not his employees, unless those persons are at the workplace where the work is being carried on and subject to the following, namely, that, in relation to the application of regulation 9 to such persons, regulation 9 shall apply to the extent that is required by the nature and the degree of the risk."},{"k":"Law","r":"Regulation 4(2)","p":23,"t":"(2) These Regulations shall apply to a self-employed person as they apply to an employer and an employee and as if that self-employed person were both an employer and employee."},{"k":"Guidance","r":"Paragraph 75","p":23,"t":"75 These Regulations place specific duties on employers to assess and control the risks from dangerous substances. For the purposes of these Regulations, employers include contractors, subcontractors and self-employed people. The duties under these Regulations apply to a self-employed person as if they were both an employer (as long as their activities could affect others) and an employee.","sub":75},{"k":"Guidance","r":"Paragraph 76","p":23,"t":"76 In addition to their own employees, employers are required under DSEAR (and by section 3 of the HSW Act) to take account of the risks to people who are not employed by them but who may be at risk from the use or presence of a dangerous substance. This includes anyone who could potentially be at risk including employees working for other employers, visitors to the site, anyone such as members of the public occupying premises or space nearby.","sub":76},{"k":"Guidance","r":"Paragraph 77","p":23,"t":"77 However, under regulation 8 (arrangements to deal with accidents, incidents and emergencies) and regulation 9 (information, instruction and training), employers only have duties to people other than their employees when those people are at the site of the work activity. In addition, employers are not required by law to provide people other than their employees with appropriate personal protective equipment or work clothing. Information, instruction and training need only be provided to non- employees to the extent required by the nature and degree of the risk.","sub":77},{"k":"Guidance","r":"Paragraph 78","p":23,"t":"78 Where employees of one employer work at another employer’s premises, both employers have duties under the Regulations. Each employer has duties to their own and the other employer’s employees. The employers should co-operate and collaborate to ensure that all the duties imposed by these Regulations are fulfilled. Arrangements for this should be agreed between them, but each employer must satisfy themselves that any arrangements adopted are adequate.","sub":78},{"k":"Guidance","r":"Paragraph 79","p":24,"t":"79 Where an explosive atmosphere may occur, the employer responsible should co-ordinate the implementation of any explosion protection measures. (See regulation 11.) Regulation 5 Risk assessment Summary of regulation 5 This regulation requires all employers and the self-employed to assess all potential risks to employees and others whose safety may be affected by the use or presence of a dangerous substance at the workplace. Employers should check that measures are in place before beginning any new work activity or processes and recheck arrangements periodically. If five or more people are employed, a written record of the significant findings is required. This can either be a separate record or integrated into the record made of overall assessment under the Management of Health and Safety at Work Regulations 1999 (SI 1999/3242) (the Management Regulations) (see Appendix 2) or the fire safety regulations (see paragraph 20).","sub":79},{"k":"Law","r":"Regulation 5(1)","p":24,"t":"(1) Where a dangerous substance is or is liable to be present at the workplace, the employer shall make a suitable and sufficient assessment of the risks to his employees which arise from that substance."},{"k":"Law","r":"Regulation 5(2)","p":24,"t":"(2) The risk assessment shall include consideration of – (a) the hazardous properties of the substance; (b) information on safety provided by the supplier, including information contained in any relevant safety data sheet; (c) the circumstances of the work including – (i) the work processes and substances used and their possible interactions; (ii) the amount of the substance involved; (iii) where the work will involve more than one dangerous substance, the risk presented by such substances in combination; and (iv) the arrangements for the safe handling, storage and transport of dangerous substances and of waste containing dangerous substances; (d) activities, such as maintenance, where there is the potential for a high level of risk; (e) the effect of measures which have been or will be taken pursuant to these Regulations; (f) the likelihood that an explosive atmosphere will occur and its persistence; (g) the likelihood that ignition sources, including electrostatic discharges, will be present and become active and effective; (h) the scale of the anticipated effects of a fire or an explosion; (i) any places which are or can be connected via openings to places in which explosive atmospheres may occur; and (j) such additional safety information as the employer may need in order to complete the risk assessment."},{"k":"Law","r":"Regulation 5(3)","p":24,"t":"(3) The risk assessment shall be reviewed by the employer regularly so as to keep it up to date and particularly if – (a) there is reason to suspect that the risk assessment is no longer valid; or (b) there has been a significant change in the matters to which the risk assessment relates including when the workplace, work processes, or organisation of the work undergoes significant changes, extensions or conversions; and where, as a result of the review, changes to the risk assessment are required, those changes shall be made."},{"k":"Law","r":"Regulation 5(4)","p":25,"t":"(4) Where the employer employs five or more employees, the employer shall record the significant findings of the risk assessment as soon as is practicable after that assessment is made, including in particular – (a) the measures which have been or will be taken by him pursuant to these Regulations; (b) sufficient information to show that the workplace and work processes are designed, operated and maintained with due regard for safety and that, in accordance with the Provision and Use of Work Equipment Regulations 1998, adequate arrangements have been made for the safe use of work equipment; and (c) where an explosive atmosphere may occur at the workplace and subject to the transitional provisions in regulation 17(1) to (3), sufficient information to show – (i) those places which have been classified into zones pursuant to regulation 7(1); (ii) equipment which is required for, or helps to ensure, the safe operation of equipment located in places classified as hazardous pursuant to regulation 7(1); (iii) that any verification of overall explosion safety required by regulation 7(4) has been carried out; and (iv) the aim of any co-ordination required by regulation 11 and the measures and procedures for implementing it."},{"k":"Law","r":"Regulation 5(5)","p":25,"t":"(5) No new work activity involving a dangerous substance shall commence unless – (a) an assessment has been made; and (b) the measures required by these Regulations have been implemented."},{"k":"ACOP","r":"Paragraph 80","p":25,"t":"80 During the risk assessment employers should identify safety risks arising out of or in connection with work or the conduct of their undertaking that relate to dangerous substances and should identify who is at risk. The findings should then be used to take practical action (regulations 6 and 7) to eliminate or reduce the risk. The two aspects (identification of risk and resulting action) are interlinked and so regulations 5, 6 and 7 should be considered together. For the risk assessment to meet the legal requirement to be suitable and sufficient, employers should cover all points in regulation 5(2) to 5(3) inclusive as a minimum and should: (a) include a determination of the hazardous properties of the dangerous substance(s); (b) identify those different groups of workers and people who may be harmed and the likelihood and severity of the consequences; (c) consider any employees who may be at increased risk because of lack of awareness, eg inexperienced trainees and those under 18; (d) consider others including workers of another employer in the workplace or nearby, members of the public and other visitors, both on and off site; (e) satisfy themselves that where a ‘model’ risk assessment is being used from plants elsewhere using similar processes, in each case, the model: (i) reflects the core hazards; (ii) is adapted to the detail of the particular situation; (iii) is appropriate to the type of work.","h":"Risk assessment","sub":80},{"k":"Guidance","r":"Paragraph 81","p":26,"t":"81 The risk assessment required by regulation 5 involves identification and careful examination of any dangerous substances present or liable to be present in the workplace and consideration of how fire, explosion and similar events might harm employees and any other people affected by the work concerned. Its purpose is to enable employers to decide what they must do to eliminate or reduce the risks from dangerous substances, so far as reasonably practicable.","sub":81},{"k":"Guidance","r":"Paragraph 82","p":26,"t":"82 The assessment (including the recording of significant findings) enables employers to demonstrate to themselves and to others who may have an interest, eg inspectors, employees’ representatives (including safety and trade union representatives) etc, that they have followed a structured and thorough approach in considering the risks to the safety of employees and the control measures that are needed. Whoever carries out the assessment should be competent to do so.","sub":82},{"k":"Guidance","r":"Paragraph 83","p":26,"t":"83 Employers should carry out hazardous area classification (see regulation 7) as an integral part of the risk assessment to identify places where controls over ignition sources are needed and those places where they are not. Schedule 2 of the Regulations (located with regulation 7) sets out definitions of the zones to be used when classifying hazardous areas.","sub":83},{"k":"Guidance","r":"Paragraph 84","p":26,"t":"84 The DSEAR risk assessment may be carried out as part of that required by the Management Regulations. Where this is not done, a separate DSEAR risk assessment will be required.","sub":84},{"k":"Guidance","r":"Paragraph 85","p":26,"t":"85 Many factors influence the risks from a fire involving dangerous substances. In particular, employers should consider: (a) whether a fire could lead to an explosion; (b) how fast a fire might grow; (c) what other materials might be rapidly evolved; (d) any dangers from smoke and toxic gases given off; (e) and whether those in the vicinity would be able to escape.","sub":85},{"k":"Guidance","r":"Paragraph 86","p":26,"t":"86 Further information on how to undertake a suitable and sufficient risk assessment is available on HSE’s risk management webpages at www.hse.gov.uk/risk.","sub":86},{"k":"Guidance","r":"Paragraph 87","p":26,"t":"87 The risk assessment could, where appropriate, be completed alongside goal- orientated risk assessments, such as the BS EN 61508-16 or BS EN 61511-27 sector standards used by the process industry, providing that risks from fire, explosion and other events arising from dangerous substances are addressed, including the requirements specified by DSEAR.","sub":87},{"k":"Guidance","r":"Paragraph 88","p":26,"t":"88 Employers’ risk assessments (and the record of the assessment where one is required) should take account of the presence of dangerous substances on the effect of the general fire precautions/safety requirements. The general fire safety legislation follows the same approach as DSEAR in requiring the employer to carry out a risk assessment to identify the risks to people from a fire at the employer’s premises and the practical actions taken to eliminate or reduce the risk.","sub":88},{"k":"Guidance","r":"Paragraph 89","p":27,"t":"89 General fire precautions include provision of: (a) adequate and appropriate means of detection and giving warning in case of fire; (b) adequate means of escape; (c) suitable means of fighting fire; (d) specifying the action to be taken in the event of fire; and (e) appropriate and adequate training of staff in company fire safety procedures.","sub":89},{"k":"Guidance","r":"Paragraph 90","p":27,"t":"90 An explanation of how to comply with the law relating to general fire safety requirements and how to carry out a fire risk assessment can be found: (a) for England and Wales, in Fire safety in the workplace https://www.gov.uk/workplace-fire-safety-your-responsibilities; (b) for Scotland, in Fire Law – Are you aware of your responsibilities – Fire Safety Risk Assessment www.scotland.gov.uk/Topics/Justice/public-safety/Fire-Rescue/FireLaw; (c) for construction sites, in Fire safety in construction HSG168.8","sub":90},{"k":"Guidance","r":"Paragraph 91","p":27,"t":"91 In most workplaces, the local fire and rescue authority enforces the general fire safety legislation which covers general fire safety precautions required in case of fire. In so far as they relate to general fire safety, this includes equivalent provision to regulations 1–6, 8, 9 and 11 of DSEAR. Other requirements for preventing and controlling fires under DSEAR (such as measures to prevent leaks of dangerous substances and avoiding sources of ignition) are enforced by HSE or the local authority, depending on the activity in the premises.","sub":91},{"k":"Guidance","r":"Paragraph 92","p":27,"t":"92 A suitable and sufficient risk assessment should give consideration to the overall risk presented by dangerous substances as well as assessing each factor individually.","h":"The hazardous properties of a substance","sub":92},{"k":"Guidance","r":"Paragraph 93","p":27,"t":"93 Employers must identify any dangerous substances that may be present at the workplace and the hazards they present (eg their flammable or explosive properties). This includes substances which are: (a) brought into the workplace and handled, stored and used for processing; (b) produced or given off (eg as fumes, vapour, dust etc) by a process or activity, or as a result of an incident or accident; (c) used for or arise from maintenance, cleaning and repair work; or (d) produced as a by-product of any work or process (eg waste, residues, scrap materials etc); (e) naturally occurring in the workplace (eg methane may be present in tunnelling and mining operations).","sub":93},{"k":"Guidance","r":"Paragraph 94","p":27,"t":"94 When considering information on the hazardous properties of dangerous substances, employers should identify any adverse conditions that should be avoided. These could include excessive heat, sunlight, exposure to air or moisture and contact with other incompatible substances.","sub":94},{"k":"Guidance","r":"Paragraph 95","p":27,"t":"95 Some substances are obviously hazardous to safety, other substances might be hazardous only under certain conditions. Flour dust can form an explosive atmosphere, and liquids such as diesel fuel can be raised above their flashpoint temperature by work activities and present a fire or explosion risk. When carrying out hazardous area classification, relevant properties of a dangerous substance include the boiling point and flashpoint of any flammable liquid, and whether any flammable gas or vapour that may be evolved is lighter or heavier than air.","sub":95},{"k":"Guidance","r":"Paragraph 96","p":28,"t":"96 For dusts which are liable to form an explosive atmosphere, information will be needed on particle size and potential concentration in air.","sub":96},{"k":"Guidance","r":"Paragraph 97","p":28,"t":"97 A mass of solid combustible material as a heap or pile will burn relatively slowly owing to the limited surface area exposed to the oxygen of the air. A dust explosion involves the rapid combustion of dust particles that releases energy and usually occurs when dusts are dispersed in air, generating gaseous reaction products. A basic knowledge of the material’s properties together with the avoidance of deposition – and in particular deposition on elevated surfaces – of dusts/powders which are capable of rapid explosive burning in air should minimise the risks of a dust explosion.","sub":97},{"k":"Guidance","r":"Paragraph 98","p":28,"t":"98 Useful information on the properties and hazards of dangerous substances may be provided by suppliers, eg in an SDS. This could include details such as flashpoints or explosive or chemical properties. Other information could relate to safe methods of using, storing and handling the substances. Suppliers are required to make SDSs available for the chemicals they supply and they are a source of information on the classification of the substance. Further information on the background to this is in Appendix 3.","h":"Information on hazardous properties","sub":98},{"k":"Guidance","r":"Paragraph 99","p":28,"t":"99 The increased alignment in the EU CLP Regulation (classification, labelling and packaging) (no 1272/2008) towards a globally harmonised system of classification and labelling of substances and mixtures has led to a number of substances now meeting the criteria for classification as flammable. This is partly because the upper flashpoint for flammable liquid has been increased from 55 °C to 60 °C. The changes mean that for example, diesel, gas oil and light heating oils are now classified as flammable liquids.","sub":99},{"k":"Guidance","r":"Paragraph 100","p":28,"t":"100 However, many substances so classified may in fact not normally present a significant risk of fire as stored. Employers should adopt a proportionate approach in considering whether there are any justifiable further measures needed in addition to those widely used before this change, given that the risk itself has not changed.","sub":100},{"k":"Guidance","r":"Paragraph 101","p":28,"t":"101 Many dusts are not classified substances under CHIP and for these materials there is no legal requirement to provide an SDS. Suppliers should nevertheless be asked if they can supply any data relevant to assessing the fire and explosion risks. Where there is no SDS available in the case of intermediate products, mixtures or novel activities, perhaps under non-standard conditions, if databases such as the IFA GESTIS-Dust-Ex database available on the internet do not assist then further research and testing might be needed into the flammable/explosive hazards. This is also relevant under regulation 5(2)(j).","sub":101},{"k":"Guidance","r":"Paragraph 102","p":28,"t":"102 An assessment which made no reference to an SDS or similar information on hazardous properties researched in some other way would be unlikely to be considered suitable and sufficient especially if the risk was significant. However, some of the substances classified as flammable that have a high flashpoint may not give rise to a significant risk of fire unless processed at high pressure or at temperatures above their flashpoint. A detailed risk assessment for these substances on the way they are used or handled may indicate that fire risk reduction requirements can be relaxed to some degree.","sub":102},{"k":"ACOP","r":"Paragraph 103","p":29,"t":"103 When assessing and/or designing activities involving dangerous substances (such as work processes, process and storage plant and the workplace itself) all relevant factors must be taken into account, including: (a) properties of the substances, including corrosivity, reactivity, volatility, flashpoint and electrical conductivity; (b) quantities and storage methods, eg in bulk tanks or in containers; (c) location relative to other features, including adjacent premises, site boundaries, occupied buildings, process areas, heat sources, fixed sources of ignition, other dangerous substances and vehicle thoroughfares; (d) loading/unloading operations and frequency of deliveries.","h":"Circumstances of the work","sub":103},{"k":"ACOP","r":"Paragraph 104","p":29,"t":"104 The risk assessment should include consideration of whether work processes may give rise to flammable gases, vapours, mists or dusts in sufficient quantity to pose a risk of injury if ignited. The employer should consider the potential for the incident to escalate. Account should also be taken of possible accumulations of combustible dust which could be launched and dispersed into the air during an incident resulting in the formation of an explosive atmosphere.","sub":104},{"k":"ACOP","r":"Paragraph 105","p":29,"t":"105 When considering risks from releases of dangerous substances the following should be included: (a) unavoidable releases, such as during LPG cylinder/aerosol filling; (b) intentional releases, such as spray coating, solvent vapour emissions from drying ovens etc; and (c) foreseeable releases, for example leaks from process equipment or storage containers or spills during dispensing.","sub":105},{"k":"Guidance","r":"Paragraph 106","p":29,"t":"106 Adopt a methodical approach to considering the circumstances of the work activity, particularly the production processes. Consider the potential for and consequences of failures and/or errors or other foreseeable deviations from the way the work activity is carried out normally. The approach should be proportionate to the nature of the work activity and the risk it presents. Possible deviations and excursions from the norm are far more numerous for production processes than for a less dynamic storage activity. Guidance on safe storage is readily available (including some ‘off-the-shelf’ industry codes), whereas the wide variation possible in different production processes means that identifying potential failures during a process may need to be considered from first principles.","sub":106},{"k":"Guidance","r":"Paragraph 107","p":29,"t":"107 Employers need to consider potential hazards arising from equipment etc used in processing or handling dangerous substances. This includes equipment that may be brought into an area where dangerous substances are present as well as the equipment used in process operations themselves.","sub":107},{"k":"Guidance","r":"Paragraph 108","p":29,"t":"108 In taking account of the work activities involving dangerous substances when assessing risk, employers should include such activities as: (a) loading and unloading operations (and the frequency of delivery/dispatch of dangerous substances); (b) dispensing and decanting activities; (c) movement of dangerous substances around the site; and (d) how spillages and leaks are dealt with.","sub":108},{"k":"Guidance","r":"Paragraph 109","p":30,"t":"109 The size of any potential release of dangerous substances is in part related to the amount of dangerous substances present. Industry-specific codes from various sources provide guidance on the quantities of various dangerous substances that can be stored, for example: (a) Code of Practice 7 Storage of Full and Empty LPG Cylinders and Cartridges, produced by the UKLPG;9 (b) Guidance for the storage of gas cylinders in the workplace GN 2, produced by the British Compressed Gas Association.10","sub":109},{"k":"Guidance","r":"Paragraph 109 (continued)","p":30,"t":"(c) joint Chemical Business Association (CBA) and Solvents Industry Association (SIA) guidance: Guidance for the storage of liquids in intermediate bulk containers.11 (d) the Energy Institute’s Model Code of Safe Practice Part 15 Area Classification Code for Installations Handling Flammable Fluids;12 (e) HSE’s guidance on storage and use of flammable liquids: (i) The storage of flammable liquids in containers HSG51;13 (ii) The storage of flammable liquids in tanks HSG176;14 (iii) The safe use and handling of flammable liquids HSG140.15","h":"For further guidance on intermediate bulk container (IBC) storage, see"},{"k":"Guidance","r":"Paragraph 110","p":30,"t":"110 Some combinations of dangerous substances may react together to form an ignition source, or in combination may form an explosive atmosphere where singly this does not occur. Such possibilities should be considered in the risk assessment. For example: (a) where substances are used together in a chemical process it will be necessary to carry out a chemical reaction hazard assessment to identify any adverse conditions that could give rise to hazardous heat and pressure effects; (b) where different substances are stored, incompatible materials, such as self- reactive substances and flammable liquids, should not be kept together; (c) where substances with different properties are processed together the fire properties of any resulting mixture will be different from the individual components. The properties of the mixture must be known to ensure, for example, any electrical equipment is suitable and any explosion relief provided is appropriate; (d) oxygen and other oxidising agents make most flammable substances easier to ignite, burn faster and become more difficult to extinguish. Many materials that are not classified as dangerous substances will become dangerous in the presence of an oxygen-enriched atmosphere or an oxidising agent. Where oxygen or other oxidising agents are used near to dangerous substances or combustible materials, the assessment must take into account the enhanced flammability properties.","sub":110},{"k":"ACOP","r":"Paragraph 111","p":30,"t":"111 Employers must carry out a risk assessment before undertaking any non- routine activity which potentially increases the risk, such as process scale-up, maintenance, repair, modification, extension, restructuring, demolition or cleaning: (a) in areas where dangerous substances are present or liable to be present, including where they are used, stored or produced; (b) on equipment that has contained a dangerous substance.","h":"Risk assessment of non-routine maintenance and related higher-risk activities","sub":111},{"k":"ACOP","r":"Paragraph 112","p":31,"t":"112 Employers must identify and take into account: (a) the types of dangerous substance that may be present or that may become dangerous as a result of the work activity; (b) the fire and explosion hazards arising from the proposed work; (c) the necessary control and mitigation measures to enable the work to be carried out safely; (d) the appropriate system of work to ensure that the control and mitigation measures essential for safety are properly understood and implemented; (e) if written instructions need to be provided for non-routine tasks to ensure appropriate control and mitigation measures are implemented. This could be a written permit-to-work system or method statement/ instructions for entry to nominally empty vessels for inspection for example.","sub":112},{"k":"Guidance","r":"Paragraph 113","p":31,"t":"113 In addition to ‘normal’ (ie routine) activities such as storage or manufacturing processes, some activities (such as less-routine or less-frequent maintenance and repair and cleaning) may require specific procedures that expose workers to risks from dangerous substances. For example, dismantling equipment containing dangerous substances or introducing ignition sources into a hazardous area. The lack of familiarity and practice alone may increase risk of errors.","sub":113},{"k":"Guidance","r":"Paragraph 114","p":31,"t":"114 Non-routine activities should be considered and included in a risk assessment, as they may create risks not normally present in the place where the activity occurs and may affect the area classification (see regulation 7). It may be possible to remove the dangerous substance before the non-routine work activity starts or take special control measures to prevent the release of any dangerous substance during the work. Any additional risks associated with the activity should be assessed before work starts.","sub":114},{"k":"Guidance","r":"Paragraph 115","p":31,"t":"115 Factors which should be considered in the assessment for any maintenance, repair, modification, extension, restructuring, demolition or cleaning activities include: (a) the materials that are being used or may have been used in the area or plant where the activity is to be carried out; (b) which materials are dangerous substances or may become hazardous under the conditions of the proposed work. This includes residues or by-products that may occur or build up inside plant or any materials that could be released by the proposed activity, for example: (i) combustible liquids with a flashpoint above 60 °C but below the temperature of the hot work during which they can evaporate to give rise to an explosive atmosphere (eg heavy fuel oil or olive oil); (ii) some materials may not be classified as flammable/combustible and will have either an extremely high or no flashpoint assigned, but may ignite under certain conditions; (iii) combustible dusts which may be dispersed to give rise to an explosive atmosphere or cause latent smouldering hazards (eg wood dust); (iv) any substance that can decompose under the conditions of the hot work to give off flammable components which may then gi
