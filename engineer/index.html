ther purposes, such as to prevent contact with substances hazardous to health, will not create electrostatic discharges if used in an explosive atmosphere.","sub":250},{"k":"Guidance","r":"Paragraph 251","p":55,"t":"251 Antistatic or ordinary clothing should not be removed in places where an explosive atmosphere may occur. A safe area should be established where workers are able to remove or change clothing etc. Electrostatic risks can be created by personal items brought into a hazardous area, and employers should provide instructions for employees or visitors. Where necessary, employers should ensure that visitors have appropriate antistatic clothing and should ensure that the rules set out in management procedures are followed.","sub":251},{"k":"Guidance","r":"Paragraph 252","p":55,"t":"252 Fan impellers necessarily have to be in the path of the dangerous substances being extracted, but the source powering them should be effectively separated from the dangerous substance. Such electric fan motors should be sited outside exhaust ducting in a position where they can be readily inspected, cleaned and maintained to avoid ignition or build-up of residues leading to overheating.","sub":252},{"k":"Guidance","r":"Paragraph 253","p":55,"t":"253 Fans, impellers and couplings/casings within the ducting must be properly designed and installed to avoid ignition from static discharge, frictional sparking or rubbing. Where a fan and motor are located in a classified zone of a hazardous place the fan motor design should be ATEX certified as suitable for use in that zone. Where an integral MEV fan assembly is installed in a wall leading directly to outside, it will need to be ATEX-compliant for the zone. A relevant design standard for fans on MEV systems in relation to hazardous explosive atmospheres is BS EN 14986.35","sub":253},{"k":"Guidance","r":"Paragraph 254","p":55,"t":"254 The employer will need to decide whether ignition sources can be allowed into the work area on a temporary basis. This should be based on a consideration of the risks of a flammable/explosive atmosphere being formed during the time such an ignition source is present.","sub":254},{"k":"ACOP","r":"Paragraph 255","p":55,"t":"255 Where mixtures of dangerous substances are incompatible, they should be separated or segregated to minimise the risks. Where limited space at premises means that it is not feasible to separate substances from other substances or hazards by distance alone, then segregation should be achieved by the provision of physical partitions of fire-resisting construction.","h":"Segregation of incompatible dangerous substances","sub":255},{"k":"Guidance","r":"Paragraph 256","p":55,"t":"256 Where incompatible dangerous substances are separated by distance, the risk assessment should demonstrate that the risk of propagation of fire between those substances is low. General guidance on storing packaged dangerous materials is contained in Chemical warehousing: The storage of packaged dangerous substances.36","sub":256},{"k":"Guidance","r":"Paragraph 257","p":56,"t":"257 Although DSEAR requires only incompatible dangerous substances to be segregated, the general duties under the HSW Act mean segregation of any incompatible substances is required. For example, a risk arises where corrosive materials are stored if a release of the corrosive material could cause the containers for dangerous substances to fail. Materials defined as dangerous substances will include those that have been classified because of hazardous properties such as accelerated burning or because they can release flammable gas products.","sub":257},{"k":"Guidance","r":"Paragraph 258","p":56,"t":"258 Mixing of incompatible dangerous substances may occur if: (a) a dangerous substance is sent to the wrong tank; (b) if the contents of a delivery vehicle are not the same as the dispatch note or are out of specification; or (c) if a tank is used to store a new material before the residues of the previous contents are adequately cleaned out.","sub":258},{"k":"Guidance","r":"Paragraph 259","p":56,"t":"259 The risks may be controlled by measures such as: (a) clear labelling of transfer lines; (b) provision of dedicated transfer lines rather than temporary flexible hoses with complex valve manifolds; (c) use of different types of couplings for incompatible products; (d) simple checks on the contents of incoming road tankers; (e) written systems of work concerning tank cleaning.","sub":259},{"k":"ACOP","r":"Paragraph 260","p":56,"t":"260 Regulation 6(5) details the measures that 6(3)(b) requires to be applied to reduce the consequences of an incident. Premises layout and equipment installation can mitigate the effects of a fire or explosion in cases where substance quantity/properties would have particular influence on the scale or nature of an incident. The following list is not in priority order. Employers should ensure: (a) adequate separation of process areas from: (i) other parts of the premises; (ii) the site boundary; (iii) bulk storage areas; (b) measures are taken to prevent fire and explosion from spreading to other equipment; (c) process areas are separated from the rest of the building by physical barriers that are fire-resisting structures; (d) physical barriers are provided where they will help to prevent damage to containers, vessels, pipework and other equipment; (e) nominally empty containers are removed from process and work areas back to a safe place; (f) adequate separation of storage areas: (i) from site boundaries; (ii) from occupied buildings; (iii) from process areas; (iv) from fixed ignition sources and other features that pose a threat; (v) between other dangerous substances within storage areas; (g) sufficient separation to allow people to escape from fire at a store and which prevents or delays fire spread; (h) any store is constructed to protect it from unauthorised access and from fire occurring elsewhere including on the boundary; (i) where rooms storing dangerous liquids or gases are inside buildings, they are either: (i) a clearly identified dedicated room or building adequately separated from other buildings, workrooms or hazards; or (ii) fire-resisting structures (and again their contents clearly identifiable); (j) bulk compressed gas and liquefied flammable gas tanks are not sited within buildings; (k) that where compressed flammable gases and liquefied flammable gases such as LPG are stored underground, they are in suitable underground reservoirs and caverns which are not sited beneath any building or similar structure where a dangerous accumulation of gas could occur; (l) cupboards, bins, tanks, vessels and containers (whether nominally empty or not) which contain a dangerous substance are clearly identified and any openings in them are kept closed except when in use or operation or being maintained; (m) dispensing or decanting are not carried out in a bulk storage area where other dangerous substances are stored.","h":"Mitigation – avoiding propagation","sub":260},{"k":"Guidance","r":"Paragraph 261","p":57,"t":"261 Where lack of space means that a physical barrier of fire-resisting construction must be provided to protect (or protect against) any feature, the design and performance requirements for the barrier depend on its particular function.","sub":261},{"k":"Guidance","r":"Paragraph 262","p":57,"t":"262 Structures required to serve as a physical barrier of fire-resisting construction where the dangerous substance is either extremely or highly flammable or where a substance is stored or used at a temperature above or near to its flashpoint should meet the relevant fire safety performance requirements detailed in paragraphs 266–280.","sub":262},{"k":"Guidance","r":"Paragraph 263","p":57,"t":"263 For outdoor storage, adequate separation can be achieved by locating the storage facility at an appropriate distance from other specific features or potential hazards. Alternatively, a physical barrier such as a fire-resisting wall or partition can be used. For products which are dusts, or contain a proportion of dusts, these issues are covered in Safe handling of combustible dusts HSG103.37","sub":263},{"k":"Guidance","r":"Paragraph 264","p":57,"t":"264 For most dangerous substances, advice on adequate separation is detailed in HSE or industry codes of practice and guidance. These may be specific to the dangerous substance (eg LPG) or be of a generic nature (eg flammable liquids).","sub":264},{"k":"Guidance","r":"Paragraph 265","p":57,"t":"265 Where such advice is not available or is inappropriate due to the quantity of dangerous substance stored or manner of its use, the necessary separation distances to achieve safety will need to be determined from first principles and by taking into account any additional fire mitigation measures such as water deluge systems or monitors.","sub":265},{"k":"ACOP","r":"Paragraph 266","p":57,"t":"266 The periods of fire resistance required should be determined by assessment of the fire hazard, taking account of its anticipated duration and severity.","h":"Physical barriers of fire-resisting construction – design and performance requirements","sub":266},{"k":"Guidance","r":"Paragraph 267","p":57,"t":"267 Physical barriers of fire-resisting construction should be capable of maintaining adequate fire protection to allow sufficient time for evacuation and for emergency procedures to be implemented. Fire walls are a physical barrier of fire-resisting construction and may be part of a building or free-standing structures in the open air. This fire safety performance is specified in terms of: (a) resistance to fire; and (b) reaction to fire.","sub":267},{"k":"Guidance","r":"Paragraph 268","p":58,"t":"268 Definitions and technical specifications for these terms are given in Appendix 4 ‘Fire resistance’ and Appendix 5 ‘Fire reaction’.","sub":268},{"k":"Guidance","r":"Paragraph 269","p":58,"t":"269 Although these fire safety performance standards are not mandatory, they may be suitable in cases where the dangerous substance present is known to be flammable.","sub":269},{"k":"Guidance","r":"Paragraph 270","p":58,"t":"270 Compliance with the fire test standards referred to above may be demonstrated by testing, or by building the structure using materials and construction methods that are capable of providing the required fire safety performance.","sub":270},{"k":"ACOP","r":"Paragraph 271","p":58,"t":"271 Storerooms and workrooms required to be of fire-resisting construction (ie fire resisting) should meet the following minimum requirements: (a) every enclosing element that acts as a fire-resisting physical barrier should provide a minimum of 30-minutes’ fire resistance in respect of integrity, insulation and, where applicable, load-bearing capacity. ‘Enclosing element’ includes every internal wall (including any door), floor (other than a floor on the ground), ceiling and its associated floor (other than the top or ceiling of a single-storey building or of a top-floor room), and any external wall that serves as a fire wall; (b) if the room is within a building that also contains residential accommodation, the partition between the two should provide a minimum of 60-minutes’ fire resistance with no connecting doors or direct access between the two parts of the building; (c) storerooms should not contain any glazed area in any fire-resisting physical barrier except as permitted in a door; (d) any door in a fire-resisting physical barrier should be self-closing from any position. Such a door may have a glazed viewing panel provided that it does not exceed an area of 20% of the door. Any glazing should satisfy the integrity requirements, which can be achieved by using Georgian-wired glass or a proprietary fire-resisting glazing panel. The area of such panels should be kept to a minimum so far as reasonably practicable; (e) the materials used in the construction of a store or workroom should as a minimum have a ‘low risk’ in respect of their reaction to fire (see Appendix 5). (For storerooms in which LPG cylinders are stored, only materials that have a ‘minimal risk’ should be used.) This limitation does not apply to doors and windows together with their associated frames and any provision made for explosion relief; (f) openings in the internal partitions of a workroom are allowed, provided: (i) where they are to accommodate ducts, trunks and casings, these are of fire-resisting construction; (ii) where they are for any other purpose (such as to allow the movement of items on a production line), a fire/smoke damper should be installed that, together with its frame, can provide a minimum of 30-minutes’ fire resistance in respect of integrity; (g) the junction between each part of a fire-resisting physical barrier should be sufficiently bonded or fire-stopped to ensure that the fire resistance is not compromised.","sub":271},{"k":"ACOP","r":"Paragraph 272","p":59,"t":"272 Cabinets, enclosures (including any oven used solely for the evaporation of dangerous substances from materials contained therein), cupboards and bins that are required to be of fire-resisting construction should meet the following minimum requirements: (a) every side, top, floor, door and lid should provide a minimum of 30-minutes’ fire resistance in respect of integrity. This requirement may be waived in respect of: (i) the glazed panel of any fume cabinet or glove box; (ii) any booths where a screen is provided for environmental or quality control purposes; (iii) where provision is made for explosion relief; (iv) cupboards and bins where provision is made for ventilation.","sub":272},{"k":"ACOP","r":"Paragraph 273","p":59,"t":"273 If there is need for a viewing panel on an oven used for the evaporation of dangerous substances, this should be provided by using Georgian-wired glass or a proprietary fire-resisting glazing panel. In all other circumstances, the fire resistance integrity requirements should be maintained for cabinets, enclosures, cupboards and bins which should: (a) be constructed of materials which are, so far as reasonably practicable, of ‘minimal risk’ in respect of their reaction to fire (see Appendix 5); (b) be supported and fastened to prevent structural collapse in case of fire for at least 30 minutes. The supports and fastenings should be of high melting point material (in excess of 750 °C).","sub":273},{"k":"ACOP","r":"Paragraph 274","p":59,"t":"274 Ducts, trunks and casings that are required to be of fire-resisting construction should meet the following minimum requirements: (a) provide 30-minutes’ fire resistance in respect of integrity and be constructed from materials that have a ‘minimal risk’ (see Appendix 4) in respect of their reaction to fire, so far as reasonably practicable, except at points where provision is made for explosion relief; (b) be supported and fastened to prevent structural collapse in case of fire for at least 30 minutes. The supports and fastenings should be of high melting point material (in excess of 750 °C).","sub":274},{"k":"ACOP","r":"Paragraph 275","p":59,"t":"275 Cabinets, ovens, cupboards, bins, ducts, trunks and casings should be bonded or fire-stopped to prevent or retard the passage of flame and hot gases for a period of at least 30 minutes.","sub":275},{"k":"ACOP","r":"Paragraph 276","p":59,"t":"276 Fire walls, storerooms, workrooms, cabinets, ovens, cupboards, bins, ducts, trunks and casings must be sufficiently robust so that their integrity in respect of fire resistance will not be damaged by any foreseeable event. This includes wear and tear from normal operational activities such as collision damage from vehicles or forklift trucks and blast over-pressure when the risk assessment identifies an explosion as a likely event.","sub":276},{"k":"ACOP","r":"Paragraph 277","p":59,"t":"277 Where fire walls and fire-resisting structures provide containment for leaks of dangerous substance and/or prevent any escaping vapours from reaching an ignition source while still flammable, such barriers should not be perforated by any openings. They should be constructed to withstand contact with the dangerous substance in the form and quantity that might foreseeably occur in the event of an accident.","sub":277},{"k":"ACOP","r":"Paragraph 278","p":59,"t":"278 The reaction to fire of the external surface of a storeroom, workroom or fire wall should be to the standard required under the relevant building legislation or that appropriate to the activity being carried out on that (external) side of the barrier, whichever is the higher standard.","sub":278},{"k":"ACOP","r":"Paragraph 279","p":60,"t":"279 When any surface of a structure is liable to be coated with residues, the structure should be sufficiently durable so that removing the residues will not reduce its fire resistance or capacity to resist the spread of flames.","sub":279},{"k":"Guidance","r":"Paragraph 280","p":60,"t":"280 The risk assessment should consider the need for suitable pressure-relieving devices and appropriate fire protection and take into account foreseeable events including: (a) fires involving releases of dangerous substances from other plant; (b) other fires on site or at the boundary not involving a dangerous substance; (c) sudden warming of cryogenic substances as a result of normal and abnormal operating conditions or following changes in atmospheric conditions; and (d) thermal expansion of enclosed or trapped liquids caused by atmospheric warming or fire.","sub":280},{"k":"ACOP","r":"Paragraph 279 (continued)","p":60,"t":"Measures to mitigate the effects of an explosion (including explosion relief, suppression and pressure-resistant plant)"},{"k":"ACOP","r":"Paragraph 281","p":60,"t":"281 Where there is the potential for an explosion to occur involving dangerous substances used, generated or otherwise present, employers must provide appropriate and sufficient protective systems to halt incipient explosions immediately and/or to limit the range of an explosion to minimise the risk. Protective systems may be either: (a) plant that is constructed to withstand the pressure that may potentially result from an explosion without failure; or (b) explosion protection measures taken to restrict the spread and effects of the explosion within both the plant and the workplace.","sub":281},{"k":"ACOP","r":"Paragraph 282","p":60,"t":"282 For highly toxic substances, explosion suppression or explosion- resistant plant should be used, or vented materials should be otherwise safety dealt with.","sub":282},{"k":"ACOP","r":"Paragraph 283","p":60,"t":"283 The employer should ensure any such mitigation measure has been designed, constructed, assembled and installed, and is maintained and operated, to minimise the risk of exposing people to the physical effects of the explosion, which include pressure, flame, projectiles and the operation of the mitigation measure.","sub":283},{"k":"ACOP","r":"Paragraph 284","p":60,"t":"284 Steps should be taken to prevent any measures provided to counteract propagation through interconnected plant failing in a manner that might expose people to the harmful effects of the explosion.","sub":284},{"k":"ACOP","r":"Paragraph 285","p":60,"t":"285 Protective systems provided for use after 30 June 2003 should comply with the requirements of regulation 7(2) and Schedule 3 of these Regulations. Protective systems supplied after this date should also comply with EPS; ie the supplier has the duty to ensure that the equipment satisfies the relevant essential health and safety requirements and that the appropriate conformity assessment procedure has been carried out.","sub":285},{"k":"Guidance","r":"Paragraph 286","p":60,"t":"286 One or more of the relevant essential health and safety requirements for a protective system may be covered by a harmonized standard adopted by the European Committee for Standardisation or the European Committee for Electrotechnical Standardisation.38–46","sub":286},{"k":"Guidance","r":"Paragraph 287","p":61,"t":"287 Where protective systems are supplied as an integral part of plant or equipment (eg storage vessel, bucket elevator) their conformity is assessed during the conformity assessment of the equipment they are integrated with. This should include, where relevant, compliance with the technical standard(s) applicable to the protective system(s) integrated into the plant or equipment (EC ATEX Guidelines (Third edition) Section 3.8,47 the EPS Regulations and BS 5908-248).","sub":287},{"k":"Guidance","r":"Paragraph 288","p":61,"t":"288 Explosion protection measures for plant and equipment processing dangerous substances include explosion relief venting, explosion suppression equipment, pressure-shock-resistant plant and pressure-resistant plant. The design of the protection measure should mitigate possible explosions by: (a) relieving the explosion pressures and/or hot gases to a safe place outside of the workroom; (b) suppressing the explosion before dangerous pressures build up; and (c) safely containing the explosion without the plant rupturing.","sub":288},{"k":"Guidance","r":"Paragraph 289","p":61,"t":"289 Plant and equipment normally requiring explosion protection or emergency relief venting, include: (a) ovens and dryers normally operating with concentrations of dangerous substances below 25% of the LEL but without sufficient process control to prevent deviations above 25% LEL; (b) ovens and dryers operating with concentrations of dangerous substances above 25% of the LEL; (c) reactors where there is a significant residual risk from the process of a runaway reaction (unless alternative protection measures are provided such as crash cooling, reaction inhibition and quenching); (d) cyclones, dust filters and other dust-handling plant where there is a risk of ignition; (e) spray dryers producing combustible dusts; (f) silos storing combustible dusts; (g) aerosol filling rooms using liquefied flammable gases; (h) other plant and equipment in which explosive atmospheres may occur and ignition sources cannot be eliminated; (i) storerooms for highly flammable and extremely flammable liquids; and storage of compressed and liquefied flammable gas in buildings.","sub":289},{"k":"Guidance","r":"Paragraph 290","p":61,"t":"290 An explosion in a classified area may affect the safety of people in an unclassified area, eg an explosion in an item of equipment may endanger someone standing nearby, even though there is normally no flammable material outside the equipment.","sub":290},{"k":"ACOP","r":"Paragraph 291","p":61,"t":"291 An employer should assess, plan and implement arrangements for movement of dangerous substances on any work premises which are under their control.","h":"Transport of dangerous substances on site","sub":291},{"k":"Guidance","r":"Paragraph 292","p":61,"t":"292 This regulation applies to on-site operations only, not to public roads. Such premises would not normally include the public highway unless it forms an integral part of the work premises when special measures may be required. The Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations 2009 will apply off site on the public highway.","sub":292},{"k":"Guidance","r":"Paragraph 293","p":61,"t":"293 Under regulation 5(2)(c)(iv), the employer should have already assessed the risks associated with transport, handling and storage of dangerous substances.","sub":293},{"k":"ACOP","r":"Paragraph 294","p":62,"t":"294 From the risk assessment under regulation 5(2)(c)(iv) employers should decide upon and then implement appropriate control measures to ensure the safety of employees and others during the handling and storage and before or during disposal of waste materials which contain dangerous substances. Where appropriate the management arrangements should include: (a) consideration of the hazardous properties of the waste materials; (b) prevention of waste materials from different sources and of different composition being mixed without appropriate consideration of their compatibility; (c) safe storage in suitable containers, labelled according to their hazardous properties; (d) procedures and precautions for the safe collection and mixing of waste materials; (e) prompt removal from workrooms of empty and nominally empty containers which may still contain residues of dangerous substances. These should then be stored according to the requirements of full containers while awaiting disposal in an appropriate manner.","h":"Waste containing dangerous substances","sub":294},{"k":"Guidance","r":"Paragraph 295","p":62,"t":"295 Employers should also be aware of, and take account of, other legislation covering the disposal of waste. Guidance on waste handling and disposal can be found on the following websites: • the Environment Agency in England www.environment-agency.gov.uk/business/sectors/wastemanagement.aspx • the Scottish Environment Protection Agency www.sepa.org.uk/waste.aspx • Natural Resources Wales Cyfoeth Naturiol Cymru http://naturalresourceswales.gov.uk • Industry guidance is also available. For example, for gases, British Compressed Gases Association leaflet GN 2.10","sub":295},{"k":"Guidance","r":"Paragraph 296","p":62,"t":"296 The level of security for the storage area will depend on the potential consequences of a fire and the general security already provided for the premises. Security measures will need to take into account the possibility of arson and vandalism as well as the general site fire precautions and control measures. Examples of security measures include locks on storeroom doors, welded mesh or chain-link fencing, intruder alarms, security patrols and lockable covers to filling and discharge connections.","h":"Security","sub":296},{"k":"ACOP","r":"Paragraph 297","p":62,"t":"297 Existing control and mitigation measures may need to be improved, extended or replaced, using a system of experience reviews. Measures selected should be appropriate to the work activity, consistent with the risk assessment and sufficient to reduce the risk so far as reasonably practicable.","h":"Review of control and mitigation measures","sub":297},{"k":"ACOP","r":"Paragraph 298","p":62,"t":"298 If a residual risk remains after implementing all reasonably practicable precautions in the plant, process control, mitigation and safe systems of work, workers should – as a last resort – be provided with suitable personal and respiratory protective equipment (PPE/RPE). PPE and RPE must never be viewed as a first line of defence.","h":"Residual risk","sub":298},{"k":"Guidance","r":"Paragraph 299","p":63,"t":"299 The employer, having carried out all the required assessment and subsequent implementation work, should continue to actively ensure that the conditions they have created are maintained both in terms of hardware (plant etc) and software, and in terms of people and systems such as management procedures. For example, they should ensure their standard operating procedures are followed.","sub":299},{"k":"Guidance","r":"Paragraph 300","p":63,"t":"300 Employers should periodically check and review the measures they have in place (as required by regulation 5(3)) to ensure that the equipment provided is maintained. Schedule 1 General safety measures Summary of Schedule 1 to regulation 6(8) The measures in Schedule 1 are an integral part of regulation 6 and for this reason, the Schedule has been incorporated within this section.","sub":300},{"k":"Law","r":"Schedule 1, paragraph 1 (continued)","p":63,"t":"1 The following measures are those specified for the purposes of regulation 6(8).","sub":1},{"k":"Law","r":"Schedule 1, paragraph 2","p":63,"t":"2 Ensuring that the workplace is designed, constructed and maintained so as to reduce risk.","h":"Workplace and work processes","sub":2},{"k":"Law","r":"Schedule 1, paragraph 3","p":63,"t":"3 Designing, constructing, assembling, installing, providing and using suitable work processes so as to reduce risk.","sub":3},{"k":"Law","r":"Schedule 1, paragraph 4","p":63,"t":"4 Maintaining work processes in an efficient state, in efficient working order and in good repair.","sub":4},{"k":"Law","r":"Schedule 1, paragraph 5","p":63,"t":"5 Ensuring that equipment and protective systems meet the following requirements – (a) where power failure can give rise to the spread of additional risk, equipment and protective systems must be able to be maintained in a safe state of operation independently of the rest of the plant in the event of power failure; (b) means for manual override must be possible, operated by employees competent to do so, for shutting down equipment and protective systems incorporated within automatic processes which deviate from the intended operating conditions, provided that the provision or use of such means does not compromise safety; (c) on operation of emergency shutdown, accumulated energy must be dissipated as quickly and as safely as possible or isolated so that it no longer constitutes a hazard; and (d) necessary measures must be taken to prevent confusion between connecting devices.","sub":5},{"k":"Law","r":"Schedule 1, paragraph 6","p":63,"t":"6 The application of appropriate systems of work including – (a) the issuing of written instructions for the carrying out of the work; and (b) a system of permits to work with such permits being issued by a person with responsibility for this function prior to the commencement of the work concerned, where the work is carried out in hazardous places or involves hazardous activities.","h":"Organisational measures","sub":6},{"k":"ACOP","r":"Paragraph 301","p":64,"t":"301 The workplace, including the location of equipment, should be designed, constructed and maintained to prevent releases of dangerous substances accumulating in sufficient quantity that ignition could result in a fire and/or explosion or ‘other events’ that may lead to injury. In particular: (a) except where specially designed for the purpose, flammable liquid spills should be prevented from accumulating in the workplace; (b) workplace ventilation should be sufficient to prevent accumulations of flammable vapours forming an explosive atmosphere; and (c) combustible dusts should be prevented from accumulating to such an extent that, if dispersed and they became airborne, an explosive atmosphere would result.","h":"Design considerations","sub":301},{"k":"ACOP","r":"Paragraph 302","p":64,"t":"302 The employer should ensure the plant and equipment and storage conditions, including arrangements for heating the workplace, will not cause the dangerous substances to ignite, self-heat or thermally decompose.","sub":302},{"k":"Guidance","r":"Paragraph 303","p":64,"t":"303 Where it is intended to carry out chemical reactions it will be necessary to carry out a chemical reaction hazard assessment as part of the assessment required by regulation 5. This should provide sufficient information on the reaction kinetics, quantities and rates of heat and any gas generation to allow the plant to be designed safely with the correct process controls and operating conditions. This should include, as necessary: (a) materials of construction; (b) vessel design pressure; (c) agitator configuration and speed; (d) reactant feed controls; (e) safe operating temperatures and pressures; (f) heat transfer and cooling rates; (g) process instrumentation and interlocks; (h) process venting; (i) safe method of reaction quenching.","sub":303},{"k":"Guidance","r":"Paragraph 304","p":64,"t":"304 Both normal operation and the effects of foreseeable process faults should be considered during the chemical reaction hazard assessment. Further information on the assessment and control of chemical reaction processes is given in Designing and operating safe chemical reaction processes.49","sub":304},{"k":"ACOP","r":"Paragraph 305","p":64,"t":"305 Where plant is designed for the deliberate combustion of dangerous substances, it is necessary to prevent or reduce the risk of an explosion by implementation of appropriate control and mitigation measures. As a minimum, controls are needed to ensure: (a) safe fuel levels before the application of an ignition source; (b) adequate supply of air for safe combustion of fuel and/or cooling of plant; (c) controlled fuel flow to the combustion process ensuring unburnt fuel does not accumulate; (d) unintentional interruption of the process is corrected; (e) plant shutdown does not result in the formation of an explosive atmosphere; (f) plant used for disposal by combustion is suitable for purpose and is operated by adequately trained staff.","h":"Deliberate combustion of dangerous substances","sub":305},{"k":"ACOP","r":"Paragraph 306","p":65,"t":"306 Maintenance, repair, modification, extension, restructure, demolition or cleaning activities should be carried out in accordance with the appropriate safe system of work, identified in the risk assessment. Before these activities take place, where it is not reasonably practicable to eliminate stocks, spillages or contamination with dangerous substances, employers should: (a) minimise the presence of and avoid the release of dangerous substances; (b) prevent an explosive atmosphere forming by inerting or adequate ventilation; (c) prevent ignition sources from being introduced into the work area; and (d) provide appropriate emergency arrangements and equipment.","h":"Safe systems of work","sub":306},{"k":"Guidance","r":"Paragraph 307","p":65,"t":"307 The use of dangerous substances for cleaning purposes should be avoided wherever possible. Where this is necessary the employer should ensure that the substance with the least hazardous properties is selected.","h":"Dangerous substances used as cleaning agents","sub":307},{"k":"Guidance","r":"Paragraph 308","p":65,"t":"308 For manual cleaning operations use of a dangerous substance should be minimised by applying it to an article or surface in small sections at a time. There must be adequate ventilation of the work area and so far as reasonably practicable, elimination of ignition sources. Properly designed safety containers should be used to handle and dispense dangerous substances.","sub":308},{"k":"Guidance","r":"Paragraph 309","p":65,"t":"309 Where dangerous substances are introduced into plant or equipment for cleaning employers should ensure that any additional hazards, including their compatibility with other dangerous substances present, are identified and appropriate control measures are implemented.","sub":309},{"k":"Guidance","r":"Paragraph 310","p":65,"t":"310 Cleaning plant and equipment is a hazardous activity and the employer will also, where necessary, need to create systems to: (a) isolate plant and equipment from sources of dangerous substances; (b) control ignition sources in any additional hazardous zones created by the work; (c) establish acceptable concentrations of dangerous substances for particular work activities; (d) monitor the concentration of dangerous substances within the plant and in the surrounding area; (e) maintain concentrations of dangerous substances below predetermined safe limits by ventilation or inerting techniques; (f) establish action limits and procedures should the predetermined limits be exceeded during cleaning work; and (g) ensure that the plant or equipment is inspected by a competent person and is declared clean and safe for the intended work.","sub":310},{"k":"Guidance","r":"Paragraph 311","p":65,"t":"311 Where entry into tanks or plant is required the employer will also need to take into account the requirements of the Confined Spaces Regulations 1997 (SI 1997/1713).","sub":311},{"k":"Guidance","r":"Paragraph 312","p":65,"t":"312 Industry guidance on tank cleaning is published by the Energy Institute in the Tank cleaning safety code.50 Inerting means rendering the dangerous substance inactive, which usually means removing air from the tank.","sub":312},{"k":"Guidance","r":"Paragraph 313","p":66,"t":"313 Employers should ensure that there is a system of work that ensures that the control measures for a particular activity are properly understood and implemented and that an appropriate level of control is in place. The level of control will depend on the risks associated with the activity and may be based on simple operating procedures, safety method statements or a permit-to-work system.","h":"Systems of work","sub":313},{"k":"Guidance","r":"Paragraph 314","p":66,"t":"314 For low-risk activities adequate control measures should be implemented through supervision or a system of work that may include the use of written operating procedures.","h":"Operating procedures (low-risk activities)","sub":314},{"k":"Guidance","r":"Paragraph 315","p":66,"t":"315 Low-risk activities are those activities that do not increase the level of risk associated with the work normally carried out in that area. They do not, for example, introduce ignition sources into the work area or create a risk of releasing dangerous materials. They may include: (a) routine cleaning operations; (b) dealing with small leaks and spills during normal manufacturing or handling operations; and (c) routine machine and equipment adjustments.","sub":315},{"k":"Guidance","r":"Paragraph 316","p":66,"t":"316 For medium-risk activities the employer should ensure that appropriate control measures are implemented through the use of safety method statements.","h":"Safety method statements (medium-risk activities)","sub":316},{"k":"Guidance","r":"Paragraph 317","p":66,"t":"317 Medium-risk activities include maintenance, repair and servicing activities carried out by employees and contractors within or near to hazardous areas or on plant or equipment containing a dangerous substance. They may involve work that releases small quantities of dangerous substances but they should not have the potential to release a significant quantity. A ‘significant quantity’ is considered to be one that could create explosive atmospheres beyond the hazardous areas already designated for the installation or one that could affect the health and safety of others on or off the site. Medium-risk activities are also those which do not introduce ignition sources into hazardous areas.","sub":317},{"k":"Guidance","r":"Paragraph 318","p":66,"t":"318 Such activities may include: (a) leak testing tanks and lines; or (b) hot work in areas where there are only small quantities of dangerous substances present that do not give rise to hazardous places, eg laboratories or motor vehicle workshops.","sub":318},{"k":"Guidance","r":"Paragraph 319","p":66,"t":"319 A safety method statement is a written procedure to cover a particular non- routine task. As well as specifying the work to be done it will also identify the hazards associated with the work and the measures necessary to control those hazards. For repetitive tasks a generic safety method statement can be used and, where necessary, modified to take into account job-specific requirements or deviations. Safety method statements are inappropriate for high-risk activities which should be subject to a permit-to-work system (see paragraphs 321–327). However, safety method statements may be incorporated into the permit-to-work system.","sub":319},{"k":"Guidance","r":"Paragraph 320","p":66,"t":"320 The safety method statement, whether it is prepared in-house or by outside contractors, should be clear, concise and contain the following information: (a) a description of the task and where it is to be carried out; (b) the sequence and method of work; (c) the hazards identified during the risk assessment; (d) the skills required to deal with the hazards; (e) the precautions necessary to control the hazards; (f) references to specific safety procedures covering known hazards; (g) details of any isolations and any related control procedures; (h) details of tools and equipment to be used; (i) method of disposal of waste and debris; and (j) details of the state or condition in which the plant or equipment will be left at the end of the activity.","sub":320},{"k":"ACOP","r":"Paragraph 321","p":67,"t":"321 Where the proposed work is identified as a high-risk activity, employers should ensure that strict controls are in place and that the work is only carried out against previously agreed safety procedures. This should include implementing a permit-to-work system issued by a responsible person. They should be sufficiently knowledgeable about permit systems and the materials, processes, plant and equipment associated with the proposed work to be able to identify all the potential hazards and precautions.","h":"Permit-to-work systems (high-risk activities)","sub":321},{"k":"Guidance","r":"Paragraph 322","p":67,"t":"322 High-risk activities are those where the foreseeable consequences of an error or an omission could result in immediate and serious injuries, eg an explosion or a fire that immediately affects people or traps them. They will normally include: (a) hot work on or in any plant and equipment (including containers and pipes, eg storage tank, drum, cylinder, silo, pipeline, fuel tank etc) remaining in situ that contains or may have contained a dangerous substance; (b) carrying out hot work or introducing ignition sources in areas that are normally designated as hazardous due to the presence of an explosive atmosphere. (This includes places classified as hazardous under regulation 7(1)); (c) hot work in the vicinity of plant or equipment containing a dangerous substance where a potential outbreak of fire caused by the work might spread to threaten that plant and equipment; (d) entry into, and work in, a confined space which contains or has contained a dangerous substance or where the work activity introduces a dangerous substance into the confined space; and (e) opening or breaking into plant and equipment, or disconnecting a fixed joint that contains or has contained a dangerous substance (excluding routine activities such as charging, discharging and sampling which are themselves covered by other standard operating procedures).","sub":322},{"k":"Guidance","r":"Paragraph 323","p":67,"t":"323 Guidance on permit-to-work systems may be found on HSE’s website at www.hse.gov.uk/safemaintenance/permits.htm and in Guidance on permit-to-work systems HSG250.51","sub":323},{"k":"Guidance","r":"Paragraph 324","p":67,"t":"324 In the context of DSEAR, a permit-to-work is a documented system that authorises certain people to carry out specific work within a specified time frame. It sets out the precautions required to complete the work safely and should be based on a risk assessment. It will describe what work will be done and how it will be done – the latter can be detailed in an attached safety method statement (see paragraph 314).","sub":324},{"k":"Guidance","r":"Paragraph 325","p":67,"t":"325 The permit-to-work requires declarations from the person authorising the work and from the person carrying out the work. Where necessary it will also require a declaration from those involved in shift handover procedures or extensions to the work. Finally, where plant is to be put back into service, it will require a declaration from the originator of the permit that the work is complete and that the plant is ready for normal use.","sub":325},{"k":"Guidance","r":"Paragraph 326","p":68,"t":"326 The permit-to-work should be clearly laid out and avoid statements which could be misleading and ambiguous. It should be designed to allow for use in unusual circumstances and detail procedures if the work needs to be suspended for any reason.","sub":326},{"k":"Guidance","r":"Paragraph 327","p":68,"t":"327 As well as detailing the precautions that need to be taken to prevent a fire or explosion, the permit-to-work should cover the precautions that are required to control health hazards and where necessary the hazards arising from entry into confined spaces, electric shock, high-pressure systems and contact with moving equipment.","sub":327},{"k":"ACOP","r":"Paragraph 328","p":68,"t":"328 Hot work and maintenance processes that involve the application of heat or generation of sparks should be eliminated wherever reasonably practicable. Where it is not possible to do so, before work commences employers should: (a) risk assess and implement appropriate safety procedures for all activities; (b) make plant and equipment safe to eliminate residual dangerous substances by isolation and by adequate cleaning and gas-freeing; (c) ensure that where inerting with nitrogen, carbon dioxide or combustion gas is used, risks from inerting gas are considered under COSHH; and (i) inerting material is maintained at adequate levels for the duration of the work to ensure the atmosphere in the plant or equipment cannot support combustion or that any free volume is sufficiently small that any explosion within this will not pose a danger; (ii) a calibrated oxygen detection meter is used to ensure the oxygen concentration is adequately low and does not rise above the determined safe level; (d) ensure a competent person inspects and monitors the atmosphere inside plant and equipment.","h":"Hot work","sub":328},{"k":"ACOP","r":"Paragraph 329","p":68,"t":"329 In exceptional circumstances hot work can be carried out on operationally active or inactive plant or equipment that has previously contained a dangerous substance without cleaning or inerting. Such techniques are only applicable to plant or equipment containing liquids or gases and are not suitable for plant containing dangerous substances which are solids, dusts or explosives or that contain liquid or gaseous oxygen.","sub":329},{"k":"ACOP","r":"Paragraph 330","p":68,"t":"330 Where it is intended to carry out hot work on plant or equipment that still contains a dangerous substance the employer must ensure that: (a) there is sufficient liquid or gas within the plant to prevent air or oxygen from entering and forming an explosive atmosphere; (b) flames or heat will only be applied to the outside surface of the plant; (c) the plant cannot fail or leak as a result of the hot work activity and allow liquid or gas to escape and ignite; (d) the gas or liquid composition cannot change to become an explosive atmosphere during the hot work; (e) sufficient control can be exercised over the movement of materials into or out of that plant and any associated plant or equipment; (f) substances or residues present in the plant cannot undergo any reaction or decomposition leading to a dangerous increase in pressure or attack on the metal; (g) these techniques are only carried out under a strict permit-to-work system; (h) all personnel involved in planning and carrying out the work and supervising it are competent and trained in appropriate procedures and fire and explosion hazards; and (i) there are no explosive atmospheres around the work area arising from that plant or other work activities.","sub":330},{"k":"Guidance","r":"Paragraph 331","p":69,"t":"331 The specified conditions above should prevent a fire or explosion by ensuring that the contents of the plant are kept above their higher explosion limit and that the hot work is only carried out on the outside of the plant.","sub":331},{"k":"Guidance","r":"Paragraph 332","p":69,"t":"332 Eliminating dangerous substances before performing maintenance will include removing stocks of dangerous substances, cleaning and making plant safe, sealing drums and containers, isolating pipework or material handling systems and clearing up any spills or deposits of dangerous substances.","sub":332},{"k":"Guidance","r":"Paragraph 333","p":69,"t":"333 Wherever reasonably practicable, employers should eliminate the need for hot work by the use of other processes that do not involve the application of heat or the generation of heat or sparks.","h":"Preparation and procedures for hot work","sub":333},{"k":"Guidance","r":"Paragraph 334","p":69,"t":"334 The use of cold-cutting equipment (including low-speed drills, saws and chisels) may not be considered to be ‘hot work’ but they may still create sparks or hot surfaces with the potential to ignite explosive atmospheres. Their use, therefore, should be assessed and controlled as for any other potential ignition source.","sub":334},{"k":"Guidance","r":"Paragraph 335","p":69,"t":"335 Where it is not reasonably practicable to avoid hot work on plant or equipment that has contained a dangerous substance, regulation 6(3) requires the employer to apply appropriate measures, so far as reasonably practicable, to control the fire and explosion risks.","sub":335},{"k":"Guidance","r":"Paragraph 336","p":69,"t":"336 Before starting work, plant and equipment which has contained a dangerous substance should be isolated, cleaned and – in the case of volatile liquid and solid dangerous substances – gas-freed and ventilated to remove dangerous substances. These are hazardous operations requiring their own assessments and appropriate safety procedures.","h":"Cleaning and gas-freeing plant for hot work","sub":336},{"k":"Guidance","r":"Paragraph 337","p":69,"t":"337 Thorough removal of all residues must be ensured. However, this may not be reasonably practicable for very large tanks, for example on ships, nor may complete inerting of the enclosed spaces prior to work. In these cases, the areas surrounding the proposed repair site should be cleaned back to an extent assessed as adequate by a competent person. All involved will need to be experienced and trained in this type of work. The competent person will need to ensure that: (a) surfaces have been cleaned of all residues of dangerous substances; (b) there are no significant amounts trapped or held in any voids, crevices or absorbent components of the plant; (c) by monitoring the atmosphere within the plant or equipment, it is free from all flammable gases and vapours; (d) the concentration of any dangerous substance is less than 1% of its LEL; (e) flammable gases or vapours do not reoccur during the hot work activity. The need for further continuous or periodic monitoring of the atmosphere throughout the work activity should be considered.","sub":337},{"k":"Guidance","r":"Paragraph 338","p":70,"t":"338 Where it is not reasonably practicable to eliminate dangerous substances by adequate cleaning techniques, the employer must implement measures to control and if necessary mitigate against the fire and explosion risks arising from the hot work.","sub":338},{"k":"Guidance","r":"Paragraph 339","p":70,"t":"339 Gas-freeing and inerting should only be performed by those competent to do so, with appropriate measuring equipment, systems for work and safety equipment.","h":"Inerting","sub":339},{"k":"Guidance","r":"Paragraph 340","p":70,"t":"340 In some cases, cleaned and emptied plant and equipment may still contain residues of dangerous substance which are difficult or impracticable to remove. Inerting may be appropriate where there is a risk that these residues could ignite or form an explosive atmosphere during hot work.","sub":340},{"k":"Guidance","r":"Paragraph 341","p":70,"t":"341 Inerting is only applicable to flammable, highly flammable or extremely flammable dangerous substances or to substances that can create an explosive atmosphere on heating. It is not applicable to dangerous substances which are oxidisers or chemically unstable and are able to react without the presence of atmospheric oxygen to give rise to hazardous heat or pressure effects.","sub":341},{"k":"Guidance","r":"Paragraph 342","p":70,"t":"342 Inerting techniques may use water, nitrogen foam, nitrogen gas, combustion gas or carbon dioxide to reduce the oxygen content in the plant to below the levels that combustion can occur. Inerting may be hazardous if insufficient inert material is added to plant and equipment to achieve and maintain a non-combustible atmosphere or if people are exposed to dangerous quantities of toxic or asphyxiating gases and vapours.","sub":342},{"k":"Guidance","r":"Paragraph 343","p":70,"t":"343 Further information can be found in Safe work in confined spaces L101.52 Additionally, the resultant displaced dangerous substances may accumulate outside the plant and equipment giving rise to unforeseen health and safety hazards so should either be vented to a safe place or to atmosphere as appropriate.","sub":343},{"k":"ACOP","r":"Paragraph 344","p":70,"t":"344 Employers must implement measures to control the risk of fires and explosions arising from gaseous welding mixtures and cutting equipment. These measures will include: (a) providing appropriate equipment designed and constructed to recognised standards, which has been inspected and maintained in accordance with the manufacturer’s instructions; (b) protecting welding/cutting equipment, pipework and any associated fuel gas or oxygen compressed gas cylinder by the use of a suitable device which will arrest the progression of a flame flashback or acetylene decomposition; (c) where appropriate, monitoring or detecting leaks or the possible build- up of oxygen or fuel gases in confined spaces; (d) ensuring work takes place away from heat sources and there is adequate ventilation. If the use of gas cylinders in confined spaces cannot be avoided, supply valves should always be securely closed if cylinders are left unattended and special precautions, such as local exhaust ventilation, need to be taken; (e) routing hoses or pipes through areas where they are not easily damaged and not near to heat sources; (f) where moveable gas hoses or pipes are used or routed through confined spaces, they should be removed to a well-ventilated area at the end of each operation. Where this is not possible, they should be disconnected from source at a point outside the confined space and their contents safely vented; and (g) appropriate training, instruction and supervision to ensure correct operating procedures are followed.","h":"Using gas welding and cutting equipment","sub":344},{"k":"Guidance","r":"Paragraph 345","p":71,"t":"345 Industry guidance on storage and use of gases can be found from suppliers and from the British Compressed Gas Association.10, 53–56 Guidance on acetylene and on the fire and explosion risks associated with hot work is available on the HSE website at www.hse.gov.uk/fireandexplosion/acetylene.htm, and in UKLPG Code of Practice 7 Storage of Full and Empty LPG Cylinders and Cartridges.9","sub":345},{"k":"ACOP","r":"Paragraph 346","p":71,"t":"346 Before any decommissioning or relocation of fixed or bulk storage, advice should be sought from the supplier of the dangerous substance about making plant safe before it is mothballed, dismantled, transferred to a holding area or removed from site.","h":"Redundant plant and equipment","sub":346},{"k":"ACOP","r":"Paragraph 347","p":71,"t":"347 Where tanks have been made temporarily safe to be taken off site for cleaning and disposal, they should be maintained in a safe condition before and during transport and subsequent demolition.","sub":347},{"k":"ACOP","r":"Paragraph 348","p":71,"t":"348 Portable gas cylinders (transportable pressure receptacles) of any kind for which there is no further use should be returned to the supplier who is normally also the owner for refill or disposal. Employers should keep track of cylinders, drums and other transportable containers on site so that they may be safely disposed of.","sub":348},{"k":"Guidance","r":"Paragraph 349","p":71,"t":"349 The plant and equipment should first be adequately isolated from sources of dangerous substances (eg by permanent disconnection or by use of blanking plates) and drained or cleaned of residual material. Additional cleaning or inerting may be required depending on the risk assessment and the proposed method of disposal. Normally the plant and equipment should be effectively cleaned of all residues and, where necessary, gas freed before being mothballed, dismantled, transferred to a holding area or removed from site. For any decommissioning or relocation work involving fixed bulk storage (such as compressed and liquefied flammable gas and underground petrol tanks), documentary evidence that industry guidance was consulted and advice was obtained from the supplier on safe systems should be preserved, together with any permits-to-work.","sub":349},{"k":"Guidance","r":"Paragraph 350","p":71,"t":"350 Where plant or equipment containing residual product is to be removed from site without cleaning or gas freeing, the employer should ensure that it can be handled and transported safely and that those receiving it are aware of the hazards and are competent to deal with them. The employer should ensure that the risk assessment identifies the hazards and the necessary control measures for the transfer/transport procedures and that, where available, agreed industry standards are followed.","sub":350},{"k":"Guidance","r":"Paragraph 351","p":72,"t":"351 Guidance on removing redundant bulk LPG vessels from sites is contained in the UKLPG Code of Practice 26 Uplifting of Static LPG Vessels from Site and their Carriage to and from Site by Road.57 The minimum practicable amount of LPG that can remain in a vessel of less than five cubic metres when it is removed from site is 50 kg.","h":"Disposal of static vessels containing compressed and liquefied flammable gases","sub":351},{"k":"Guidance","r":"Paragraph 352","p":72,"t":"352 Where it is intended to leave the tank on site, it should be made permanently safe, eg by filling. Suitable solid materials for filling underground storage tanks in situ include sand/cement slurry, foamed concrete and urea amino plastic foam. Before adding the solid material the tank should be emptied of residual product and then made safe by filling with an inert material such as nitrogen foam, nitrogen gas, water, carbon dioxide or locally generated combustion gas. Alternatively the tank can be made safe before filling by suitable cleaning and degassing methods. Guidance is available from the Association for Petroleum and Explosives Administration’s (APEA), Guidance for Design, Construction, Modification, Maintenance and Decommissioning of Filling Stations (The Blue Book) and is available from the APEA website.58 Regulation 7 Places where explosive atmospheres may occur Summary of regulation 7 Regulation 7 contains specific requirements to be applied where an explosive atmosphere may occur (in addition to the requirements in regulations 5 and 6). The regulation requires competent identification of hazardous and non-hazardous zones before new work starts and verification by a competent person.","h":"Disposal of underground petrol storage tanks","sub":352},{"k":"Law","r":"Regulation 7(1)","p":72,"t":"(1) Every employer shall classify places at the workplace where an explosive atmosphere may occur into hazardous or non-hazardous places in accordance with paragraph 1 of Schedule 2 and shall classify those places so classified as hazardous into zones in accordance with paragraph 2 of that Schedule; and that Schedule shall have effect subject to the notes at the end of that Schedule."},{"k":"Law","r":"Regulation 7(2)","p":72,"t":"(2) The employer shall ensure that the requirements specified in Schedule 3 are applied to equipment and protective systems in the places classified as hazardous pursuant to paragraph (1)."},{"k":"Law","r":"Regulation 7(3)","p":72,"t":"(3) Where necessary, places classified as hazardous pursuant to paragraph (1) shall be marked by the employer with signs at their points of entry in accordance with Schedule 4."},{"k":"Law","r":"Regulation 7(4)","p":72,"t":"(4) Before a workplace containing places classified as hazardous pursuant to paragraph (1) is used for the first time, the employer shall ensure that its overall explosion safety is verified by a person who is competent in the field of explosion protection as a result of his experience or any professional training or both."},{"k":"Law","r":"Regulation 7(5)","p":72,"t":"(5) The employer shall ensure that appropriate work clothing which does not give rise to electrostatic discharges is provided for use in places classified as hazardous pursuant to paragraph (1)."},{"k":"Law","r":"Regulation 7(6)","p":73,"t":"(6) This regulation is subject to the transitional provisions in regulation 17(1) to (3). Schedule 2 Classification of places where explosive atmospheres may occur"},{"k":"Law","r":"Schedule 2, paragraph 2","p":73,"t":"2 Regulation 7(1) (which substantially reproduces the provisions of Annex I of Council Directive 99/92/EC)","sub":2},{"k":"Law","r":"Schedule 2, paragraph 1","p":73,"t":"1 Places where explosive atmospheres may occur A place in which an explosive atmosphere may occur in such quantities as to require special precautions to protect the health and safety of the workers concerned is deemed to be hazardous within the meaning of these Regulations. A place in which an explosive atmosphere is not expected to occur in such quantities as to require special precautions is deemed to be non-hazardous within the meaning of these Regulations.","sub":1},{"k":"Law","r":"Schedule 2, paragraph 2 (continued)","p":73,"t":"2 Classification of hazardous places Hazardous places are classified in terms of zones on the basis of the frequency and duration of the occurrence of an explosive atmosphere.","sub":2},{"k":"Law","r":"Schedule 2","p":73,"t":"A place in which an explosive atmosphere consisting of a mixture with air of dangerous substances in the form of gas, vapour or mist is present continuously or for long periods or frequently.","h":"Zone 0"},{"k":"Law","r":"Schedule 2 (continued)","p":73,"t":"A place in which an explosive atmosphere consisting of a mixture with air of dangerous substances in the form of gas, vapour or mist is likely to occur in normal operation occasionally.","h":"Zone 1"},{"k":"Law","r":"Schedule 2 (continued 2)","p":73,"t":"A place in which an explosive atmosphere consisting of a mixture with air of dangerous substances in the form of gas, vapour or mist is not likely to occur in normal operation but, if it does occur, will persist for a short period only.","h":"Zone 2"},{"k":"Law","r":"Schedule 2 (continued 3)","p":73,"t":"A place in which an explosive atmosphere in the form of a cloud of combustible dust in air is present continuously, or for long periods or frequently.","h":"Zone 20"},{"k":"Law","r":"Schedule 2 (continued 4)","p":73,"t":"A place in which an explosive atmosphere in the form of a cloud of combustible dust in air is likely to occur in normal operation occasionally.","h":"Zone 21"},{"k":"Law","r":"Schedule 2, paragraph 2 (continued 2)","p":74,"t":"2 Zone 22 A place in which an explosive atmosphere in the form of a cloud of combustible dust in air is not likely to occur in normal operation but, if it does occur, will persist for a short period only.","sub":2},{"k":"Law","r":"Schedule 2, paragraph 1 (continued)","p":74,"t":"1 Layers, deposits and heaps of combustible dust must be considered as any other source which can form an explosive atmosphere. 2 “Normal operation” means the situation when installations are used within their design parameters.","sub":1},{"k":"Law","r":"Schedule 3","p":74,"t":"Schedule 3 Criteria for the selection of equipment and protective systems"},{"k":"Law","r":"Schedule 3, paragraph 3","p":74,"t":"3 Regulation 7(2) (1) Equipment and protective systems for all places in which explosive atmospheres may occur must be selected on the basis of the requirements set out in the Equipment and Protective Systems Intended for Use in Potentially Explosive Atmospheres Regulations 1996 unless the risk assessment finds otherwise. (2) In particular, the following categories of equipment must be used in the zones indicated, provided they are suitable for gases, vapours, mists, dusts or mists and dusts, as appropriate: - in zone 0 or zone 20, category 1 equipment, - in zone 1 or zone 21, category 1 or 2 equipment, - in zone 2 or zone 22, category 1, 2 or 3 equipment. (3) For the purposes of this Schedule and regulations 7(2) and 17(1) – (a) “equipment” means machines, apparatus, fixed or mobile devices, control components and instrumentation thereof and detection or prevention systems which, separately or jointly, are intended for the generation, transfer, storage, measurement, control and conversion of energy and the processing of material, as the case may be, and which are capable of causing an explosion through their own potential sources of ignition; (b) “protective systems” means devices other than components of equipment which are intended to halt incipient explosions immediately or limit the effective range of an explosion or both, as the case may be, and which systems are separately placed on the market for use as autonomous systems; (c) “devices” means safety devices, controlling devices and regulating devices intended for use outside potentially explosive atmospheres but required for or contributing to the safe functioning of equipment and protective systems with respect to the risks of explosion; (d) “component” means any item essential to the safe functioning of equipment and protective systems but with no autonomous function; and (e) “potentially explosive atmosphere” means an atmosphere which could become explosive due to local and operational conditions.","sub":3},{"k":"Law","r":"Schedule 4","p":75,"t":"Schedule 4 Warning sign for places where explosive atmospheres may occur"},{"k":"Law","r":"Schedule 4, paragraph 4","p":75,"t":"4 Regulation 7(3) (which substantially reproduces the provisions of Annex III of Council Directive 99/92/EC) Distinctive features: (a) triangular shape; (b) black letters on a yellow background with black edging (the yellow part to take up at least 50% of the area of the sign).","sub":4},{"k":"Guidance","r":"Paragraph 353","p":75,"t":"353 The particular requirements of regulation 7 are in addition to the requirements in regulation 6 and are limited to explosive atmospheres as defined in regulation 2, ie those that may occur in air under normal ambient conditions (for the purposes of standardisation defined as -20 to 40 °C, and 0.8 to 1.1 bar). For atmospheric conditions outside these ranges, regulations 7 and 11 do not apply. However, the rest of the Regulations do apply in such circumstances and the employer is required to assess such atmospheres to ensure that the risks from fire or explosion are either eliminated or reduced so far as reasonably practicable.","sub":353},{"k":"ACOP","r":"Paragraph 354","p":75,"t":"354 Where a hazardous area classification study has been carried out under regulation 7, this should be recorded in the form of a drawing which: (a) identifies the hazardous areas and types of zones; (b) shows the extent of the zones in both plan and elevation (ie illustrates the three-dimensional nature of the hazardous zone); (c) is supplemented by text giving information about; (i) the dangerous substances that will be present; (ii) the work activities that have been considered; (iii) other assumptions made by the study; (d) is retained as part of the documentation in support of regulation 5; (e) is considered whenever new equipment is to be introduced into a zoned area.","h":"Hazardous area classification","sub":354},{"k":"Guidance","r":"Paragraph 355","p":75,"t":"355 Schedule 2 defines a place as hazardous where an explosive atmosphere may occur in such quantities as to require special precautions to protect the health and safety of workers. A place where an explosive atmosphere is not expected to occur in such quantities as to require such special precautions is deemed to be non- hazardous, but the rest of DSEAR still needs to be considered.","sub":355},{"k":"Guidance","r":"Paragraph 356","p":75,"t":"356 In deciding when hazardous area classification is not necessary for a small quantity of dangerous substance the actual circumstances of use and any specific industry guidance should be taken into account. Guidance is available on HSE’s website at www.hse.gov.uk/electricity/atex/classification.htm.","sub":356},{"k":"Guidance","r":"Paragraph 357","p":76,"t":"357 A spillage from a small bottle of solvent would release so little flammable material that no special precautions for the selection of equipment are needed and therefore the area would not be classified as hazardous. An assessment would still be required to identify the normal control measures necessary to protect the health and safety of those using the solvent. For example, measures to prevent spillage; measures to reduce exposure to fumes or vapours; controls over naked flames and similar large and continuous ignition sources when the solvent is being used. After such a spillage it would be necessary to control obvious ignition sources (eg smoking) during clean up and disposal of the liquid.","sub":357},{"k":"Guidance","r":"Paragraph 358","p":76,"t":"358 The expression ‘special precautions’ used in Schedule 2 means precautions to control potential ignition sources within a hazardous area, in particular in relation to the construction, installation and use of equipment. The term ‘not expected to occur in such quantities’ means that employers should consider the likelihood of occurrences of explosive atmospheres as well as the potential quantity of such dangerous substances when considering area classification. So if a release is extremely unlikely to occur and/or if the quantities released are small, it is unlikely to be necessary to classify the area as hazardous.","sub":358},{"k":"Guidance","r":"Paragraph 359","p":76,"t":"359 Hazardous area classification should be carried out as an integral part of the risk assessment process. Its purpose is to define the extent, frequency and duration of any occurrence of an explosive atmosphere (the zone). The zone in turn defines the requirements for the selection and installation of equipment and protective systems to prevent sources of ignition so far as reasonably practicable.","sub":359},{"k":"Guidance","r":"Paragraph 360","p":76,"t":"360 The hazardous area classification drawing could be in the form of two separate drawings showing a simplified approach to the configuration of the plant. Such drawings should be supplemented by text giving information about the dangerous substances that will be present, the work activities that have been considered, and other assumptions made by the study. The drawings and documents should be retained as part of the documentation in support of regulation 5. The information in these documents should be considered whenever new equipment is to be introduced into a zoned area.","sub":360},{"k":"Guidance","r":"Paragraph 361","p":76,"t":"361 If a maintenance process increases the risk of a release of dangerous substance, then the scope of the hazardous area may need to be enlarged. It is normally unnecessary to produce a new hazardous area classification drawing for the duration of the maintenance work. The risk assessment may find that new temporary controls and procedures are necessary for maintenance activities.","sub":361},{"k":"Guidance","r":"Paragraph 362","p":76,"t":"362 If during periods of maintenance, dangerous substances can be adequately and reliably excluded from an area which is normally classified, it is likely to be possible to treat the area as non-hazardous (depending on the risk assessment in the particular circumstances).","sub":362},{"k":"Guidance","r":"Paragraph 363","p":76,"t":"363 Trade associations can be a good source of advice on classifying areas into hazardous zones where flammable liquids and gases are present. Typical hazardous area classifications for a number of different circumstances may be found in HSE and industry publications on flammable substances.","sub":363},{"k":"Guidance","r":"Paragraph 364","p":76,"t":"364 Additional guidance on hazardous area classification and controlling ignition sources is contained in the following publications: (a) Model Code of Safe Practice Part 15 Area Classification Code for Installations Handling Flammable Fluids;12 (b) Electrostatics. Code of practice for the avoidance of hazards due to static electricity;34 (c) The storage of flammable liquids in tanks HSG176 ;14 (d) The safe use and handling of flammable liquids HSG140;15 (e) Solvents Industry Association guidance and visual training aids at www.sia-uk.org.uk/health-and-safety.htm; (f) Safe handling of combustible dusts. Precautions against explosions HSG103.37","sub":364},{"k":"Guidance","r":"Paragraph 365","p":77,"t":"365 An international standard, Explosive atmospheres. Classification of areas. Explosive gas atmospheres,59 explains the basic principles of area classification for gases and vapours. Its counterpart for dusts is Explosive atmospheres. Classification of areas. Combustible dust atmospheres.60 Taken together, these form a suitable basis for assessing the extent and type of zone, and can be used as a guide to complying with regulation 7 and Schedule 2. However, they cannot give the extent and type of zone in any particular case, as site-specific factors should always be taken into account.","sub":365},{"k":"Guidance","r":"Paragraph 366","p":77,"t":"366 In addition to HSE guidance, industry-specific codes containing examples have also been published by various organisations. Applied appropriately, they are valuable in encouraging consistent interpretation of the requirements. Such guidance and codes include: (a) the Energy Institute’s Model Code of Safe Practice Part 15 Area Classification Code for Installations Handling Flammable Fluids;12 (b) APEA’s Guidance for Design, Construction, Modification, Maintenance and Decommissioning of Filling Stations;58 (c) BS 476 Parts 4, 6, 7 and 11;61 (d) UKLPG Code of Practice 1 Part 1 Bulk LPG Storage at Fixed Installations;28 (e) UKLPG Code of Practice 7 Storage of Full and Empty LPG Cylinders and Cartridges;9 (f) British Compressed Gases Association publications.10,53–56","sub":366},{"k":"Guidance","r":"Paragraph 367","p":77,"t":"367 Some repeated activities such as refuelling cars, or loading and unloading tankers intended for use on the public roads, involve the introduction of potential sources of ignition into an area where a spill is possible, which would meet the description of a hazardous area. In these circumstances, safety can be achieved by isolating power sources (eg turning off engines etc) while a transfer is taking place, and making suitable checks before and after a transfer, and before moving a vehicle into or out of a hazardous area. The risk assessment made under regulation 5 should consider the controls necessary.","sub":367},{"k":"ACOP","r":"Paragraph 368","p":77,"t":"368 The employer should only use ‘products’ (equipment, protective systems, safety devices, components and their combinations) in potentially explosive atmospheres that comply with the specific essential health and safety requirements (EHSRs) of EPS, unless the risk assessment states otherwise.","h":"Selection of equipment for use in hazardous areas","sub":368},{"k":"Guidance","r":"Paragraph 369","p":77,"t":"369 In addition to the term ‘hazardous area’, the term ‘safe area’ is commonly used by suppliers of equipment that is not ATEX protected and which is used in non-hazardous areas. Note: the suitability of a ‘product’ includes its potential as an ignition source by any mechanism, including heat, mechanical, chemical and electrical energy.","sub":369},{"k":"Guidance","r":"Paragraph 370","p":78,"t":"370 Where the product is supplied from within the EU territory, confirmation of this should be available from the supplier/manufacturer, who in compliance with EPS should provide information and mark the product to confirm the nature of potentially explosive atmosphere it is designed for.","sub":370},{"k":"Guidance","r":"Paragraph 371","p":78,"t":"371 An employer may need to obtain expert advice when sourcing equipment to ensure it is suitable for the specific hazard circumstances, eg organic dusts or a chemical with particular ignition characteristics. This also applies to mobile equipment.","sub":371},{"k":"ACOP","r":"Paragraph 372","p":78,"t":"372 The employer should ensure that the product is installed, operated and maintained in accordance with the supplier’s instructions. The employer should ensure that any modification or change of a device or component maintains compliance with the EHSRs for the product.","sub":372},{"k":"ACOP","r":"Paragraph 373","p":78,"t":"373 Products that were already in use within EU territory before July 2003 are not subject to the requirements of Schedule 3. These can continue in use providing the employer has assessed them and is able to demonstrate that the risks from fire or explosion are either eliminated or reduced so far as reasonably practicable. Equipment that is ‘second-hand’, ie it has already been used in the EU before July 2003, is not subject to the requirements of Schedule 3 but must meet the relevant requirements set out in regulation 6.","sub":373},{"k":"ACOP","r":"Paragraph 374","p":78,"t":"374 Where an employer intends to use the flexibility provided by the phrase in Schedule 3(1) ‘unless the risk assessment finds otherwise’, this decision must be adequately justified and recorded by their risk assessment which should confirm that the approach taken provides an equivalent level of safety to DSEAR. The derogation cannot be used to avoid the requirements placed on ‘responsible persons’ under EPS concerning the supply, importation and/ or putting into use of products.","sub":374},{"k":"Guidance","r":"Paragraph 375","p":78,"t":"375 The effect of regulation 7, Schedule 2 and Schedule 3, taken together, is to require new equipment and protective systems provided for use at work in places classified as hazardous to comply with EPS. In most cases this can be achieved following an area classification study by selecting EPS equipment of an appropriate category according to the criteria set out in Schedule 3.","sub":375},{"k":"Guidance","r":"Paragraph 376","p":78,"t":"376 A standardised marking scheme is widely used to help identify equipment suitable for a specific location. Equipment built to the requirements of EPS will carry the explosion protection symbol ‘ ’ in a hexagon, the equipment category number (1, 2 or 3), the letter G and/or D depending on whether it is intended for use in gas or dust atmospheres or both, and other essential safety information. In many cases this will include a temperature rating expressed as a ‘T’ marking, and sometimes a gas group. These indicate limitations to safe use. Employers and those installing equipment should consider the marking and documentation provided with ‘Ex’ equipment when it is being installed.","sub":376},{"k":"Guidance","r":"Paragraph 377","p":79,"t":"377 In the case of equipment that is suitable for both explosive gas atmospheres and explosive dust atmospheres, the equipment should display two separate markings. For example, this would appear within the marking plate (see Figure 1) information as: (a) II 1 G – Ex ia IIB T4; and (b) II 1 D – Ex ia IIIC T120 °C.","h":"Figure 1 Typical ATEX equipment marking plate","sub":377},{"k":"Guidance","r":"Paragraph 378","p":79,"t":"378 Further guidance may be found in: (a) BS EN 13463-1 Non-electrical equipment for use in potentially explosive atmospheres. Basic methods and requirements;62 (b) BS EN 60079-14 Explosive atmospheres. Electrical installations design, selection and erection;63 and (c) BS EN 60079-0 Explosive atmospheres. Equipment. General requirements.64","sub":378},{"k":"Guidance","r":"Paragraph 379","p":79,"t":"379 Equipment including flame arresters (see BS EN ISO 1685221), pressure valves and ROSOVs should be ATEX certified and properly installed and suitably maintained.","sub":379},{"k":"Guidance","r":"Paragraph 380","p":79,"t":"380 The controls apply particularly to the selection of
