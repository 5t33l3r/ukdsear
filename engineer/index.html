fixed equipment that can create an ignition risk. However, the same principles may be extended to control the use of mobile equipment, other sources of ignition that may be introduced into the workplace (eg matches and lighters, car key electronic fobs, mobile phones etc) and the risks from electrostatic discharges. Advice on electrostatic discharges is contained in Electrostatics. Code of Practice for the avoidance of hazards due to static electricity.34","sub":380},{"k":"Guidance","r":"Paragraph 381","p":79,"t":"381 The derogation referred to in paragraph 374 is intended to allow equipment of a higher or lower category than that normally required for the zone in question to be used where: (a) equipment is temporarily taken into a zoned area and alternative effective precautions are provided to control the risk. An example might be arrangements to isolate or shut down equipment to prevent the release of a dangerous substance; (b) workers can be excluded from the hazardous area, and will not be at risk from any ignition of an explosive atmosphere; (c) equipment of the required category is simply not available, but a lower category can be used in combination with other protective measures to achieve the purposes of these Regulations.","sub":381},{"k":"Guidance","r":"Paragraph 382","p":80,"t":"382 In addition, the derogation cannot be used to circumvent the requirements placed on ‘responsible persons’ under EPS, and in particular: (a) to allow equipment imported from outside the EU, built to other standards, to be used without complying with the EPS Regulations before it is placed on the market or put into service in the European Economic Area (EEA); (b) to justify equipment built to lower standards than that specified by EPS.","sub":382},{"k":"Guidance","r":"Paragraph 383","p":80,"t":"383 The leeway provided by the Schedule 3 derogation does not affect the duties placed on manufacturers, suppliers, importers and other ‘responsible persons’ under EPS. Users who manufacture equipment for their own use, or who import directly from outside the EEA, are considered to be a ‘responsible person’ under EPS and take on the full responsibility for complying with those Regulations when putting that equipment into service for the first time in the EEA.","sub":383},{"k":"Guidance","r":"Paragraph 384","p":80,"t":"384 Under the European Agreement concerning the International Carriage of Dangerous Goods by Road (ADR), an equipment certificate of approval – provided by the Department for Transport – must be obtained for pumps that use the vehicle’s engine to power tanker offloading activities. Earthing links/clamps do not contain their own potential source of ignition and so according to the ATEX Guidelines47 at paragraph 3.7.2 are not subject to ATEX. Nevertheless the potential for ignition must be considered including from misuse.","sub":384},{"k":"ACOP","r":"Paragraph 385","p":80,"t":"385 Employers should either: (a) erect a sign complying with Schedule 4 at the points of entry to alert people to the locations where an explosive atmosphere may occur and the need to take special precautions; or (b) if this is impractical, employers should be able to demonstrate that they have taken equally effective means to alert people to locations where an explosive atmosphere may occur and that special precautions are required for entry.","h":"Marking areas containing explosive atmospheres","sub":385},{"k":"Guidance","r":"Paragraph 386","p":80,"t":"386 The requirement in regulation 7(3) applies in addition and without prejudice to similar requirements in other legislation, such as the Dangerous Substances (Notification and Marking of Sites) Regulations 1990 (SI 1990/304) and the Health and Safety (Safety Signs and Signals) Regulations 1996 (SI 1996/341). If signs have already been provided under those Regulations, and they are sufficient to warn of an explosive atmosphere, then the addition of the sign specified in Schedule 4 may not be necessary. However, if the employer considers the existing signs are not sufficient the sign in Schedule 4 may need to be applied in addition. Marking is not required for individual zones.","sub":386},{"k":"Guidance","r":"Paragraph 387","p":80,"t":"387 Signs are useful to identify where: (a) special workplace or site rules apply, eg designated smoking areas, antistatic footwear to be worn, or access restricted to authorised people; (b) portable or mobile equipment must be of an explosion-protected design, eg hand torches, vehicles or cleaning machines; (c) fixed equipment should be of an explosion-protected design. This can also be useful for the purposes of audit or later plant modifications.","sub":387},{"k":"Guidance","r":"Paragraph 388","p":80,"t":"388 If the risk assessment indicates that, after appropriate measures have been taken to eliminate or control risks, there is still a significant risk then signs should be used to reduce the risk further. The sign should: (a) be visible to the public and outward-facing on the boundary and fire service entry points; (b) be positioned at the points of entry to the place where the explosive atmosphere may exist within a clearly defined area; (c) supplement, if necessary, other means used to identify less clearly defined hazardous zones, eg painted lines on the ground around large open-air plant.","sub":388},{"k":"Guidance","r":"Paragraph 389","p":81,"t":"389 Where signage is considered necessary, in addition to other risk reduction measures, it may sometimes be more appropriate just to mark points of entry to the workplace as a whole, rather than the numerous individual locations within the site, if all the special precautions apply throughout the entire site.","sub":389},{"k":"Guidance","r":"Paragraph 390","p":81,"t":"390 Signs should be of sufficient size to fulfil their warning function, and they should be maintained so that they are clearly visible. The arrangements made by employers under regulation 9 should ensure that employees receive sufficient information, instruction and training on the meaning of the sign and the measures to be taken in connection with it.","sub":390},{"k":"ACOP","r":"Paragraph 391","p":81,"t":"391 Verification of explosion safety should be carried out by someone with sufficient training and experience in explosion protection. If sufficient verification expertise exists in-house then it may be performed by that person(s) but the appointed person(s) should be impartial and sufficiently independent to carry out the assessment/verification effectively. Otherwise external competent verification should be obtained. The procedure should confirm that the plant, equipment, protective systems, safety devices, components and their combinations, and the building/structure housing them, are suitable for use with the dangerous substances that are to be used in the workplace and the classification(s) of potentially explosive atmosphere that may exist within this.","h":"Verification of places containing explosive atmospheres","sub":391},{"k":"Guidance","r":"Paragraph 392","p":81,"t":"392 The employer must ensure that verification is carried out by someone who is competent to consider the risks at that workplace and decide on the adequacy of the control and other measures to ensure explosion safety. The verification can be in-house as long as the competent person is sufficiently independent of the installation and operation of the work area involved. On larger installations more than one person may need to be involved.","sub":392},{"k":"Guidance","r":"Paragraph 393","p":81,"t":"393 The verifier must have obtained sufficient practical and theoretical knowledge from actual experience and/or professional training relevant to the particular workplace and work activity they intend to verify. For example, someone who is competent to verify the explosion safety of a petrol station may not be competent to verify the adequacy of measures to deal with combustible dust in a textile factory.","sub":393},{"k":"Guidance","r":"Paragraph 394","p":81,"t":"394 The purpose of verifying overall explosion safety is to confirm the workplace can operate in accordance with these Regulations. The workplace should not be brought into use if verification shows that explosion risks are such that it is not safe to do so. Verification should include consideration of the following: (a) the dangerous substances that will be present at the workplace, including their hazardous properties and quantity; (b) the suitability of the plant, equipment and protective systems for work in explosive atmospheres; (c) the work processes, operating procedures and systems of work; (d) the effectiveness of measures to: (i) prevent explosive atmospheres forming; (ii) control risks from explosive atmospheres; (iii) mitigate the effects of an explosion; (e) the effectiveness of emergency arrangements, where these are required.","sub":394},{"k":"Guidance","r":"Paragraph 395","p":82,"t":"395 Verification can be carried out through a variety of means, eg by examination of documents, visual inspection, or physical checks and measurements. Much of the work may be a normal part of the commissioning process. Examples of the work involved include: (a) checks that mechanical ventilation systems produce the air flows intended; (b) inspection of records showing that process equipment is leak-tight before dangerous substances are introduced for the first time; (c) ensuring that a hazardous area classification drawing has been prepared, and a visual inspection that electrical equipment is of the correct type or category for the zone where it has been installed and has been installed correctly; (d) ensuring that appropriate information is available about the dangerous properties of materials to be handled in the plant.","sub":395},{"k":"Guidance","r":"Paragraph 396","p":82,"t":"396 Verification may be used to demonstrate that recommendations of the risk assessment have been put into effect. Where a workplace is subject to legislation on major hazards, such as COMAH, the verification may be used as part of the ALARP argument required by those Regulations.","sub":396},{"k":"Guidance","r":"Paragraph 397","p":82,"t":"397 Although there is no requirement to keep a record of the verification, it is recommended that the verifier’s name and the date on which verification was completed be recorded. If a record is kept it should be in an easily accessible format. Any documentation produced may be useful for the risk assessment, especially where verification indicates that specific conditions need to be maintained to ensure explosion safety. These conditions should be included in the risk assessment record.","sub":397},{"k":"Guidance","r":"Paragraph 398","p":82,"t":"398 Regulation 5(3) requires any risk assessment to be kept under review, for example when new processes are started, or new work equipment is brought into use. Part of that review might involve verification of a significant new plant or process, but it is not intended that verification be applied to every change in a work activity or equipment.","sub":398},{"k":"ACOP","r":"Paragraph 399","p":82,"t":"399 Where the risk assessment under regulation 5 indicates that an electrostatic discharge could ignite any potential explosive atmosphere that may exist, the employer should: (a) provide employees working in hazardous places with antistatic ordinary work clothing, including footwear; (b) where the risk assessment shows this to be necessary, also provide employees with other antistatic work clothing, including any personal protective equipment provided for other purposes.","h":"Provision of antistatic clothing and footwear","sub":399},{"k":"Guidance","r":"Paragraph 400","p":82,"t":"400 Some clothing, including footwear, contains materials that can generate electrostatic discharges during use. Such discharges can ignite certain types of explosive atmospheres. Employees should be reminded to also consider the electrostatic properties of their own clothing which may be worn under the protective clothing provided by their employer. Antistatic or ordinary clothing should not be fastened up or removed in places where an explosive atmosphere may occur and a safe area should be established where workers are able to remove or change clothing etc in safety.","sub":400},{"k":"Guidance","r":"Paragraph 401","p":83,"t":"401 The risk from electrostatic discharges from clothing can be reduced if the wearer is earthed by means of suitable footwear and flooring, such as concrete or steel grids. This is likely to be sufficient for places classified into zone 0, 1 or 2 as specified in Schedule 2. In a small number of cases special footwear may also be necessary for zones 20, 21 and 22. Antistatic footwear and flooring should be tested routinely and replaced if it is found that its antistatic properties have deteriorated.","sub":401},{"k":"Guidance","r":"Paragraph 402","p":83,"t":"402 Where employee or visitor possessions have the potential to create electrostatic discharges, the employer should have a policy to manage them.","sub":402},{"k":"Guidance","r":"Paragraph 403","p":83,"t":"403 General advice on electrostatic hazards is contained in BS 5958-1, parts 133 and 265 and includes a range of measures applicable to various industrial situations such as petrochemical installations and flammable powder handling. Further information can also be found in Electrostatics. Code of Practice for the avoidance of hazards due to static electricity.34 See also ACOP and guidance on control and avoidance of ignition sources in paragraphs 238–254.","sub":403},{"k":"Guidance","r":"Paragraph 404","p":83,"t":"404 This regulation is subject to the transitional provisions in regulation 17(1) to (3). This period has now expired; however, regulation 17(1) still applies to exempt equipment and protective systems that were in operation in workplaces before 30 June 2003 as per regulation 7(3), Schedule 3. Regulation 8 Arrangements to deal with accidents, incidents and emergencies Summary of regulation 8 This regulation requires employers to protect the safety of employees by forward planning to have in place arrangements to deal with accidents, incidents and emergencies, including the evacuation, escape or rescue of people. The arrangements include first aid, safety drills and testing, information on hazards, warning and response systems and means of escape. These are required unless such measures would be disproportionate to the risk. (1) Subject to paragraph (4), in order to protect the safety of his employees","sub":404},{"k":"Law","r":"Schedule 4, paragraph 4 (continued)","p":83,"t":"from an accident, incident or emergency related to the presence of a dangerous substance at the workplace, the employer shall ensure that – (a) procedures, including the provision of appropriate first-aid facilities and relevant safety drills (which shall be tested at regular intervals), have been prepared which can be put into effect when such an event occurs; (b) information on emergency arrangements, including – (i) details of relevant work hazards and hazard identification arrangements; and (ii) specific hazards likely to arise at the time of an accident, incident or emergency; is available; (c) suitable warning and other communication systems are established to enable an appropriate response, including remedial actions and rescue operations, to be made immediately when such an event occurs; (d) where necessary, before any explosion conditions are reached, visual, or audible, warnings are given and employees withdrawn; and (e) where the risk assessment indicates it is necessary, escape facilities are provided and maintained to ensure that, in the event of danger, employees can leave endangered places promptly and safely."},{"k":"Law","r":"Regulation 8(2)","p":84,"t":"(2) Subject to paragraph (4), the employer shall ensure that information on the matters referred to in paragraph (1)(a), (c) to (e) and the information required by paragraph 1(b) is – (a) made available to relevant accident and emergency services to enable those services, whether internal or external to the workplace, to prepare their own response procedures and precautionary measures; and (b) displayed at the workplace, unless the results of the risk assessment make this unnecessary."},{"k":"Law","r":"Regulation 8(3)","p":84,"t":"(3) Subject to paragraph (4), in the event of an accident, incident or emergency related to the presence of a dangerous substance at the workplace, the employer shall ensure that – (a) immediate steps are taken to – (i) mitigate the effects of the event; (ii) restore the situation to normal; and (iii) inform those of his employees who may be affected; and (b) only those persons who are essential for the carrying out of repairs and other necessary work are permitted in the affected area and they are provided with – (i) appropriate personal protective equipment and protective clothing; and (ii) any necessary specialised safety equipment and plant; which shall be used until the situation is restored to normal."},{"k":"Law","r":"Regulation 8(4)","p":84,"t":"(4) Paragraphs (1) to (3) shall not apply where – (a) the results of the risk assessment show that, because of the quantity of each dangerous substance at the workplace, there is only a slight risk to employees; and (b) the measures taken by the employer to comply with his duty under regulation 6(1) are sufficient to control that risk."},{"k":"Guidance","r":"Paragraph 405","p":84,"t":"405 In respect of the dangers arising from an accident, incident or emergency involving the dangerous substance, compliance with regulation 8 of DSEAR fulfils most of the requirements of regulation 8 of the Management Regulations. However, the Management Regulations contain additional requirements to nominate competent persons to initiate procedures, for example.","sub":405},{"k":"Guidance","r":"Paragraph 406","p":84,"t":"406 Other health and safety at work legislation also include requirements on planning for and responding to emergencies. These include COMAH, the Offshore Installations (Prevention of Fire and Explosion, and Emergency Response) Regulations 1995 (SI 1995/743), and the Radiation (Emergency Preparedness and Public Information) Regulations 2001 (SI 2001/2975). The emergency measures under DSEAR deal with safety risks. Employers will need to consider whether such arrangements are also required to address health risks under COSHH.","sub":406},{"k":"Guidance","r":"Paragraph 407","p":84,"t":"407 The assessment of accidents, incidents and emergencies related to the presence of a dangerous substance, and the determination of emergency arrangements to be taken, should be performed at the same time as the requirements of the other regulations above, plus those of any other relevant health, safety and fire legislation. In practice, meeting the requirements in this other legislation (with regard to flammable properties etc) may mean that an employer is largely meeting the requirements in DSEAR.","sub":407},{"k":"ACOP","r":"Paragraph 408","p":85,"t":"408 The employer should consider the conclusions of their risk assessment about the likelihood and scale or magnitude of the predicted effects on people of any foreseeable unplanned event involving dangerous substances on their premises. The resulting emergency arrangements put in place should aim to minimise the impact.","sub":408},{"k":"ACOP","r":"Paragraph 409","p":85,"t":"409 These measures should be taken in addition to the measures already required by regulation 6 to eliminate or reduce risk (by design, and safe operation, instruction and training).","sub":409},{"k":"Guidance","r":"Paragraph 410","p":85,"t":"410 Depending on the findings of the risk assessment and measures already taken, employers will need to consider: (a) what additional first-aid facilities may need to be provided taking into account the likely effects of any incident; (b) what additional safety drills may need to be developed (and tested). The frequency of practising any such drills will depend on a number of factors including: (i) the quantity of dangerous substances on site and the level of risk they present; (ii) the size of the workplace and workforce; and (iii) the success or otherwise of previous tests.","sub":410},{"k":"Guidance","r":"Paragraph 411","p":85,"t":"411 It can be helpful for employers to involve employees and their representatives during the risk assessment process, as they can be a useful source of information. The emergency arrangements will need to be reviewed and, if necessary, revised if circumstances change at the workplace. For example, if there is a significant increase in the use of a dangerous substance or if new work processes lead to the introduction of new substances into the workplace.","sub":411},{"k":"Guidance","r":"Paragraph 412","p":85,"t":"412 Following the risk assessment, there is a legal requirement, under the Safety Representatives and Safety Committees Regulations 1977 and the Health and Safety (Consultation with Employees) Regulations 1996, to consult employees or their representatives on the introduction of any measures which may substantially affect their health and safety.","sub":412},{"k":"ACOP","r":"Paragraph 413","p":85,"t":"413 The warning and other communication systems should be appropriate to the level of risk presented by foreseeable accidents, incidents or emergencies and provide sufficient time and information to allow the necessary emergency actions to be carried out. A warning or communication system should: (a) not require people to remain in the affected area to continue to sound or give the alarm during an emergency; (b) be rapid, easy and reliable to initiate; (c) be appropriate to the level of foreseeable risk from an event; (d) allow enough time and information to take necessary actions; and (e) be seen or heard in all areas of the workplace likely to be affected by the incident.","sub":413},{"k":"Guidance","r":"Paragraph 414","p":85,"t":"414 Employers should also have procedures in place to keep employees informed of situations as they develop and any actions that may be needed as a consequence.","sub":414},{"k":"Guidance","r":"Paragraph 415","p":85,"t":"415 Examples of warning systems include: (a) a continuous or intermittent ringing bell; (b) a klaxon or hooter; (c) warning lights; (d) an intercom or tannoy system.","sub":415},{"k":"Guidance","r":"Paragraph 416","p":86,"t":"416 When considering what warning and communication systems will be appropriate, employers should take into account: (a) the size of their workplace and workforce; (b) who needs to be alerted and why; (c) quantities of substances involved and the level and type of risk those substances present; and (d) the emergency actions to be taken in the event of an incident and the required response times for these.","sub":416},{"k":"Guidance","r":"Paragraph 417","p":86,"t":"417 Warning systems are not necessarily restricted to signalling the need for withdrawal or evacuation of people who might be affected by the incident. They can also be to alert employees of an incident or emergency, so that they can take appropriate emergency action to contain or mitigate the incident. Where there are multiple alarm systems in a workplace, employers should ensure that these are clearly discernible and that their employees have the necessary training and equipment to be able to safely carry out the correct actions required.","sub":417},{"k":"ACOP","r":"Paragraph 418","p":86,"t":"418 Early detection and warning measures should be in place if there is the potential for a release of dangerous substance of sufficient quantity to create a significant explosion hazard. Where appropriate, immediate measures should be in place to detect such a release before it reaches its LEL.","sub":418},{"k":"ACOP","r":"Paragraph 419","p":86,"t":"419 The employer is responsible for selecting a suitable place or places of safety where people can gather and be accounted for after vacating their workplaces.","sub":419},{"k":"Guidance","r":"Paragraph 420","p":86,"t":"420 Employers should already have considered mitigation measures against fire and explosion by the provision of adequate escape facilities in parallel with the requirement contained in general fire safety legislation (see paragraphs 20–22). The installation and type of warning system is dependent on the nature of the operation, eg an early detection system would be required in an aerosol filling shed but not in a small storage site.","sub":420},{"k":"Guidance","r":"Paragraph 421","p":86,"t":"421 However, the presence of a dangerous substance can accelerate the spread of fire and production of smoke and other toxic fumes. Particular attention should be given in choosing the escape route and place of safety to ensure that it will not be affected by the event should it escalate. Employers will also need to take account of situations where toxic substances may be released as a result of an incident. When considering escape facilities employers should assess the potential for explosions, rapid fire development and ingress of dangerous substances into escape routes which may compromise escape.","sub":421},{"k":"ACOP","r":"Paragraph 422","p":86,"t":"422 The employer should ensure sufficient information on the nature of any foreseeable emergencies involving dangerous substances is made available to the relevant accident and emergency services who are likely to be asked to deal with such incidents. As a minimum, employers should contact the external emergency services, inform them that this information is available and offer to send it to them. Employers should also make this information available to any on-site emergency services.","sub":422},{"k":"Guidance","r":"Paragraph 423","p":86,"t":"423 Full mitigation of foreseeable accidents, incidents and emergencies will typically be achieved by a combination of workplace emergency arrangements and those provided by the emergency services overall to ensure the safety of employees, emergency service personnel and other people. Employers will need to consider if some or all of the external emergency services need to be aware of their emergency arrangements. In the case of offshore installations, the coastguard may also need to be included. The fire service will in any case assume responsibility for tackling any fire upon their arrival, but they may also be able to assist in dealing with other non-fire emergencies such as released or spilled dangerous substances.","sub":423},{"k":"Guidance","r":"Paragraph 424","p":87,"t":"424 If requested by the emergency services, employers should be prepared to send the information to them and/or meet with their representatives to discuss the emergency procedures. The information made available will help the emergency services to prepare their own response procedures and should include: (a) the identity, location and approximate quantities of dangerous substances; (b) the foreseeable types of accident, incident or emergency that could occur and the hazards that may result; (c) where on site such events could occur, what effects they could have, other areas that may be affected should the event escalate and the possible repercussion that may cause; (d) the emergency arrangements drawn up by the employer to deal with accidents, incidents and emergencies, the procedures prepared by the employer to deal with any such event, the warnings and other communication systems, and escape facilities; and (e) details of the employer’s designated contact who will advise the emergency services of the situation on their arrival at an emergency.","sub":424},{"k":"Guidance","r":"Paragraph 425","p":87,"t":"425 Information, training and instruction on emergency arrangements should be made available to employees and their representatives. For example, this may be by the periodic circulation of copies of the arrangements, or providing individual copies. The adequacy of emergency procedures should be regularly tested and any deficiencies found should be addressed. Unless the risk assessment indicates otherwise, employers should display the emergency procedures in a prominent position at key locations in the workplace. Appropriate information on emergency arrangements should also be communicated to non-employees who may be affected.","sub":425},{"k":"Guidance","r":"Paragraph 426","p":87,"t":"426 Employers should keep the emergency services updated on significant changes, such as the quantities and nature of dangerous substances present.","sub":426},{"k":"ACOP","r":"Paragraph 427","p":87,"t":"427 Employers should implement those measures necessary to achieve control or containment of an accident, incident or emergency to allow sufficient time for people to escape or be evacuated to a place of safety. Following an event, employers must assess whether any danger remains and carry out the necessary measures to make the situation safe. If there are any doubts about safety, expert assistance should be sought, eg from accident and emergency services. Implementation of the necessary measures should be achieved without exposing employees or others to unnecessary risk, giving precedence to remote control measures over those requiring entry into the affected area.","sub":427},{"k":"Guidance","r":"Paragraph 428","p":87,"t":"428 Employers should adopt a systematic approach for identifying potential accidents, incidents, emergencies or other events and consider how they can be detected when they have occurred or are occurring. They also need to determine, for the various stages of the accident, incident or emergency, the appropriate type and degree of intervention to both mitigate the consequences of the event and prevent its further escalation. The impact of an accident, incident or emergency can often be greatly reduced if prompt and correct action is taken as soon as the event occurs.","sub":428},{"k":"Guidance","r":"Paragraph 429","p":88,"t":"429 Factors to be taken into account by employers when assessing the requirements for emergency arrangements include: (a) the properties of the dangerous substances present, their quantities and the way they are used or stored; (b) the foreseeable types of accidents, incidents, emergencies or other events that may occur, and the level of risk that may be presented (eg the response required to deal with a major fire in a bulk storage facility will be different from that required for a small spill of a few litres of flammable liquid); (c) precursors to the end emergency (fire or explosion) involving the dangerous substance (eg unignited leaks, spills and releases of the dangerous substance, or the potential for these, arising for example, from mechanical damage to plant containing dangerous substances); (d) means of detecting events, eg the selection and effectiveness of the means of detecting a leak, spill or release of a dangerous substance and hence the speed and nature of the emergency response will depend on such matters as location, size of release and potential escalating events; (e) the trigger events for alarms and warnings, eg where mechanical exhaust ventilation is provided to ensure a safe atmosphere, it might well be considered reasonable that critical reduction in its flow should cause an alarm or suitable warning to be given, so that emergency actions can be taken to isolate the release of the dangerous substance and take other remedial action as necessary; (f) the role of non-employees in emergency arrangements, eg a spill outdoors during a driver-controlled tanker unloading operation. In this case it would be reasonable for the driver (who may not be an employee) to detect the spill and initiate appropriate emergency action which might include warning other people in the locality, using spill control equipment and calling the emergency services; (g) specific procedures that employees and others should follow if an accident, incident or emergency occurs (eg clearing up spills of flammable liquids or, for more serious incidents, moving to a safe area or complete evacuation of the workplace); (h) the role, responsibilities and authority of employees who may be allocated specific duties (eg people responsible for shutting down equipment, checking that specific areas have been successfully evacuated, contacting the emergency services etc); (i) the provision, where necessary, of suitable safety equipment or personal protective equipment; and (j) procedures for assisting particular groups of people, such as members of the public or other visitors on site (who may be unfamiliar with the workplace and the risks from dangerous substances that are present) or disabled employees.","sub":429},{"k":"Guidance","r":"Paragraph 430","p":88,"t":"430 Steps to mitigate the effects of an incident may, where it is safe to do so, include: (a) evacuating people who may be affected, taking into account possible escalation of the incident, to a place of safety; (b) isolating plant or equipment from where uncontrolled releases of a dangerous substance are occurring; (c) removing the dangerous substance under threat to a safe place; (d) preventing the further spread of a spilt or leaking dangerous substance by the use of barriers, booms or absorbent materials; (e) limiting the extent of any flammable vapour cloud arising from a release of the dangerous substance by, for example, the use of water sprays and curtains, or applying firefighting foam over the surface of the spilt or leaking liquid materials; (f) increasing natural or mechanical ventilation to dilute hazardous concentrations of dangerous substances arising from an incident; (g) controlling potential ignition sources in non-hazardous areas that are now affected by an uncontrolled release of dangerous substance; (h) protecting the vessels or plant containing the dangerous substance against the effects of fire by such means as water deluge systems, water monitors and passive fire protection coatings; and (i) applying appropriate firefighting materials to a fire involving a dangerous substance.","sub":430},{"k":"Guidance","r":"Paragraph 431","p":89,"t":"431 Under regulation 8, measures to restore the situation to normal following an event are limited to those measures needed to achieve the normal level of safety for the premises. They do not include measures to rebuild a plant or restore it to normal production or operation but could include: (a) repairing or decommissioning leaking or unsafe plant; (b) safe recovery and clean-up of spilt or leaked dangerous substances; (c) making safe damaged or unstable buildings; (d) repair or replacement of any equipment, monitoring devices or alarms necessary for the safety of employers or others present on the premises; (e) neutralising or disposing of any unstable or dangerous substances resulting from an incident.","sub":431},{"k":"Guidance","r":"Paragraph 432","p":89,"t":"432 Measures taken to deal with accidents, incidents and emergencies will need to be adaptable to deal with the specific situation. This is also the case with the remedial action following the accident, incident or emergency. Employers must therefore ensure that those of their employees expected to respond in the event of an accident, incident or emergency involving a dangerous substance have the necessary skills, expertise and training to carry out the functions expected of them; and that suitable plant and equipment necessary to carry out these functions is available and properly maintained for immediate use.","sub":432},{"k":"Guidance","r":"Paragraph 433","p":89,"t":"433 Equipment to be provided should include any PPE (including appropriate protective clothing and footwear) that is necessary for employees to safely carry out the emergency actions required. However, employees should not be exposed to unnecessary risk in carrying these out. When selecting equipment to be used in emergencies, employers should ensure it is appropriate for the circumstances in which it may be used. For example, the need to avoid ignition sources when dealing with the releases of flammable vapours, gases etc.","sub":433},{"k":"Guidance","r":"Paragraph 434","p":89,"t":"434 Before carrying out any remedial work the employer should carry out a risk assessment to determine the control measures that need to be put in place to ensure the health and safety of employees. As part of this assessment the employer should determine the appropriate systems of work, including possible permit-to-work systems that need to be implemented before employees or contractors enter any areas affected by the incident or emergency.","sub":434},{"k":"ACOP","r":"Paragraph 435","p":89,"t":"435 Employers are not required to implement additional emergency arrangements if they have determined through the risk assessment carried out under regulation 5(1) that the risk is slight because of: (a) the quantity of each substance present; (b) the effectiveness of existing emergency arrangements; (c) control measures in place that fulfil the requirements of regulation 6 and other fire safety legislation.","sub":435},{"k":"Guidance","r":"Paragraph 436","p":90,"t":"436 In respect of fire, the normal emergency procedures (including escape routes and means of giving warning) already provided in the workplace may be assessed to be sufficient. General guidance on fire precautions is available on HSE’s website at www.hse.gov.uk/toolbox/fire.htm (also see paragraph 90). Employers must be satisfied, however, that those control measures will continue to be effective if an accident, incident or emergency occurs. For example, where an accompanying event such as an explosion is possible that might compromise an escape route, alternative measures may need to be considered to ensure safe evacuation. For example, this might include a specially strengthened escape route and/or refuge. The escape route from a non-hazardous area must not be through a hazardous area. Regulation 9 Information, instruction and training Summary of regulation 9 Appropriate information, training and instruction should be given to contractors and employees on the dangerous substances present together with information on the hazards, risks, precautions and actions necessary for them to remain safe.","sub":436},{"k":"Law","r":"Regulation 9(1)","p":90,"t":"(1) Where a dangerous substance is present at the workplace, the employer shall provide his employees with – (a) suitable and sufficient information, instruction and training on the appropriate precautions and actions to be taken by the employee in order to safeguard himself and other employees at the workplace; (b) the details of any such substance including – (i) the name of the substance and the risk which it presents; (ii) access to any relevant safety data sheet; and (iii) legislative provisions which concern the hazardous properties of the substance; and (c) the significant findings of the risk assessment."},{"k":"Law","r":"Regulation 9(2)","p":90,"t":"(2) The information, instruction and training required by paragraph (1) shall be – (a) adapted to take account of significant changes in the type of work carried out or methods of work used by the employer; and (b) provided in a manner appropriate to the risk assessment."},{"k":"ACOP","r":"Paragraph 437","p":90,"t":"437 The information provided to employees as required under regulation 4(1)(b) and, to the extent that it is required by the nature and degree of the risk, to other people who may be present at a workplace, should include the following: (a) how and where the dangerous substance is used in the specific site activities in addition to the general information in the SDS; (b) the precautions and actions mentioned in regulation 9(1) as part of the information for employees include the control and mitigation measures adopted, including methods of work, the reasons behind them, and how to use them properly; (c) training and instruction, which should include the reasoning (theory) behind the practice. Training in the use and application of control measures and equipment should be carried out taking into account recommendations and instructions supplied by the manufacturer; (d) any procedures for dealing with accidents, emergencies and incidents prepared in accordance with regulation 8. This ranges from smaller unplanned incidents (including dealing with faults, clearing blockages) to larger emergencies and should prepare staff for how to react if and when foreseeable events happen; (e) any further relevant information resulting from a review of the risk assessment, why it has been done and how any changes will affect the way employees do the work in the future.","sub":437},{"k":"ACOP","r":"Paragraph 438","p":91,"t":"438 The information, instruction and training provided should be appropriate to the level of understanding and experience of employees. It should be provided in a form which takes account of any language difficulties or disabilities. Information can be provided in whatever form is most suitable in the circumstances, as long as it can be understood by everyone.","sub":438},{"k":"ACOP","r":"Paragraph 439","p":91,"t":"439 Should change to any work processes occur, then the employer has a duty to ensure extra information, instruction and training is given if necessary.","sub":439},{"k":"Guidance","r":"Paragraph 440","p":91,"t":"440 The control measures necessary for the safe handling and use of dangerous substances often require or are dependent on employees carrying out the appropriate operating procedures correctly and complying with written or verbal instructions. Employers, therefore, should provide employees with sufficient supervision and training to ensure that the systems of work required by regulation 6 and Schedule 1 are fully implemented and operating procedures are correctly followed.","sub":440},{"k":"Guidance","r":"Paragraph 441","p":91,"t":"441 The objective of providing information, instruction and training is to ensure that employees can work with dangerous substances without putting themselves or others at risk. The extent of the information, instruction and training required will be proportionate to the degree of complexity of the hazards, risks, processes and controls.","sub":441},{"k":"Guidance","r":"Paragraph 442","p":91,"t":"442 The significant findings of the risk assessment will help to explain to employees what the risks are and how the control/mitigation measures are designed to protect their safety. It will also help employees to understand and use the safeguards that employers introduce.","sub":442},{"k":"Guidance","r":"Paragraph 443","p":91,"t":"443 The employer should consider all the various ways of providing information, instruction and training and select those most appropriate to their own circumstances. Options include: (a) class or group tuition; (b) individual tuition; (c) written instructions including leaflets, courses etc; (d) refresher training, toolbox talks etc.","sub":443},{"k":"Guidance","r":"Paragraph 444","p":91,"t":"444 Employers also need to take account of the needs of people other than employees who may be present on site, such as contractors, members of the public etc. While it may not always be practical to provide formal training in these circumstances, employers should consider what other information or instruction may be needed to reduce risks. For example, pictorial signs for infrequent visitors to the site or those for whom English is not their first language (which might be the case for delivery drivers and other staff/visitors), notices explaining hazards (eg warning notices, no smoking signs etc), and copies of emergency and evacuation procedures.","sub":444},{"k":"Guidance","r":"Paragraph 445","p":92,"t":"445 For employees with little or no understanding of English, or those who cannot read English, employers may need to make special arrangements. These could include providing translation, using interpreters, or replacing written notes with clearly understood symbols or diagrams.","sub":445},{"k":"Guidance","r":"Paragraph 446","p":92,"t":"446 Where employees from one employer work on the premises of another, the employer occupying the premises must provide the other employer with sufficient information about any dangerous substances that may be present at the premises as part of the day-to-day activity. This information should be sufficiently detailed to allow the other employer to provide his own employees with information and any appropriate instruction on complying with the occupying employer’s measures.","sub":446},{"k":"Guidance","r":"Paragraph 447","p":92,"t":"447 The employer occupying the premises will also need to know about any dangerous substances that are likely to be used or produced by the work the other employer will be doing. This information is important as it allows the occupying employer to: (a) be satisfied that the measures put in place by the employer doing the work will not only protect their own employees from risks presented by the substances concerned, but also the occupier’s own employees; (b) provide their own employees with information and instruction about any dangerous substances that the other employer will be using or the work will produce; (c) reassure their employees that any risks to their safety are being properly controlled; and (d) take steps to ensure that emergency services personnel attending in the event of an incident are made aware of dangerous substances on the premises posing significant risk to their safety.","sub":447},{"k":"Guidance","r":"Paragraph 448","p":92,"t":"448 If changes to workplace activities necessitate a revised risk assessment, then it may be necessary for employers to provide updated information, instruction or training to employees (see also paragraph 147).","sub":448},{"k":"Guidance","r":"Paragraph 449","p":92,"t":"449 Information, instruction and training in relation to risks from dangerous substances need only be provided to non-employees where it is required to ensure their safety. For example, it would not be required in situations where the number and type of visitors to a workplace, or the short duration of the visit, combined with a negligible risk, make the provision of such information inappropriate (such as customers in a shop). However, where it is provided, it should be in proportion to the level and type of risk. Regulation 10 Identification of hazardous contents of containers and pipes Summary of regulation 10 and Schedule 5 This regulation applies to containers and pipes that contain dangerous substances that are not subject to or are exempt from any marking requirements in the legislation listed in Schedule 5.","sub":449},{"k":"Law","r":"Regulation 9(2) (continued)","p":92,"t":"Where containers and pipes used at work for dangerous substances are not marked in accordance with relevant requirements of the legislation listed in Schedule 5, the employer shall, subject to any derogations provided for in that legislation, ensure that the contents of those containers and pipes, together with the nature of those contents and any associated hazards, are clearly identifiable. 5 to Schedule 5 Legislation concerned with the marking of containers and pipes The Health and Safety (Safety Signs and Signals) Regulations 1996 (S.I. 1996/341); The Good Laboratory Practice Regulations 1999 (S.I. 1999/3106); The Chemicals (Hazard Information and Packaging for Supply) Regulations 2009 (S.I. 2009/716); The Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations 2009 (S.I. 2009/1348)."},{"k":"ACOP","r":"Paragraph 450","p":93,"t":"450 In many cases the marking of the majority of plant and equipment in which dangerous substances are conveyed and stored, including their location, is already covered by other legislation. Regulation 10 does not require everything to be marked or labelled, but the employer should decide, through their risk assessment, if and how contents of containers and pipes containing dangerous substances should be identified, whether appropriate identification is required and if so, the form it should take.","sub":450},{"k":"Guidance","r":"Paragraph 451","p":93,"t":"451 Identification is not necessary where the substance is a bulk solid product, such as flour, which is not itself a dangerous substance and is only hazardous if released from containment and dispersed in the air.","sub":451},{"k":"Guidance","r":"Paragraph 452","p":93,"t":"452 Identification of pipes and containers: (a) alerts people to the presence of a dangerous substance so that they can take the necessary precautions; (b) can also help to avoid confusion over contents and thereby avoid incorrect mixing of contents.","sub":452},{"k":"Guidance","r":"Paragraph 453","p":93,"t":"453 A container includes any fixed or portable, open or enclosed means to contain dangerous substances such as tanks, silos, reaction vessels and waste receptacles together with any associated pipe runs or piping system.","sub":453},{"k":"Guidance","r":"Paragraph 454","p":93,"t":"454 The regulation allows a common-sense approach to selecting means of identification, which will depend on the work activity and take into account security implications. Suitable means could include labelling, the use of appropriate colour coding, or instructions and training.","sub":454},{"k":"Guidance","r":"Paragraph 455","p":93,"t":"455 In situations where the contents may change regularly, eg chemical process vessels and pipes which are not dedicated to one substance, test tubes in laboratories etc, labelling may not be practicable. In these cases employers will need other arrangements to highlight to employees the hazards associated with the substances involved. Employers could provide process instruction sheets, record sheets or training for employees to alert them to the risk and the need for caution. Regulation 11 Duty of co-ordination Summary of regulation 11 Regulation 11 addresses the need to co-ordinate explosion protection measures where employers share the same workplace.","sub":455},{"k":"Law","r":"Regulation 9(2) (continued)","p":94,"t":"Where two or more employers share the same workplace (whether on a temporary or a permanent basis) where an explosive atmosphere may occur, the employer responsible for the workplace shall co-ordinate the implementation of all the measures required by these Regulations to be taken to protect employees from any risk from the explosive atmosphere."},{"k":"ACOP","r":"Paragraph 456","p":94,"t":"456 The employer responsible for the workplace should record as required by regulation 5(4) the ‘aim of co-ordination’ in the risk assessment as well as the measures and procedures for implementing it.","sub":456},{"k":"Guidance","r":"Paragraph 457","p":94,"t":"457 The aim of co-ordination is to safeguard people by: (a) alerting other employers, employees and others at the workplace to the potential presence of hazardous places; (b) ensuring that suitable control and mitigation measures are in place; (c) ensuring employees and others have sufficient training etc (see regulation 9); and (d) facilitating emergency arrangements in the event of an incident.","sub":457},{"k":"Guidance","r":"Paragraph 458","p":94,"t":"458 In shared premises, it may be the employer responsible for the workplace or one of the other employers who shares the premises whose work activity creates the explosive atmosphere. Effective co-ordination will require the responsible employer for the workplace to obtain sufficient information from all employers at the workplace about the nature of their work activity, whether any dangerous substances are likely to be present, and the likelihood of an explosive atmosphere occurring. All employers at the workplace should provide the responsible employer with the information required and assist in assessing the shared risks and implementing any necessary safety measures.","sub":458},{"k":"Guidance","r":"Paragraph 459","p":94,"t":"459 In multi-occupancy premises, it is not expected that an explosive atmosphere would extend into shared common areas. However, the occupier/employer should still carefully consider the potential for and effect of an incident involving dangerous substances on the rest of the premises including the common parts and liaise with the other occupants to ensure adequate emergency procedures are in place (see Section 3 of the HSW Act). Regulations 12–16 deal with the application of DSEAR outside Great Britain, exemptions from the Regulations, and amendments to and removal of other legislation. Regulation 12 Extension outside Great Britain","sub":459},{"k":"Law","r":"Regulation 9(2) (continued 2)","p":94,"t":"These Regulations shall apply outside Great Britain as sections 1 to 59 and 80 to 82 of the 1974 Act apply by virtue of the Health and Safety at Work etc. Act 1974 (Application outside Great Britain) Order 2013."},{"k":"Law","r":"Regulation 13","p":95,"t":"Regulation 13 Exemption certificates (1) Subject to paragraph (2), the Health and Safety Executive may, by a certificate in writing, exempt any person or class of persons or any dangerous substance or class of dangerous substances from all or any of the requirements or prohibitions imposed by or under these Regulations and any such exemption may be granted subject to conditions and to a limit of time and may be revoked at any time by a certificate in writing."},{"k":"Law","r":"Regulation 13(2)","p":95,"t":"(2) The Health and Safety Executive shall not grant any such exemption unless, having regard to the circumstances of the case, and in particular to – (a) the conditions, if any, which it proposes to attach to the exemption; and (b) any requirements imposed by or under any enactments which apply to the case, it is satisfied that the health and safety of persons who are likely to be affected by the exemption will not be prejudiced in consequence of it and that the exemption will be compatible with the requirements of the Directives."},{"k":"Law","r":"Regulation 13(3)","p":95,"t":"(3) For the purposes of paragraph (2), “the Directives” means Council Directive 98/24/EC on the protection of the health and safety of workers from the risks related to chemical agents at work and Council Directive 99/92/EC on minimum requirements for improving the safety and health protection of workers potentially at risk from explosive atmospheres."},{"k":"Law","r":"Regulation 14","p":95,"t":"Regulation 14 Exemptions for Ministry of Defence etc (1) In this regulation – (a) “Her Majesty’s Forces” means any of the naval, military or air forces of the Crown, whether raised inside or outside the United Kingdom and whether any such force is a regular, auxiliary or reserve force, and includes any civilian employed by those forces; (b) “visiting force” has the same meaning as it does for the purposes of any provision of Part 1 of the Visiting Forces Act 1952; and (c) “headquarters” means a headquarters for the time being specified in Schedule 2 to the Visiting Forces and International Headquarters (Application of Law) Order 1999."},{"k":"Law","r":"Regulation 14(2)","p":95,"t":"(2) The Secretary of State for Defence may, in the interests of national security, by a certificate in writing, exempt – (a) any of Her Majesty’s Forces; (b) any visiting force; (c) any member of a visiting force working in or attached to a headquarters; or (d) any person engaged in work involving dangerous substances, if that person is under the direct supervision of a representative of the Secretary of State for Defence; from all or any of the requirements or prohibitions imposed by these Regulations and any such exemption may be granted subject to conditions and to a limit of time and may be revoked at any time by a certificate in writing, except that, where any such exemption is granted, suitable arrangements shall be made for the assessment of the risk to safety created by the work involving dangerous substances and for adequately controlling the risk to persons to whom the exemption relates."},{"k":"Law","r":"Regulation 15","p":96,"t":"Regulation 15 Amendments (1) The Acts and instruments referred to in Part 1 of Schedule 6 shall be amended in accordance with that Part."},{"k":"Law","r":"Regulation 15(2)","p":96,"t":"(2) The instruments referred to in Part 2 of Schedule 6 shall be amended in accordance with that Part."},{"k":"Guidance","r":"Paragraph 460","p":96,"t":"460 This regulation brings Schedule 6 into force. It contains amendments to legislation (mainly concerning petrol).","sub":460},{"k":"Guidance","r":"Paragraph 461","p":96,"t":"461 Schedule 6 is not reproduced here because much of it is out of date or is likely to be to be changed by repeals or modifications linked to a 2013 review of petroleum legislation. The original text is readily accessible by searching for the DSEAR statutory instrument SI 2002/2776 on www.legislation.gov.uk. Regulation 16 Repeals and revocations","sub":461},{"k":"Law","r":"Regulation 16(1)","p":96,"t":"(1) The Act and instruments referred to in column 1 of Part 1 of Schedule 7 shall be repealed or revoked to the extent specified in the corresponding entry in column 3 of that Part."},{"k":"Law","r":"Regulation 16(2)","p":96,"t":"(2) The Act and instruments referred to in column 1 of Part 2 of Schedule 7 shall be repealed or revoked to the extent specified in the corresponding entry in column 3 of that Part."},{"k":"Law","r":"Schedule 4, paragraph 7","p":96,"t":"7 Schedule 7 Repeals and revocations Part 1 Repeal and revocation","sub":7},{"k":"Law","r":"Schedule 4 (continued)","p":96,"t":"The Petroleum c 32 The proviso to section 2(1). (Consolidation) Act 1928 Section 9. In section 25A, the word “and” at the end of paragraph (a). The Celluloid, etc SR & O 1921/1825 The whole Regulations. Factories, and Workshops Regulations 1921","h":"Column 1 Column 2 Column 3 Title Reference Extent of repeal or revocation"},{"k":"Law","r":"Schedule 4, paragraph 7 (continued)","p":97,"t":"7 Part 1 Repeal and revocation","h":"The Manufacture of SR & O 1928/82 The whole Regulations. Cinematograph Film Regulations 1928","sub":7},{"k":"Law","r":"Schedule 4 (continued 2)","p":97,"t":"The Factories Act 1961 c 34 Section 31. The Magnesium (Grinding SR & O 1946/2197 The whole Regulations. of Castings and other Articles) Special Regulations 1946 .","h":"Column 1 Column 2 Column 3 Title Reference Extent of repeal or revocation"},{"k":"Law","r":"Schedule 4 (continued 3)","p":97,"t":"The Factories (Testing of SI 1952/1689 The whole Regulations. Aircraft Engines and Accessories) Special Regulations 1952 The Shipbuilding and Ship- SI 1960/1932 Regulations 48 to 52, 54 repairing Regulations 1960 and 55 to 66. The Highly Flammable SI 1972/917 The whole Regulations. Liquids and Liquefied Petroleum Gases Regulations 1972 The Abstract of Special SI 1974/1587 The whole Order. Regulations (Highly Flammable Liquids and Liquefied Petroleum Gases) Order 1974","h":"The Dry Cleaning Special SI 1949/2224 The whole Regulations. Regulations 1949"},{"k":"Law","r":"Schedule 4, paragraph 7 (continued 2)","p":98,"t":"7 Part 2 Repeal and revocation","h":"The Dry Cleaning SI 1983/977 The whole Regulations. (Metrication) Regulations 1983","sub":7},{"k":"Law","r":"Schedule 4 (continued 4)","p":98,"t":"The Factories (Testing of SI 1983/979 The whole Regulations. Aircraft Engines and Accessories) (Metrication) Regulations 1983 .","h":"Column 1 Column 2 Column 3 Title Reference Extent of repeal or revocation"},{"k":"Law","r":"Schedule 4 (continued 5)","p":98,"t":"The Carriage of SI 1996/2092 Regulation 22(b). Dangerous Goods (Classification, Packaging and Labelling) and Use of Transportable Pressure Receptacles Regulations 1996","h":"The Workplace (Health, SI 1992/3004 Regulation 6(3)(b). Safety and Welfare) Regulations 1992"},{"k":"Law","r":"Schedule 4 (continued 6)","p":98,"t":"Regulation 17 Transitional provisions Summary of regulation 17 Regulation 17 sets out the transitional arrangements for workplaces and work equipment where explosive atmospheres may occur. The period of transition has now elapsed, the text of this regulation has therefore not been reproduced in this publication. Historical information on ensuring compliance in the workplace may be found in Appendix 6.","h":"The Carriage of SI 1996/2095 Schedule 12. Dangerous Goods by Road Regulations 1996"},{"k":"Appendix","r":"Appendix 1","p":99,"t":"Appendix 1 Notice of Approval By virtue of section 16(4) of the Health and Safety at Work etc Act, and with the consent of the Secretary of State for Work and Pensions, the Health and Safety Executive has on 30 October 2013 approved the revised Code of Practice Dangerous Substances and Explosive Atmospheres: Dangerous Substances and Explosive Atmospheres Regulations 2002. Approved Code of Practice and guidance (Second edition, 2013, L138). The revised Code of Practice gives practical guidance on the Dangerous Substances and Explosive Atmospheres Regulations 2002. By virtue of section 16(5) and with the consent of the Secretary of State for Work and Pensions under that paragraph, the Health and Safety Executive has withdrawn its approval of the following Codes of Practice which shall cease to have effect on"},{"k":"Appendix","r":"Appendix 1, paragraph 9","p":99,"t":"9 December 2013: • L134 Design of plant, equipment and workplaces. Dangerous Substances and Explosive Atmospheres Regulations 2002. Approved Code of Practice and guidance • L135 Storage of dangerous substances. Dangerous Substances and Explosive Atmospheres Regulations 2002. Approved Code of Practice and guidance • L136 Control and mitigation measures. Dangerous Substances and Explosive Atmospheres Regulations 2002. Approved Code of Practice and guidance • L137 Safe maintenance, repair and cleaning procedures. Dangerous Substances and Explosive Atmospheres Regulations 2002. Approved Code of Practice and guidance • L138 Dangerous Substances and Explosive Atmospheres. Dangerous Substances and Explosive Atmospheres Regulations 2002. Approved Code of Practice and guidance (2003 edition) This Code of Practice comes into effect on 9 December 2013.","sub":9},{"k":"Appendix","r":"Appendix 2","p":100,"t":"Appendix 2 Other relevant legislation"},{"k":"Appendix","r":"Appendix 2, paragraph 1","p":100,"t":"1 The duties in DSEAR apply alongside the HSW Act, other regulations made under the Act, and legislation on fire precautions and within a wider legislative context. Because of their close relationship with DSEAR, an introduction to general fire safety legislation and the EPS regulations is included earlier in this document (see paragraphs 20–26).","h":"Relationship with other health and safety legislation","sub":1},{"k":"Appendix","r":"Appendix 2, paragraph 2","p":100,"t":"2 The Management of Health and Safety at Work Regulations (SI 1999/3242) (the Management Regulations) also require employers and the self-employed to assess the general risks to health and safety arising from their work activity and identify the preventive and protective measures that need to be taken to control the identified risks.","h":"The Management of Health and Safety at Work Regulations 1999","sub":2},{"k":"Appendix","r":"Appendix 2, paragraph 3","p":100,"t":"3 The more specific provisions of DSEAR will only apply where dangerous substances are present or used. For example, an assessment of the risks from dangerous substances and arrangements for emergencies carried out under DSEAR will not need to be repeated for the Management Regulations, and in many cases may be incorporated into the more general ‘management’ assessment as a subset. There are legal requirements, in other regulations, to consult employees. It can be helpful to involve employees or their representatives when carrying out risk assessments.","sub":3},{"k":"Appendix","r":"Appendix 2, paragraph 4","p":100,"t":"4 Most substances that may be dangerous (to safety) in terms of DSEAR will also present a health risk for which the Control of Substances Hazardous to Health Regulations 2002 (SI 2002/2677) (COSHH) will apply. Employers will have duties to control the risks from those substances under both sets of regulations but the solutions for both are likely to be common.","h":"The Control of Substances Hazardous to Health Regulations 2002","sub":4},{"k":"Appendix","r":"Appendix 2, paragraph 5","p":100,"t":"5 In 2013/14 the area of classification packaging and labelling is in transition. These developments were driven by the European Regulation (EC) No 1272/2008 on Classification, Labelling and Packaging of Substances and Mixtures (known as the CLP Regulation or CLP). CLP is a direct-acting regulation.","h":"Classification, labelling and packaging of dangerous substances","sub":5},{"k":"Appendix","r":"Appendix 2, paragraph 6","p":100,"t":"6 By 2015 CLP will replace the existing European system on the classification, labelling and packaging of chemicals – the Dangerous Substances Directive (67/548/EEC) and the Dangerous Preparations Directive (99/45/EC). Both these earlier Directives are implemented in Great Britain by the Chemicals (Hazard Information and Packaging for Supply) Regulations 2009 (SI 2009/716) (CHIP). For these purposes CHIP will lapse in 2015. There are transitional periods in CLP but by 1 June 2015, chemical suppliers must comply only with the CLP Regulation.","sub":6},{"k":"Appendix","r":"Appendix 2, paragraph 7","p":101,"t":"7 There are implications for DSEAR because regulation 2 refers to the Approved Classification and Labelling Guide and CHIP which will both lapse. The CLP Regulation now contains the list of harmonised classifications in Table 3.2 in part 3 of Annex VI of CLP. These harmonised classifications and accompanying labelling requirements are legally binding on all chemical suppliers. As a consequence, the Approved Supply List is discontinued and should no longer be used. Appendix 3 of this document contains more information.","sub":7},{"k":"Appendix","r":"Appendix 2, paragraph 8","p":101,"t":"8 REACH is a direct-acting European regulation. It regulates the placing of substances and articles into the marketplace and affects chemicals supply, packaging and labelling. The legal provisions relating to safety data sheets now appear in Article 31 and Annex II of REACH.","h":"Registration, Evaluation, Authorisation and Restriction of Chemicals EC no 1907/2006 (REACH)","sub":8},{"k":"Appendix","r":"Appendix 2, paragraph 9","p":101,"t":"9 The Provision and Use of Work Equipment Regulations 1998 (SI 1998/2306) (PUWER) require employers, and people in control to provide safe work equipment, to use it safely and to maintain it.","h":"The Provision and Use of Work Equipment Regulations 1998","sub":9},{"k":"Appendix","r":"Appendix 2, paragraph 10","p":101,"t":"10 Under the Personal Protective Equipment Regulations 1992 (SI 1992/2966) employers must select, provide and maintain (at no charge) appropriate protective equipment for employees whenever risks are not adequately protected against by other means. Employers should also provide information, training and instruction for employees on its use and maintenance.","h":"The Personal Protective Equipment Regulations 1992","sub":10},{"k":"Appendix","r":"Appendix 2, paragraph 11","p":101,"t":"11 DSEAR amended the workplace application of petrol safety legislation. Site operators that store petrol for dispensing into vehicles, ships, boats and planes must be licensed under petrol safety law but DSEAR also applies to activities at these sites. Where petrol is stored for different (non-dispensing) purposes, such as factories etc, a petrol licence is not required, but compliance with DSEAR is necessary.","h":"The Petroleum (Consolidation) Act 1928 and associated regulations","sub":11},{"k":"Appendix","r":"Appendix 2, paragraph 12","p":101,"t":"12 DSEAR does not apply to activities on sites that are not workplaces; therefore the current legislation concerning the storage of petrol in domestic premises remains in place.","sub":12},{"k":"Appendix","r":"Appendix 3","p":102,"t":"Appendix 3 Revocation of CHIP and the application of the European CLP Regulation"},{"k":"Appendix","r":"Appendix 3, paragraph 1","p":102,"t":"1 From 1 June 2015, European Regulation (EC) No 1272/2008 on Classification, Labelling and Packaging of Substances and Mixtures (known as the CLP Regulation or CLP) will repeal both the Dangerous Substances Directive (67/548/ EEC) and the Dangerous Preparations Directive (99/45/EC) and will become the primary legislation in this area. As a consequence the Chemicals (Hazard Information and Packaging for Supply) Regulations 2009 (CHIP), which implement both these directives, will be revoked. One provision of CHIP relating to data retention and dangerous preparations will remain until June 2018, after which CHIP is fully revoked.","sub":1},{"k":"Appendix","r":"Appendix 3, paragraph 2","p":102,"t":"2 Across the EU, the CLP Regulation adopts the United Nations’ Globally Harmonised System on chemical classification and labelling (GHS). The CLP Regulation is directly acting on all EU member states. This means that in contrast to directives, no national transposition is necessary and the need for the CHIP Regulations falls away.","sub":2},{"k":"Appendix","r":"Appendix 3, paragraph 3","p":102,"t":"3 The CLP Regulation applies to substances placed on the market from","sub":3},{"k":"Appendix","r":"Appendix 3, paragraph 1 (continued)","p":102,"t":"1 December 2010. It will apply to mixtures (formerly called preparations) from","sub":1},{"k":"Appendix","r":"Appendix 3, paragraph 1 (continued 2)","p":102,"t":"1 June 2015. Chemical suppliers can apply CLP to mixtures placed on the market ahead of the mandatory compliance date if they choose to do so (see below).","sub":1},{"k":"Appendix","r":"Appendix 3, paragraph 4","p":102,"t":"4 After 1 June 2015, chemical suppliers must comply only with the CLP Regulation.","sub":4},{"k":"Appendix","r":"Appendix 3, paragraph 5","p":102,"t":"5 The migration to the CLP Regulation means that DSEAR employers will need to become familiar with the new classification hazard terminology and accompanying hazard pictograms relevant to explosive atmospheres. The new CLP pictograms and wording will increasingly be seen on SDSs and product labels and this will need to be taken into account for employee information, training and instruction.","h":"Implications for DSEAR","sub":5},{"k":"Appendix","r":"Appendix 3, paragraph 6","p":102,"t":"6 Chemical users will see new designs, wording and symbols on product hazard labels. The CLP hazard pictograms are very similar to the CHIP hazard symbols but they have a new shape, design and colour.","h":"What does this mean for chemical users?","sub":6},{"k":"Appendix","r":"Appendix 3, paragraph 7","p":102,"t":"7 New hazard statements will replace the CHIP risk phrases (R phrases).","sub":7},{"k":"Appendix","r":"Appendix 3, paragraph 8","p":102,"t":"8 New precautionary statements will replace the CHIP safety phrases (S phrases).","sub":8},{"k":"Appendix","r":"Appendix 3, paragraph 9","p":102,"t":"9 Guidance on complying with CLP is developed and agreed at EU rather than national level and a detailed suite of guidance is available on the web pages of the European Chemicals Agency (ECHA) http://echa.europa.eu.","sub":9},{"k":"Appendix","r":"Appendix 3, paragraph 10","p":103,"t":"10 The legal provisions relating to SDSs now appear in Article 31 and Annex II of REACH.","sub":10},{"k":"Appendix","r":"Appendix 3, paragraph 11","p":103,"t":"11 Chemical suppliers must classify, label and package their preparations according to CHIP until 1 June 2015 (regulations 4 and 6–11 refer). As an alternative, chemical suppliers can classify, label and package mixtures (preparations) according to the CLP criteria ahead of this date if they choose to do so. In this case, suppliers must, in addition, continue to classify the mixture under regulation 4 of CHIP, although this information should only be included in an SDS (the requirements on labelling and packaging in regulations 6 to 11 of CHIP will no longer apply).","sub":11},{"k":"Appendix","r":"Appendix 3, paragraph 12","p":103,"t":"12 During this transitional period, product hazard labels must only show the details of one regime or the other – ‘mixed’ labels are not permitted. If a mixture is classified according to CHIP, it must only be labelled and packaged according to CHIP. Conversely, if a mixture is classified according to CLP, it must only be labelled and packaged according to CLP.","sub":12},{"k":"Appendix","r":"Appendix 3, paragraph 13","p":103,"t":"13 The Approved Supply List was published in Great Britain and reproduced the list of dangerous substances that had been assigned harmonised classifications and accompanying labelling requirements agreed by all EU Member States and which appeared in Annex I to the Dangerous Substances Directive (67/548/EEC).","h":"Withdrawal of the HSE Approved Supply List","sub":13},{"k":"Appendix","r":"Appendix 3, paragraph 14","p":103,"t":"14 However, the CLP Regulation repealed Annex I in full. As a consequence, the Approved Supply List was discontinued and should no longer be used. It is out of date and has no legal effect.","sub":14},{"k":"Appendix","r":"Appendix 3, paragraph 15","p":103,"t":"15 It was important, however, that the 40 years of scientific development and technical understanding of the most dangerous chemicals should not be lost. The CLP Regulation immediately re-enacted the list of harmonised classifications which now appears in Part 3 of Annex VI of CLP. The list is represented in two Tables: (a) Table 3.1 provides the classification and labelling information using CLP criteria and terminology. (b) Table 3.2 provides the same information but uses the Dangerous Substances Directive (CHIP) criteria and terminology. (Table 3.2 will be repealed from","sub":15},{"k":"Appendix","r":"Appendix 3, paragraph 1 (continued 3)","p":103,"t":"1 June 2015 when CLP applies in full and the ‘old’ list is no longer needed).","sub":1},{"k":"Appendix","r":"Appendix 3, paragraph 16","p":103,"t":"16 Harmonised classifications and the accompanying labelling requirements are legally binding where they are used.","sub":16},{"k":"Appendix","r":"Appendix 3, paragraph 17","p":103,"t":"17 Annex VI of CLP is the official list of harmonised classifications and should be the only source for those seeking this information. The Annex is easily searchable by a number of different fields at http://esis.jrc.ec.europa.eu/index.php?PGM=cla.","sub":17},{"k":"Appendix","r":"Appendix 3, paragraph 18","p":103,"t":"18 Regulation 14 of CHIP currently sets out the enforcement arrangements for both CHIP and the CLP Regulation. This will continue to be the case until 1 June 2015. The enforcement arrangements for the CLP Regulation will then appear in a new set of regulations. In addition to the enforcement of CLP, these regulations will also include the enforcement arrangements for the biocides regime, ‘prior informed consent’ (PIC – export of dangerous chemicals) and the appointment of the UK Competent Authorities for CLP, biocides and PIC.","sub":18},{"k":"Appendix","r":"Appendix 3, paragraph 19","p":104,"t":"19 Employers subject to DSEAR who need advice on the CLP Regulation should look to the suite of detailed guidance supporting the Regulation provided by the European Chemicals Agency (ECHA) http://echa.europa.eu/support. Alternatively, employers can contact the UK CLP Helpdesk: ukreachca@hse.gsi.gov.uk.","h":"Guidance on the CLP Regulation","sub":19},{"k":"Appendix","r":"Appendix 3, paragraph 20","p":104,"t":"20 Another source of helpful information is ECHA’s Classification and Labelling Inventory which provides information on all substances placed on the EU market and notified to ECHA: http://echa.europa.eu/en/regulations/clp/cl-inventory.","sub":20},{"k":"Appendix","r":"Appendix 4","p":105,"t":"Appendix 4 Fire resistance"},{"k":"Appendix","r":"Appendix 4, paragraph 1","p":105,"t":"1 The fire resistance of a physical barrier of fire-resisting construction is a measure of its ability to withstand the effects of fire in one or more of the following ways: (a) integrity: resistance to fire penetration, ie the prevention of the passage of flame and smoke; (b) insulation: resistance to the transfer of excessive heat; and (c) load-bearing capacity: resistance to collapse, ie to maintain support of the design load of other parts of the building, plant or structure, where the barrier also provides this.","sub":1},{"k":"Appendix","r":"Appendix 4, paragraph 2","p":105,"t":"2 The level of fire resistance is specified as the duration that the barrier is able to withstand the effects of fire in respect of one or more of these properties. This is determined through standard test procedures, where the periods of fire resistance are conventionally reported as: (a) short (or 30 minutes); (b) medium (or 60 minutes); or (c) long (or 120 minutes).","sub":2},{"k":"Appendix","r":"Appendix 4, paragraph 3","p":105,"t":"3 The standard test procedures are those described in: (a) BS 476 Parts 20–24;66 (b) BS EN 1363;67 in conjunction with (c) BS EN 1364 Parts 1–2;68 (d) BS EN 1365 Parts 1–4;69 (e) BS EN 1366 Parts 1–2;70 (f) BS EN 1634 Parts 1–2.71","sub":3},{"k":"Appendix","r":"Appendix 5, paragraph 1","p":106,"t":"1 The reaction to fire of a physical barrier of fire-resisting construction is a measure of the contribution the materials used in its construction have on the development and spread of the fire. This contribution is categorised as minimal, low, medium, high, and very high risk. The categories are determined in accordance with standard test procedures, though some materials are deemed to be of minimal risk and do not require to be tested. These are: (a) concrete; (b) fired clay (ie bricks); (c) ceramics; (d) steel; (e) plaster and masonry containing not more than 1% by weight or volume of organic material; and (f) concrete bricks or blocks.","sub":1},{"k":"Appendix","r":"Appendix 5, paragraph 2","p":106,"t":"2 The categories of materials that may be used in the construction of a physical barrier of fire-resisting construction are limited to: minimal, low, or medium. The minimum category that may be used depends on the type of barrier – this is discussed in paragraphs 266–279.","sub":2},{"k":"Appendix","r":"Appendix 5, paragraph 3","p":106,"t":"3 The test procedures and performance required by either the British Standards or the comparable European Harmonised Standards for the three categories are as follows: British Standards European Harmonised Standards Minimal The material is certified non-combustible The material has achieved a classification of A1 according to the test specified in BS 476-461 when tested in accordance with BS EN ISO throughout, or the material does not flame or 118272 and BS EN ISO 1716,73 or the material has cause any rise in temperature on either the achieved a classification of A2 when tested in centre (specimen) or furnace thermocouples accordance with BS EN 1382374 and BS EN ISO according to the test specified in BS 476-1161 118272 or BS EN ISO 171673 Low The surface of the material (or where it is The material has achieved a classification of B or bonded throughout to a substrate, the better when tested in accordance with surface material combined with the substrate) BS EN 1382374 and BS EN ISO 11925-175 has a surface spread of flame of Class 1 when tested in accordance with BS 476-761 and when tested in accordance with BS 476-661 has an index of performance (I) not exceeding 12 and a sub-index (i1) not exceeding 6 Medium The material has a surface spread of flame The material has achieved a classification of C or of Class 1 when tested in accordance with better when tested in accordance with BS EN BS 476-761 1382374 and BS EN IS
