or service installations. Ducts • BS EN 1366-2:1999 Fire resistance tests for service installations. Fire dampers"},{"k":"Reference","r":"Reference 71","p":114,"t":"71 BS EN 1634 Parts 1–2 British Standards Institution"},{"k":"Reference","r":"Reference 71 (continued)","p":114,"t":"• BS EN 1634-1:2008 Fire resistance and smoke control tests for door, shutter and, openable window assemblies and elements of building hardware. Fire resistance tests for doors, shutters and openable windows • BS EN 1634-2:2008 Fire resistance and smoke control tests for door, shutter and openable window assemblies and elements of building hardware. Fire resistance characterisation test for elements of building hardware"},{"k":"Reference","r":"Reference 72","p":114,"t":"72 BS EN ISO 1182:2010 Reaction to fire tests for products. Non-combustibility test British Standards Institution"},{"k":"Reference","r":"Reference 73","p":114,"t":"73 BS EN ISO 1716:2010 Reaction to fire tests for products. Determination of the gross heat of combustion (calorific value) British Standards Institution"},{"k":"Reference","r":"Reference 74","p":114,"t":"74 BS EN 13823:2010 Reaction to fire tests for building products. Building products excluding floorings exposed to the thermal attack by a single burning item British Standards Institution"},{"k":"Reference","r":"Reference 75","p":114,"t":"75 BS ISO TR 11925-1:1999 Reaction to fire tests. Ignitability of building products subjected to direct impingement of flame. Guidance on ignitability British Standards Institution"},{"k":"Reference","r":"Reference 75 (continued)","p":114,"t":"Further reading The EU has produced a general advisory guide but note that its requirement to produce an Explosion Protection Document is not applicable in GB because the information is already covered domestically by DSEAR Regulations 5, 6 and 7:"},{"k":"Reference","r":"Reference 75 (continued)","p":114,"t":"• http://bookshop.europa.eu/is-bin/INTERSHOP.enfinity/WFS/EU-Bookshop-Site/ en_GB/-/EUR/ViewPublication-Start?PublicationKey=KE6404175"},{"k":"Reference","r":"Reference 75 (continued 2)","p":115,"t":"ACOP Approved Code of Practice.","h":"Glossary"},{"k":"Reference","r":"Reference 75 (continued 3)","p":115,"t":"ADR European Agreement concerning the International Carriage of Dangerous Goods by Road."},{"k":"Reference","r":"Reference 75 (continued 4)","p":115,"t":"ALARP as low as reasonably practicable."},{"k":"Reference","r":"Reference 75 (continued 5)","p":115,"t":"ambient temperature the temperature of an immediate locality."},{"k":"Reference","r":"Reference 75 (continued 6)","p":115,"t":"ATEX the collective name for the Explosive Atmospheres Directives 99/92/EC and 94/9/EC of the European Parliament. Both deal with precautions for explosive atmospheres. The first (also known as ATEX 137) focuses on worker safety and the second (‘ATEX 95’ or ‘the ATEX Equipment Directive’) focuses on the correct standard of equipment to avoid ignition. Also see EPS."},{"k":"Reference","r":"Reference 75 (continued 7)","p":115,"t":"auto-ignition temperature the minimum temperature at which a material will ignite spontaneously under specified test conditions. Also referred to as the minimum ignition temperature."},{"k":"Reference","r":"Reference 75 (continued 8)","p":115,"t":"CAD Chemical Agents Directive 98/24/EC."},{"k":"Reference","r":"Reference 75 (continued 9)","p":115,"t":"CDG Carriage of Dangerous Goods and Use of Transportable Pressure Equipment Regulations 2009."},{"k":"Reference","r":"Reference 75 (continued 10)","p":115,"t":"CHIP Chemicals (Hazard Information and Packaging for Supply) Regulations 2009."},{"k":"Reference","r":"Reference 75 (continued 11)","p":115,"t":"CLP European Classification, Labelling and Packaging of Substances and Mixtures Regulation 2008."},{"k":"Reference","r":"Reference 75 (continued 12)","p":115,"t":"COMAH Control of Major Accident Hazards Regulations 1999."},{"k":"Reference","r":"Reference 75 (continued 13)","p":115,"t":"combustible capable of burning in air when ignited."},{"k":"Reference","r":"Reference 75 (continued 14)","p":115,"t":"control steps taken or provisions put in place to reduce the likelihood of a fire, explosion, or similar event happening."},{"k":"Reference","r":"Reference 75 (continued 15)","p":115,"t":"COSHH Control of Substances Hazardous to Health Regulations 2002."},{"k":"Reference","r":"Reference 75 (continued 16)","p":115,"t":"DSEAR the Dangerous Substances and Explosive Atmospheres Regulations 2002."},{"k":"Reference","r":"Reference 75 (continued 17)","p":115,"t":"EEA European Economic Area."},{"k":"Reference","r":"Reference 75 (continued 18)","p":115,"t":"EHSRs essential heath and safety requirements (as set out in EU requirements such as the EPS Regulations)."},{"k":"Reference","r":"Reference 75 (continued 19)","p":116,"t":"enforcing authority the authority with responsibility for enforcing the HSW Act and other relevant statutory provisions."},{"k":"Reference","r":"Reference 75 (continued 20)","p":116,"t":"EPS Equipment and Protective Systems for use in Potentially Explosive Atmospheres Regulations 1996 implementing Directive 94/9/EC of the European Parliament."},{"k":"Reference","r":"Reference 75 (continued 21)","p":116,"t":"flame arrester a device consisting of an element, a housing and associated fittings which is constructed and used to prevent the passage of flame."},{"k":"Reference","r":"Reference 75 (continued 22)","p":116,"t":"flammable capable of burning with a flame"},{"k":"Reference","r":"Reference 75 (continued 23)","p":116,"t":"flammable liquid for the purpose of this book, flammable liquid means a liquid with a flashpoint of 60 °C or below and stored at a near atmospheric pressure."},{"k":"Reference","r":"Reference 75 (continued 24)","p":116,"t":"flashpoint the minimum temperature at which a liquid, under specific test conditions, gives off sufficient flammable vapour to ignite momentarily on the application of an ignition source."},{"k":"Reference","r":"Reference 75 (continued 25)","p":116,"t":"fire resistance the ability of a material, product, assembly or structure to fulfil, for a stated period of time, the required stability against the passage of flame and hot gases, and if additionally specified, thermal insulation and/or load-bearing capacity in a standard fire resistance test."},{"k":"Reference","r":"Reference 75 (continued 26)","p":116,"t":"fire-resisting ability to fulfil, for a stated period of time, the required stability, fire integrity and/or thermal insulation, where appropriate, in a standard fire resistance test."},{"k":"Reference","r":"Reference 75 (continued 27)","p":116,"t":"fire wall an imperforate wall, screen or partition capable of affording at least 30 minutes fire resistance, if tested in accordance with the appropriate standard against the passage of flame or heat."},{"k":"Reference","r":"Reference 75 (continued 28)","p":116,"t":"hazard something that could cause harm to people."},{"k":"Reference","r":"Reference 75 (continued 29)","p":116,"t":"hazardous area an area where flammable or explosive gas, or vapour–air mixtures (often referred to as explosive gas–air mixtures) are, or may be expected to be, present in quantities which require special precautions to be taken against the risk of ignition."},{"k":"Reference","r":"Reference 75 (continued 30)","p":116,"t":"hot work this includes welding or the use of any equipment likely to cause flame, sparks or heat."},{"k":"Reference","r":"Reference 75 (continued 31)","p":116,"t":"HSW Act Health and Safety At Work etc Act 1974."},{"k":"Reference","r":"Reference 75 (continued 32)","p":116,"t":"incendive having sufficient energy to ignite a flammable mixture."},{"k":"Reference","r":"Reference 75 (continued 33)","p":116,"t":"inert incapable of supporting combustion; to render incapable of supporting combustion."},{"k":"Reference","r":"Reference 75 (continued 34)","p":116,"t":"LEV local exhaust ventilation."},{"k":"Reference","r":"Reference 75 (continued 35)","p":116,"t":"lower explosion limit (LEL) the minimum concentration of vapour in air below which propagation of a flame will not occur in the presence of an ignition source. Also referred to as the lower flammable limit or lower explosive limit."},{"k":"Reference","r":"Reference 75 (continued 36)","p":117,"t":"LPG Liquefied Petroleum Gas."},{"k":"Reference","r":"Reference 75 (continued 37)","p":117,"t":"Management Regulations Management of Health and Safety at Work Regulations 1999."},{"k":"Reference","r":"Reference 75 (continued 38)","p":117,"t":"MEV mechanical extract or exhaust ventilation."},{"k":"Reference","r":"Reference 75 (continued 39)","p":117,"t":"mitigation the steps taken to minimise the consequences during and after the occurrence of a fire, explosion or similar event."},{"k":"Reference","r":"Reference 75 (continued 40)","p":117,"t":"NRW Natural Resources Wales."},{"k":"Reference","r":"Reference 75 (continued 41)","p":117,"t":"ONR Office for Nuclear Regulation."},{"k":"Reference","r":"Reference 75 (continued 42)","p":117,"t":"permit-to-work a document issued by an authorised person to permit work to be carried out safely in a defined area under specified conditions."},{"k":"Reference","r":"Reference 75 (continued 43)","p":117,"t":"PPE personal protective equipment (clothing, face protection etc)."},{"k":"Reference","r":"Reference 75 (continued 44)","p":117,"t":"PSSR Pressure Systems Safety Regulations 2000."},{"k":"Reference","r":"Reference 75 (continued 45)","p":117,"t":"PUWER the Provision and Use of Work Equipment Regulations 1992."},{"k":"Reference","r":"Reference 75 (continued 46)","p":117,"t":"REACH Registration, Evaluation, Authorisation and restriction of Chemicals Regulations EC 1907/2006."},{"k":"Reference","r":"Reference 75 (continued 47)","p":117,"t":"RID Regulations concerning the International Carriage of Dangerous Goods by Rail."},{"k":"Reference","r":"Reference 75 (continued 48)","p":117,"t":"risk the chance – however large or small – that a hazard could cause harm."},{"k":"Reference","r":"Reference 75 (continued 49)","p":117,"t":"ROSOV remotely operated shut-off valve."},{"k":"Reference","r":"Reference 75 (continued 50)","p":117,"t":"RPE respiratory protective equipment (filtering face masks)."},{"k":"Reference","r":"Reference 75 (continued 51)","p":117,"t":"SEPA Scottish Environment Protection Agency."},{"k":"Reference","r":"Reference 75 (continued 52)","p":117,"t":"SDS safety data sheet (formerly known as material safety data sheets)."},{"k":"Reference","r":"Reference 75 (continued 53)","p":117,"t":"underground tank a tank buried in the ground so that no part of the tank is above ground except for fittings attached to the tank."},{"k":"Reference","r":"Reference 75 (continued 54)","p":117,"t":"upper explosion limit the maximum concentration of vapour in air above which the propagation of a flame will not occur. Also referred to as the upper flammable limit or the upper explosion limit."},{"k":"Reference","r":"Reference 75 (continued 55)","p":117,"t":"vapour the gaseous phase released by evaporation from a material that is a liquid at normal temperatures and pressure."},{"k":"Reference","r":"Reference 75 (continued 56)","p":117,"t":"zone the classified part of a hazardous area, representing the probability of a flammable vapour (or gas) and air mixture being present."},{"k":"Reference","r":"Reference 75 (continued 57)","p":118,"t":"Further information For information about health and safety, or to report inconsistencies or inaccuracies in this guidance, visit www.hse.gov.uk/. You can view HSE guidance online and order priced publications from the website. HSE priced publications are also available from bookshops."},{"k":"Reference","r":"Reference 75 (continued 58)","p":118,"t":"British Standards can be obtained in PDF or hard copy formats from BSI: http://shop.bsigroup.com or by contacting BSI Customer Services for hard copies only Tel: 0845 086 9001 email: cservices@bsigroup.com.","h":"This ACOP is available online at: www.hse.gov.uk/pubns/books/l138.htm"},{"k":"Reference","r":"Reference 75 (continued 59)","p":118,"t":"The Stationery Office publications are available from The Stationery Office, PO Box 29, Norwich NR3 1GN Tel: 0870 600 5522 Fax: 0870 600 5533 email: customer.services@tso.co.uk Website: www.tsoshop.co.uk. (They are also available from bookshops.) Statutory Instruments can be viewed free of charge at www.legislation.gov.uk where you can also search for changes to legislation."}];

function normalise(raw) {
  return raw.replace(/[\u2013\u2014\u2212]/g, "-").replace(/\u00b0/g, "°").replace(/[,;]/g, " ").replace(/\s+/g, " ").trim();
}

// Join tokens that belong together: op is, T125 °C, and ambient ranges.
function tokenise(s) {
  const raw = s.split(" ").filter(Boolean);
  const out = [];
  for (let i = 0; i < raw.length; i++) {
    const t = raw[i];
    const prev = out.length ? out[out.length - 1] : "";
    // optical two word codes
    if (t.toLowerCase() === "op" && i + 1 < raw.length && ["is", "pr", "sh"].indexOf(raw[i + 1].toLowerCase()) >= 0) {
      out.push("op " + raw[i + 1].toLowerCase());
      i++;
      continue;
    }
    // IECEx certificate references are written with spaces, for example
    // IECEx BAS 14.0056U. Join them so the X or U suffix is not lost.
    if (/^IECEx$/i.test(t) && i + 2 < raw.length && /^[A-Za-z]{2,6}$/.test(raw[i + 1]) && /^\d{2}\.\d{3,5}[XUxu]?$/.test(raw[i + 2])) {
      out.push(t + " " + raw[i + 1] + " " + raw[i + 2]);
      i += 2;
      continue;
    }
    // a stray degree symbol or unit glued to the previous temperature value
    if (/^°?C$|^°$/.test(t) && /^T\d/.test(prev)) {
      out[out.length - 1] = prev + t;
      continue;
    }
    // ambient range continuation, for example: Ta -20 °C to +60 °C
    if (/^Tamb/i.test(prev) || prev === "Ta" || /^(Tamb|Ta) /i.test(prev)) {
      if (/^[-+±]?\d+\s?°?C?$/.test(t) || /^(to|and|\.\.\.|\u2264|<=|=)$/i.test(t) || /^°?C$/.test(t)) {
        out[out.length - 1] = prev + " " + t;
        continue;
      }
    }
    out.push(t);
  }
  return out;
}
