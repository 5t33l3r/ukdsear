ve rise to an explosive atmosphere (eg rubbers or plastics); and (v) any substance that can decompose under the conditions of the hot work to give rise to hazardous heat or pressure effects (eg dinitrotoluene or sodium hydrosulphite or residues and by-products from reactions and other similar processes); (c) potential heat or ignition sources that may arise during the proposed activity; (d) how and where explosive atmospheres can arise; (e) the consequences of a fire or explosion during the activity; (f) the basis of safety during the proposed activity; (g) the training and level of competence required by the operatives; (h) what additional protective and emergency equipment is required; and (i) what systems of work will be needed to implement the necessary control measures during the proposed activity.","sub":115},{"k":"Guidance","r":"Paragraph 116","p":32,"t":"116 When considering the risk from cleaning activities, as with any other activity, the employer should consider the type of substance that is needed and avoid the use of dangerous substances so far as reasonably practicable.","h":"Cleaning","sub":116},{"k":"Guidance","r":"Paragraph 117","p":32,"t":"117 If a dangerous substance needs to be used for cleaning, then the risk of it generating a hazardous area and the presence of potential ignition sources needs to be considered.","sub":117},{"k":"Guidance","r":"Paragraph 118","p":32,"t":"118 Where dangerous substances are introduced into plant or equipment for cleaning purposes employers should assess any additional hazards, including considering their compatibility/reactivity with other dangerous substances present.","sub":118},{"k":"ACOP","r":"Paragraph 119","p":32,"t":"119 Assess how the current measures, along with those to be taken, will impact on the risk and safeguard employees and others who may be affected by an incident involving the dangerous substance. In carrying out this assessment, the employer should follow the hierarchy required by these Regulations and consider in order: (a) the effect of the measures aimed at preventing an incident; (b) the effect of the control measures aimed at preventing its escalation; and (c) the effect of the mitigation measures to limit the effects of an incident, including the procedures to deal with accidents, incidents and emergencies.","h":"The effect of measures already in place or which will be taken as a result of DSEAR","sub":119},{"k":"ACOP","r":"Paragraph 120","p":32,"t":"120 When considering what measures are reasonably practicable to address hazards arising from the presence of dangerous substances, and when assessing design of plant, equipment and workplaces, all relevant factors should be taken into account including: (a) the adequacy of separation by distance or barrier; (b) the design standards for the installation together with those for inspection and maintenance; (c) protection from unauthorised access; (d) adequate distance from potential ignition sources so that any gas or vapour from any dangerous substance will have dispersed sufficiently to be rendered non-flammable before reaching these; (e) protection of the storage or process area from fires occurring elsewhere including the spread of fires or explosions through interconnected plant and equipment and to other parts of the premises; (f) ensuring thermal radiation effects from fires in the locality do not threaten dangerous substances; (g) avoidance and minimisation of: (i) risk of spillage; (ii) explosive atmospheres within and outside of plant and equipment; (iii) unintentional or uncontrolled chemical reactions; (iv) ignitions of dangerous substances and explosive atmospheres; (h) provision of safe access to the emergency services for firefighting and rescue; (i) minimising the number of people exposed to any potential explosion and the risk of a fire preventing or delaying the escape of individuals; (j) training and supervision of site operatives, taking into consideration incidents and emergencies. The likely presence and persistence of explosive atmospheres, and the need for hazardous area classification","sub":120},{"k":"ACOP","r":"Paragraph 121","p":33,"t":"121 As part of the risk assessment, the employer must assess whether an explosive atmosphere is likely to form and how long it is likely to remain.","sub":121},{"k":"Guidance","r":"Paragraph 122","p":33,"t":"122 Gases, vapours, mists and dusts can give rise to explosive atmospheres when dispersed in certain concentrations in air. The risk assessment carried out under regulation 5 informs the hazardous area classification and preparation of an area classification plan (required by regulation 7) and is intended to identify places where, because of the potential for an explosive atmosphere, controls over sources of ignition are required. The results of the classification or zoning are then used to control the equipment that may be used, or the work activities that may be carried out in these areas so as to prevent ignition. When considering area classification, employers should consider the likelihood of releases of an explosive atmosphere as well as the quantity of such releases.","sub":122},{"k":"Guidance","r":"Paragraph 123","p":33,"t":"123 To identify hazardous and non-hazardous areas, and then subsequently to assign zones to those areas classified as hazardous, an assessment should consider matters including: (a) the hazardous properties of the dangerous substances involved; (b) the amount of dangerous substances involved; (c) the work processes, and their interactions, including any cleaning, repair or maintenance activities; (d) the temperatures and pressures at which the dangerous substances will be handled; (e) the containment system and controls provided to prevent liquids, gases, vapours or dusts escaping into the general atmosphere of the workplace; (f) any explosive atmosphere formed within an enclosed plant or storage vessel; and (g) any measures provided to ensure that any explosive atmosphere does not persist for an extended time, eg ventilation.","sub":123},{"k":"Guidance","r":"Paragraph 124","p":33,"t":"124 When special precautions are required, eg to allow short-term maintenance or repair, there is no requirement to draw up a revised area classification plan but there is still a requirement to take a proportionate approach to risk assess the short-term conditions.","sub":124},{"k":"Guidance","r":"Paragraph 125","p":33,"t":"125 Some potential sources of release may be so small that it is not necessary to specify a zoned area (see regulation 7 for guidance on hazardous area classification). This will be the case if the consequence of an ignition following a release is unlikely to cause danger to people in the vicinity. For example, if a dangerous substance is being carried through a seamless pipe, and that pipe has been properly installed and maintained, it is extremely unlikely that the substance will be released – so an explosive atmosphere would not be expected to occur from this source and the area surrounding the pipe would not be considered as hazardous.","sub":125},{"k":"Guidance","r":"Paragraph 126","p":34,"t":"126 However, in the wrong circumstances ignition of quite small quantities of flammable gas/vapour mixed with air can cause danger to anyone in the immediate vicinity. Where this is the case, as in a relatively confined location from which rapid escape would be difficult, area classification may be needed even where quite small quantities of a dangerous substance are present.","sub":126},{"k":"Guidance","r":"Paragraph 127","p":34,"t":"127 Likewise, dangerous substances in small pre-packaged containers for sale, display etc in retail premises would not normally require the area to be classified as hazardous. However, procedures to clean up and dispose of any spillage/release and control ignition sources in the event of such a release would be needed.","sub":127},{"k":"Guidance","r":"Paragraph 128","p":34,"t":"128 Additional information relating to the process rather than the substance should also be taken into account. Some substances do not form explosive atmospheres unless they are heated; some liquids if released under pressure will form a fine mist that can explode, eg hydraulic fluids in high-pressure lines as with gas turbines.","sub":128},{"k":"Guidance","r":"Paragraph 129","p":34,"t":"129 Taken together these factors are the starting point for hazardous area classification, and should allow for the identification of any zoned areas.","sub":129},{"k":"Guidance","r":"Paragraph 130","p":34,"t":"130 For further information on the use of signs to warn of areas where an explosive atmosphere may occur, please refer to regulation 7(3).","sub":130},{"k":"ACOP","r":"Paragraph 131","p":34,"t":"131 As part of the risk assessment for their work areas employers must identify which ignition sources, including electrostatic discharges, may arise with the potential to cause a fire, explosion, energetic chemical decomposition or similar event and should be controlled. The likelihood of any potential ignition source occurring should also be considered. Certain ignition sources may have to be present if required in the process, but employers must identify and consider all possible ignition sources in areas where dangerous substances are present.","h":"Consideration of ignition sources","sub":131},{"k":"ACOP","r":"Paragraph 132","p":34,"t":"132 As a minimum, the following forms of energy should be included when considering potential ignition sources but there may be others: (a) heat; (b) electrical; (c) mechanical; (d) chemical.","sub":132},{"k":"ACOP","r":"Paragraph 133","p":34,"t":"133 Employers should: (a) consider all sources of ignition appropriate to their work activities; (b) plan to introduce (under regulation 6) measures to prevent those ignition sources occurring where they could cause harm; (c) ensure ignition sources do not come into contact with dangerous substances or explosive atmospheres. This includes preventing mobile sources of ignition (people/equipment) moving into an area where dangerous substances are present.","sub":133},{"k":"Guidance","r":"Paragraph 134","p":34,"t":"134 Flammable substances (particularly when in the form of an explosive atmosphere) are readily ignited. An ignition source is a release of energy, often of short duration and localised, which can ignite dangerous substances in the presence of air.","sub":134},{"k":"Guidance","r":"Paragraph 135","p":35,"t":"135 The information obtained from the assessment of the hazardous properties of the substance and provided by the supplier should be considered together with the identified sources of ignition to assess how likely it is that the particular ignition source will ignite the dangerous substance present. The reference to ‘active’ in this regulation means that the potential sources present are capable of causing ignition. For static electricity, this means that a static charge is present and is capable of discharging. ‘Effective’ means that the energy of the potential source of ignition is sufficient to ignite the particular dangerous substance present. In the case of static electricity it means that the level of charge is sufficiently high to ignite the substance present.","sub":135},{"k":"Guidance","r":"Paragraph 136","p":35,"t":"136 When identifying potential ignition sources, employers must take into account the properties of the dangerous substance and the manner and state in which it is, or might foreseeably, be kept and handled. On heating, some dangerous substances could create a hazard as a result of auto-ignition, self-decomposition or an exothermic reaction. Employers should consider the effect of heat from sources such as steam pipes, heaters, flames, processing etc. Employers should also consider how the ignition of combustible materials, including packaging or rubbish, could occur and the possible escalation to involve any dangerous substances.","sub":136},{"k":"Guidance","r":"Paragraph 137","p":35,"t":"137 Many sources of ignition are easy to identify. Examples of potential ignition sources include: (a) heat energy, eg: • heating installations; • internal combustion engines; • open fire and flame; • hot surfaces; • smoking; • hot work, including welding spatter, laser or other intense radiation sources; (b) electrical energy, eg: • electrical lighting devices such as lamps; • electromagnetic radiation; • radio frequency sources; • short circuit; • electrical arc; • earth fault; • conductor fault; • lightning strike; • discharges of static electricity; • loose contact; • excessive temperature rise due to overload; • induction heating; • resistive heating; • connection to inappropriate electrical supply; (c) mechanical energy, eg: • friction (eg overheating); • ultrasonic; • impact; • grinding; • compression (including adiabatic compression and shock waves); (d) chemical energy (refer to SDS/technical information sheets or data), eg: • self-heating; • impact- and heat-sensitive materials (eg pyrophoric substances); 5 • reactions between dissimilar metals (eg thermite reaction sparks); • runaway exothermic reaction.","sub":137},{"k":"Guidance","r":"Paragraph 138","p":36,"t":"138 In considering whether controls on ignition sources are required, employers may take into account other control measures or the likely size of a fire.","sub":138},{"k":"ACOP","r":"Paragraph 139","p":36,"t":"139 Employers must consider the likely scale of a fire, explosion or other event and the potential consequences. The risk assessment should be proportionate to the risks from the quantities and nature of the dangerous substances present. The contrast between localised easily limited effects and potentially large spreading damage should be reflected in the risk assessment.","h":"Scale of the anticipated effects and extent of harm","sub":139},{"k":"Guidance","r":"Paragraph 140","p":36,"t":"140 Where there is potential for an explosion, the scale of effects and the extent of harm will depend on: (a) the substance, the amount involved and how quickly it can be consumed. Internal building configuration or obstructions will have an effect on the rate of burning; (b) the size of the potential explosive atmosphere and the magnitude of the direct and indirect forces created; (c) the amount of heat radiated; (d) how the incident could escalate and whether conditions exist or could develop to cause a further fire, explosion or similar event.","sub":140},{"k":"Guidance","r":"Paragraph 141","p":36,"t":"141 Consideration of these factors will allow an assessment of who will be affected by an accident, and to what extent, and what mitigation measures will be required. Providing the risk assessment has shown that there is little or no risk of injury to people, controls on ignition sources and mitigation measures may not be required. In these cases the basis of safety should be detailed in the risk assessment for the activity to justify the level of precautions to be taken.","sub":141},{"k":"ACOP","r":"Paragraph 139 (continued)","p":36,"t":"The need to consider places connected via openings to places in which explosive atmospheres may occur"},{"k":"ACOP","r":"Paragraph 142","p":36,"t":"142 The employer should consider the possible consequences of a potentially explosive atmosphere, or the resultant effects of any explosion, spreading through interconnected plant or entering a room, building or other enclosure where the plant is located via any openings.","sub":142},{"k":"Guidance","r":"Paragraph 143","p":36,"t":"143 The assessment should consider areas away from the source of the hazard to which an explosive atmosphere may spread, for example through ducts. Such areas should be included in the classification system for places where explosive atmospheres may occur.","sub":143},{"k":"Guidance","r":"Paragraph 144","p":36,"t":"144 For many mature activities, additional information to inform the drafting of the risk assessment may be readily available and should be used. If an employer is planning to undertake novel activities using new emerging technologies, further research may be required into their potential fire and explosion risks together with a description of steps taken to ensure those changes to their activities are adequately managed.","h":"ACOP 5 Additional information for the risk assessment","sub":144},{"k":"Guidance","r":"Paragraph 145","p":37,"t":"145 Additional information could include details of: (a) the skills, knowledge and experience of employees and their representatives; (b) the training and supervision of employees; (c) activities in adjacent areas or on adjacent premises, particularly where this could present an ignition risk; and (d) possible misuse of dangerous substances, for example, to burn waste.","sub":145},{"k":"Guidance","r":"Paragraph 146","p":37,"t":"146 If the dangerous substances present are also a risk to the health of employees and others (ie they are acutely toxic, carcinogenic etc), employers should also assess health risks as required by COSHH.","sub":146},{"k":"ACOP","r":"Paragraph 147","p":37,"t":"147 Employers should plan to review their risk assessment at regular intervals. The time between reviews depends on the nature of the risk and degree of change likely in activities. It should also be reviewed if significant changes have taken place or the employer concludes it is no longer valid and following an accident or dangerous occurrence.","h":"Reviewing and revising the risk assessment","sub":147},{"k":"ACOP","r":"Paragraph 148","p":37,"t":"148 When reviewing their risk assessment employers should take the opportunity to re-examine their control and mitigation measures. This should include considering whether it is now possible to replace the substance or process with a less dangerous one. The risk assessment should be modified if developments mean it is no longer valid. Records, where required, of significant findings should also be updated.","sub":148},{"k":"Guidance","r":"Paragraph 149","p":37,"t":"149 Employers may find it useful to note the next planned review date each time the risk assessment has been reviewed.","sub":149},{"k":"Guidance","r":"Paragraph 150","p":37,"t":"150 When making any change to processes and equipment involving dangerous substances, the employer should assess the effects of that change on the safe operating conditions already established. For most significant changes, it will be obvious that there are consequences for safety and that a reassessment is necessary but relatively minor changes can also lead to unsafe working conditions. For example, changing the supplier of a coating material that is applied to objects and then dried in a heated oven might be overlooked as requiring a reassessment. The new raw material, while providing the same colour effect may contain a different or higher level of solvent. This could alter the amount of vapours released into the oven raising the concentration from below the LEL to within the explosive range creating a hazardous situation.","sub":150},{"k":"Guidance","r":"Paragraph 151","p":37,"t":"151 Changes in the workplace which should require a risk assessment to be reviewed include: (a) changes to the substances used; (b) replacement or modification to the plant and/or equipment used; (c) changes in processes or methods of work which could affect the nature of hazards and risks; and (d) changes in the workforce – such as reductions in numbers or experience of employees involved in a work activity.","sub":151},{"k":"Guidance","r":"Paragraph 152","p":37,"t":"152 Adverse events such as accidents, dangerous occurrences or near misses should be a trigger for reviewing the original risk assessment.","sub":152},{"k":"ACOP","r":"Paragraph 153","p":38,"t":"153 Where an employer employs five or more people, they should record the significant findings of their risk assessment. This should help ensure all the necessary aspects of managing the risks are covered (highlighting any gaps and actions to remedy them). The amount of information recorded should be proportionate to the level of risks present in the workplace.","h":"Recording the significant findings of the risk assessment","sub":153},{"k":"ACOP","r":"Paragraph 154","p":38,"t":"154 The recorded risk assessment should follow regulation 5(4) and: (a) describe the relevant workplace activity; (b) identify the dangerous substances in the workplace and the risks they present; (c) identify how risks arise including heat effects on the substances and how all risks impact on those affected; (d) record additional information where an explosive atmosphere may occur; (e) take into account the effects of all measures, including those under DSEAR which have been or will be taken to eliminate or control risks. This includes: (i) zoning and hazardous area classification; (ii) equipment used; (iii) co-ordination between employers; (iv) verification of overall explosion safety by a competent person as required by regulation 7(4).","sub":154},{"k":"ACOP","r":"Paragraph 155","p":38,"t":"155 Where the DSEAR risk assessment is integrated into an overall assessment, it can be recorded as part of that assessment.","sub":155},{"k":"ACOP","r":"Paragraph 156","p":38,"t":"156 The risk assessment should be completed and recorded as soon as practicable after the assessment is made, and should be stored on media that is readily accessible. If the risk assessment record cannot be completed for any reason, then a precautionary approach should be taken to ensure employee safety, and a clear timescale for the completion of the assessment documented.","sub":156},{"k":"ACOP","r":"Paragraph 157","p":38,"t":"157 For risks which are more significant, for example on complex sites or installations, the risk assessment may summarise measures described more fully in other referenced documents. The risk assessment should adequately outline the content of the other references and these reference documents should be readily available on site.","sub":157},{"k":"Guidance","r":"Paragraph 158","p":38,"t":"158 All employers must carry out a risk assessment, but a record of the significant findings is only required where they employ five or more people. Although employers with fewer than five employees are exempt from this requirement, they may still find it useful to record the significant findings of their assessment, including preventive measures taken to control risk in accordance with these Regulations. A chemical works would be expected to carry out, for example, detailed hazard and operability studies, whereas a small retail outlet selling a few aerosol cans would be expected to record much less information.","sub":158},{"k":"Guidance","r":"Paragraph 159","p":38,"t":"159 The record should provide a description of the hazards and risks from dangerous substances which lead employers to take the relevant actions to protect safety. Where appropriate it should be linked to other health and safety records or documents describing procedures and safeguards, particularly the record of risk assessment made under the Management Regulations (see Appendix 2), COSHH, and the written health and safety policy statement required by section 2(3) of the HSW Act. It may be possible to combine these documents into one health and safety management document. It should be readily retrievable for use by management in reviews, for safety representatives or other employee representatives, and for visiting inspectors. You may find it helpful to have a system of document version control in place.","sub":159},{"k":"Guidance","r":"Paragraph 160","p":39,"t":"160 The amount of information that should be recorded depends on the level of risk present in the workplace. In cases where a dangerous substance poses little or no risk, it may only be necessary for employers to record: (a) the identity of the dangerous substances present and the risks they present; (b) the measures taken under DSEAR; and (c) if appropriate, because of the safeguards taken, an explanatory statement that a further detailed assessment is unnecessary.","sub":160},{"k":"Guidance","r":"Paragraph 161","p":39,"t":"161 However, where dangerous substances in the workplace present a greater risk, the assessment record should be more comprehensive. It should include: (a) the preventive measures in place to control the risks, including those required by regulation 6 (this can include reference to measures described more fully in other documents); (b) enough information to demonstrate that the workplace and work processes are designed, operated and maintained with due regard to safety; (c) information showing that adequate arrangements have been made for the safe use of work equipment, in accordance with the Provision and Use of Work Equipment Regulations 1998 (SI 1998/2303) (PUWER) (see Appendix 2).","sub":161},{"k":"Guidance","r":"Paragraph 162","p":39,"t":"162 For the workplace the record should show, for example, that its design allows for a process to be carried out safely, such as by the provision of a storage area for dangerous substances, or to allow sufficient space to segregate incompatible substances.","sub":162},{"k":"Guidance","r":"Paragraph 163","p":39,"t":"163 For work equipment, the record should show that equipment is suitable for work with the dangerous substance(s) involved.","sub":163},{"k":"ACOP","r":"Paragraph 164","p":39,"t":"164 EPS applies to devices, controlling devices and regulating devices contributing to or required for the safe functioning of equipment or protective systems within a potentially explosive atmosphere. It applies whether or not they are intended for use inside or outside that atmosphere and such devices and equipment should be identified and their details, purpose and maintenance arrangements should be recorded.","h":"Information to be recorded when an explosive atmosphere may occur","sub":164},{"k":"Guidance","r":"Paragraph 165","p":39,"t":"165 Equipment intended for use in an explosive atmosphere can be shown to be suitable by reference to the classification of hazardous places into zones under regulation 7(1), and evidence of the selection of a suitable category of equipment in accordance with the manufacturer’s or supplier’s instructions.","sub":165},{"k":"Guidance","r":"Paragraph 166","p":39,"t":"166 For safety and economic reasons, it will often be preferable to install such devices in a non-hazardous area where possible. Examples include: (a) a pump, pressure regulating device, backup storage device etc ensuring sufficient pressure and flow for feeding a hydraulically actuated safety system within the potentially explosive atmosphere; (b) a remote controller unit connected to sensors within the potentially explosive atmosphere, eg measuring temperature, pressure, flow, gas concentration etc, which is designed to provide executive actions on one or more items of equipment or protective systems within the potentially explosive atmosphere.","sub":166},{"k":"Guidance","r":"Paragraph 167","p":40,"t":"167 EPS does not apply to devices (including safety, controlling and regulating devices) that do not contribute to, nor are required for, the safe functioning of equipment or protective systems within a potentially explosive atmosphere. Examples of these devices include gas detection systems providing an alarm signal and initiation of action outside the hazardous area (such as operation of an emergency ventilation system) and water spray systems designed to protect plant from fire. In this case, record sufficient information to demonstrate that the design, operation and maintenance of the device will provide the safety function required.","sub":167},{"k":"ACOP","r":"Paragraph 168","p":40,"t":"168 Where there are two or more employers at a workplace where an explosive atmosphere may occur, the risk assessment must detail the clear agreement between those employers so that the aims and requirements of regulation 11 (duty of co-ordination) have been met.","h":"Records concerning co-ordination","sub":168},{"k":"Guidance","r":"Paragraph 169","p":40,"t":"169 Regulation 5(4)(c)(iv) requires that the record should explain the purpose of the co-ordination measures required by regulation 11. For example, the aim could be to alert employees of another employer to the presence of hazardous substances or places, or to facilitate emergency arrangements in the event of an accident.","sub":169},{"k":"Guidance","r":"Paragraph 170","p":40,"t":"170 The record should also show the arrangements the employer has in place to achieve the aims. This is likely to require reference, for example, to instructions given to other employers or their employees. It will also include information for contractors when they first start on site, including a specification of the work to be done and arrangements for supervision, and handover procedures for particular items of plant or parts of the premises.","sub":170},{"k":"Guidance","r":"Paragraph 171","p":40,"t":"171 The duty extends only to the potential for one employer to create a flammable atmosphere which could affect another employer’s staff and matters flowing from that risk. The practicalities of implementation of the arrangements are dealt with under regulation 11.","sub":171},{"k":"ACOP","r":"Paragraph 172","p":40,"t":"172 A risk assessment must be undertaken before any new work activity involving dangerous substances begins. This includes risks that may arise from handling, storage, plant and equipment modification, treatment and disposal of dangerous waste and by-products.","h":"Risk assessment of new work activity","sub":172},{"k":"ACOP","r":"Paragraph 173","p":40,"t":"173 For a new work activity, the employer should record the significant findings of","sub":173},{"k":"Guidance","r":"Paragraph 171 (continued)","p":40,"t":"the risk assessment as soon as is practicable after the assessment is made. In some circumstances, further information may be needed before the significant findings can be resolved and fully recorded. Examples of such situations include: (a) in a research/development process setting or during a crisis with dynamic changes to events and reaction; (b) situations where product formed is not as expected or predicted; (c) delivered reagents are not what they were supposed to be or contain impurities that affect the reaction; or (d) in circumstances where there is a pilot operation which must be run for a period before being assessed completely."},{"k":"Guidance","r":"Paragraph 174","p":41,"t":"174 The employer should update the findings as soon as the information becomes available. In the meantime the employer should adopt a precautionary approach, taking additional steps to safeguard employees. Regulation 6 Elimination or reduction of risks from dangerous substances Summary of regulation 6 Regulation 6 sets out how to eliminate or reduce risk to people’s safety from the presence of dangerous substances by removing or controlling risks, and by providing measures to limit or mitigate the consequences for people, should an incident occur. A hierarchy of control measures is set out in regulation 6(4) and the measures required to reduce the effects of an incident are listed in regulation 6(5). The employer has a duty to provide and to maintain the measures. The measures in Schedule 1 are an integral part of regulation 6 and for this reason the Schedule has been incorporated within this section.","sub":174},{"k":"Law","r":"Regulation 6(1)","p":41,"t":"(1) Every employer shall ensure that risk is either eliminated or reduced so far as is reasonably practicable."},{"k":"Law","r":"Regulation 6(2)","p":41,"t":"(2) In complying with his duty under paragraph (1), substitution shall by preference be undertaken, whereby the employer shall avoid, so far as is reasonably practicable, the presence or use of a dangerous substance at the workplace by replacing it with a substance or process which either eliminates or reduces the risk."},{"k":"Law","r":"Regulation 6(3)","p":41,"t":"(3) Where it is not reasonably practicable to eliminate risk pursuant to paragraphs (1) and (2), the employer shall, so far as is reasonably practicable, apply measures, consistent with the risk assessment and appropriate to the nature of the activity or operation – (a) to control risks, including the measures specified in paragraph (4); and (b) to mitigate the detrimental effects of a fire or explosion or the other harmful physical effects arising from dangerous substances, including the measures specified in paragraph (5)."},{"k":"Law","r":"Regulation 6(4)","p":41,"t":"(4) The following measures are, in order of priority, those specified for the purposes of paragraph (3)(a) – (a) the reduction of the quantity of dangerous substances to a minimum; (b) the avoidance or minimising of the release of a dangerous substance; (c) the control of the release of a dangerous substance at source; (d) the prevention of the formation of an explosive atmosphere, including the application of appropriate ventilation; (e) ensuring that any release of a dangerous substance which may give rise to risk is suitably collected, safely contained, removed to a safe place, or otherwise rendered safe, as appropriate; (f) the avoidance of – (i) ignition sources including electrostatic discharges; and (ii) adverse conditions which could cause dangerous substances to give rise to harmful physical effects; and (g) the segregation of incompatible dangerous substances."},{"k":"Law","r":"Regulation 6(5)","p":42,"t":"(5) The following measures are those specified for the purposes of paragraph (3)(b) – (a) the reduction to a minimum of the number of employees exposed; (b) the avoidance of the propagation of fires or explosions; (c) the provision of explosion pressure relief arrangements; (d) the provision of explosion suppression equipment; (e) the provision of plant which is constructed so as to withstand the pressure likely to be produced by an explosion; and (f) the provision of suitable personal protective equipment."},{"k":"Law","r":"Regulation 6(6)","p":42,"t":"(6) The employer shall arrange for the safe handling, storage and transport of dangerous substances and waste containing dangerous substances."},{"k":"Law","r":"Regulation 6(7)","p":42,"t":"(7) The employer shall ensure that any conditions necessary pursuant to these Regulations for ensuring the elimination or reduction of risk are maintained."},{"k":"Law","r":"Regulation 6(8)","p":42,"t":"(8) The employer shall, so far as is reasonably practicable, take the general safety measures specified in Schedule 1, subject to those measures being consistent with the risk assessment and appropriate to the nature of the activity or operation."},{"k":"ACOP","r":"Paragraph 175","p":42,"t":"175 Where it is necessary to work with dangerous substances, employers are not expected to eliminate all risk but to reduce risks and to implement measures to control the remaining risks and mitigate the consequences of any fire or explosion or other harmful physical event that could foreseeably arise so far as reasonably practicable.","h":"Overall approach","sub":175},{"k":"ACOP","r":"Paragraph 176","p":42,"t":"176 Employers should first consider eliminating the risk if a suitable non- harmful (or, failing that, a less harmful) substitute for the dangerous substance is feasible or if a safer process exists. All aspects of the properties of the proposed substitute must be considered when substituting a dangerous substance, and the risks balanced against all the overall risks, not just its flammability or explosion properties.","h":"Substitution","sub":176},{"k":"ACOP","r":"Paragraph 177","p":42,"t":"177 A substance that is less flammable may not be a suitable alternative if it were of higher toxicity or more harmful to the environment than the original substance.","sub":177},{"k":"ACOP","r":"Paragraph 178","p":42,"t":"178 Having considered whether risk can be eliminated, eg by substitution, the employer should next give consideration to risk control measures before finally considering mitigation measures. Regulations 6(3) and 6(4) should be considered together when selecting control measures. The measures specified in regulation 6(4) should be applied subject to reasonable practicability and the information from the risk assessment. The measures should be applied in the order of priority set out in regulation 6(4). The list of measures is not exhaustive. There might be other effective and appropriate measures.","h":"Control and mitigation measures","sub":178},{"k":"ACOP","r":"Paragraph 179","p":43,"t":"179 If the measures set out in regulation 6(4) or other measures devised by the employer do not adequately address the risk, employers should then, so far as reasonably practicable, consider the application of the mitigation measures as set out in regulation 6(5). Regulation 6(5)(f) must be a measure of last resort.","sub":179},{"k":"ACOP","r":"Paragraph 180","p":43,"t":"180 Only the minimum amount of dangerous substances needed for the work activity should be kept in process areas, workrooms, laboratories and similar working areas. Dangerous substances that are not in use should be returned to the designated storage area. For dangerous substances in closed containers at retail premises, the quantity stored at point of sale must be kept to a minimum consistent with the needs of the business.","h":"Reduce the amount of dangerous substance to a minimum","sub":180},{"k":"Guidance","r":"Paragraph 181","p":43,"t":"181 The extent of harmful effect from fires or explosions is directly related to the quantity of dangerous substance involved. Employers should ensure their work procedures, including the selection and design of plant, are consistent with minimising the quantity of dangerous substances present in process areas, workrooms, laboratories and similar working areas. Employers should especially consider the risks posed by transfer operations involving dangerous substances and preference should be given to piped and enclosed delivery and export systems to minimise the quantity of dangerous substance in these process areas etc. Where the dangerous substance is necessarily present as feedstock and/or product, this should be the minimum necessary for the production activity and, as a guide, should not exceed that required for use or produced during half a day or one shift.","sub":181},{"k":"Guidance","r":"Paragraph 182","p":43,"t":"182 Employers should use plant and equipment with the smallest capacity consistent with operational needs. Replacing a batch process with a semi-batch process, or process intensification would result in a reduced inventory of dangerous substances. Storage of flammable liquids in process areas, workrooms, laboratories and similar working areas","sub":182},{"k":"Guidance","r":"Paragraph 183","p":43,"t":"183 Many work activities will require the convenient availability of flammable liquids and/or flammable liquid-based products. To facilitate this, a limited quantity in suitable closed vessels may be stored in suitable cabinets or bins of fire-resisting construction and which are designed to retain spills (capacity should be 110% volume of the largest vessel normally stored in it).","sub":183},{"k":"Guidance","r":"Paragraph 184","p":43,"t":"184 These should be located in designated well-ventilated areas that are: (a) away from the immediate processing area where possible; and (b) do not jeopardise the means of escape from process and other areas.","sub":184},{"k":"Guidance","r":"Paragraph 185","p":43,"t":"185 The flammable liquids should be stored separately from other dangerous substances that may increase the risk of fire or compromise the integrity of the container or cabinet/bin, such as energetic substances, oxidizers and corrosive materials. Sometimes these other dangerous substances may be flammable liquids in their own right or held in a flammable liquid. However, it is still inappropriate to store these in the same cabinets or bins with other flammable liquids.","sub":185},{"k":"Guidance","r":"Paragraph 186","p":43,"t":"186 The recommended maximum quantities that may be stored in cabinets and bins are as follows: (a) no more than 50 litres for extremely, highly flammable and those flammable liquids with a flashpoint below the maximum ambient temperature of the workroom/working area; (b) no more than 250 litres for other flammable liquids with a higher flashpoint of up to 60 °C.","sub":186},{"k":"Guidance","r":"Paragraph 187","p":44,"t":"187 These quantities are intended to be viewed as recommended maxima representing industry safe practice, rather than absolute limits. There is some flexibility, where for example the design of modern buildings and the pattern of work can make it difficult to work within these limits, eg in large or open-plan workrooms/ working areas. Where the employer proposes to store quantities in excess of the recommended maxima, a robust justification should be recorded and the risk assessment should take into account: (a) the properties of the materials to be stored or handled in the process areas, workrooms, laboratories and similar working areas (for mixed storage the worst-case situation should be applied, ie all materials in the storage cupboard or bin should be considered as being the same material as the one that has the lowest flashpoint); (b) the size of the process area etc and the number of people working in it; (c) the amount of flammable liquids being handled in the process area etc and the quantities of liquid that may be accidentally released or spilled; (d) ignition sources in the process area etc and potential fire spread in the event of an ignition: (e) exhaust ventilation provision to the process area etc and/or the storage cupboard or bin; (f) the fire-resisting performance of the storage cupboard or bin; (g) the arrangements for closing the cupboard or bin doors/lid in the event of a fire; (h) means of escape from the process area etc.","sub":187},{"k":"Guidance","r":"Paragraph 188","p":44,"t":"188 The objective, in the event of an incident, is to ensure that people can safely escape from process and other areas. The purpose of storing dangerous substances in cupboards and bins of appropriate construction and design is to provide a physical barrier to defer their involvement in a fire. If the dangerous substances become involved, limiting the passage of fire and hot gas should allow sufficient time for safe evacuation and for the implementation of the employer’s immediate emergency procedures.","sub":188},{"k":"Guidance","r":"Paragraph 189","p":44,"t":"189 Paragraphs 196–199, together with Appendices 4 and 5, detail the performance requirements for fire-resisting cupboards and bins. These do not specify an absolute test or standard for the cupboard or bin itself, rather they relate to nominal construction principles. Namely that: (a) the materials used to form the sides, top, bottom, door(s) and lid are capable of providing the required fire resistance (ie 30 minutes’ integrity) and reaction to fire (ie minimal risk); (b) the joints between the sides, top and bottom of cupboards and bins should be free from openings or gaps; (c) the lid/doors should be close-fitting against the frame of the bin/cupboard such that there is a nominal overlap between the frame and lid/doors in their closed position; (d) the supports and fastenings should be of a material with a melting point greater than 750 °C.","sub":189},{"k":"Guidance","r":"Paragraph 190","p":44,"t":"190 These criteria are the minimum performance requirements for compliance with current legislation. However, there are a number of more demanding standards and design specifications, which refer to the fire performance of the complete cabinet structure, including: BS EN 14470-1 Fire safety storage cabinets. Safety storage cabinets for flammable liquids,16 Factory Mutual, Underwriters Laboratories and ANSI/NFPA 30 standards.17 Where standards go beyond the minimum requirements of UK health and safety legislation, it should be emphasised that their implementation in the UK is not a legal requirement. However, for quantities in excess of the recommended maxima, employers/dutyholders may find the use of cabinets with enhanced fire performance can help them demonstrate that the measures they are taking are sufficient to reduce the risks so far as reasonably practicable.","sub":190},{"k":"Guidance","r":"Paragraph 191","p":45,"t":"191 It is the responsibility of the employer/dutyholder to ensure that cabinets to any particular standard or design specification meet the minimum legal requirements. Equally, the use of cabinets with enhanced fire performance should not be seen as a substitute for providing dedicated store rooms and outdoor storage areas for the safe keeping of containers which are nominally empty or are not needed for current work. Storage and use of compressed and liquefied flammable gas cylinders, oxygen and oxidising gas cylinders in process areas, workrooms, laboratories etc","sub":191},{"k":"Guidance","r":"Paragraph 192","p":45,"t":"192 In general, gas cylinders and cartridges should be kept below 50 °C as there is an increased risk of over-pressurisation and gas discharge or rupture in the event of them being subject to elevated temperatures. For example, this is a risk in the event of a fire in a building containing gas cylinders, even if the cylinders are remote from the source of the fire. The employer should therefore minimise the number of gas cylinders kept indoors. Further guidance on this is below.","sub":192},{"k":"Guidance","r":"Paragraph 193","p":45,"t":"193 Ordinarily gas cylinders containing dangerous substances should not be kept in process areas etc. An exception is for gas cylinders connected to portable appliances, but the number should be limited to the minimum necessary for operational requirements. Where the appliance is fixed, the gas cylinders should normally be sited in a safe location outdoors and the gas piped indoors to the appliance. Gas cylinders that are not in use (ie not connected to an appliance) should be stored in safe, secure uncongested locations in the open air that provide ready dispersal of any released gas, and prevent accumulations or entry of gas into any enclosed area. Nominally empty cylinders should also be stored in safe location outdoors to separate them from gas cylinders in use (ie connected to an appliance).","sub":193},{"k":"Guidance","r":"Paragraph 194","p":45,"t":"194 Exceptionally, gas cylinders may be stored indoors where there is a specific safety, security or process quality consideration. For example, for toxic or ultra- high-purity gases needed in the electronics industry, where gases have to be temperature controlled for process reasons, or where there is potential risk of deterioration/corrosion of the cylinder/cartridge, then the gas cylinders may be stored indoors. The amounts kept should be minimised and the gas cylinders should be housed/stored in a dedicated, well-ventilated, secure storeroom or cabinet/cupboard of adequate fire-resisting construction (see regulation 6(5)(b)).","sub":194},{"k":"Guidance","r":"Paragraph 195","p":45,"t":"195 Where the number of gas cylinders required indoors is so few that a dedicated storeroom is not justified, a dedicated cabinet/cupboard of adequate fire- resisting construction should be used. The same storeroom/cabinet/cupboard should not be used for both stored gas cylinders and those nominally in use (connected to an appliance). Nor should it be used to store other incompatible substances or materials that pose a risk to the cylinders.","sub":195},{"k":"Guidance","r":"Paragraph 196","p":45,"t":"196 Fire resistance is discussed at the section ‘Physical barriers of fire-resisting construction – design and performance requirements’ (paragraphs 266–280). Other design requirements also apply to both storerooms and cabinets/cupboards in which gas cylinders are kept, including the provision of adequate ventilation to the outside (see regulation 6(4)(d)) and the provision of appropriate measures to mitigate the effects of any potential explosion (see regulation 6(5)(c)). Where the risk assessment and/or regulation 10 of DSEAR or advice from emergency services indicates that adequate signage is required to indicate compressed gas cylinders, this may be appropriate.","sub":196},{"k":"Guidance","r":"Paragraph 197","p":46,"t":"197 Further advice on the storage and keeping for use of gas cylinders and cartridges should be available from the supplier or the relevant trade association, such as the British Compressed Gas Association and UKLPG. Information on the location of such cylinders should be given to attending emergency services at the earliest appropriate opportunity.","sub":197},{"k":"Guidance","r":"Paragraph 198","p":46,"t":"198 The employer should justify the need to house/store gas cylinders and cartridges indoors and ensure that any storeroom, cabinet or cupboard provided for the purpose meets the minimum legal requirements.","sub":198},{"k":"Guidance","r":"Paragraph 199","p":46,"t":"199 A number of cabinets are commercially available that meet more demanding standards and design specifications, eg BS EN 14470-2 Fire safety storage cabinets. Safety storage cabinets for pressurised gas cylinders,18 and Factory Mutual, Underwriters Laboratories and ANSI/NFPA 3017 standards. Where standards go beyond the minimum requirements of UK health and safety legislation, it is to be emphasised that their implementation in the UK is not a legal requirement, nor should the use of such cabinets be seen as a substitute for siting gas cylinders in a safe location outdoors where it is reasonably practicable to do so.","sub":199},{"k":"ACOP","r":"Paragraph 200","p":46,"t":"200 Plant and equipment used to handle, store or produce dangerous substances should be designed to an appropriate domestic national or international standard (where available) to avoid or minimise any unintended release of dangerous substances. If there is no appropriate standard the employer should be able to show that the plant or equipment is fit for the purpose of containment during its expected life and during foreseeable normal and emergency conditions. Employers should ensure so far as reasonably practicable that: (a) work processes minimise releases by use of pipework or enclosed systems and a scheme/system is in place to ensure their contents are identifiable in accordance with regulation 10; (b) plant is corrosion and abrasion resistant, manufactured from compatible material or treated to impart resistance; (c) loading or unloading operations and facilities are designed, located and operated to minimise the risk of leaks, spills, overfilling and the inadvertent mixing of incompatible materials.","h":"Design of plant and equipment to minimise release of dangerous substances","sub":200},{"k":"ACOP","r":"Paragraph 201","p":46,"t":"201 Employers must also ensure that new pressure systems comply with the Pressure Equipment Regulations 1999 (SI 1999/2001) and existing pressure systems comply with the requirements of the Pressure Systems Safety Regulations 2000 (SI 2000/128) (PSSR).","sub":201},{"k":"Guidance","r":"Paragraph 202","p":47,"t":"202 Where any plant or equipment operates at a pressure greater than 0.5 bar above atmospheric pressure there are duties on the supplier and user under PSSR. These duties are for the user to provide any person operating the system with adequate and suitable instructions for: (a) the safe operation of the system; and (b) the action to be taken in the event of any emergency.","sub":202},{"k":"Guidance","r":"Paragraph 203","p":47,"t":"203 Detailed guidance and ACOP requirements for PSSR are available in the publication Safety of pressure systems L122.19","sub":203},{"k":"Guidance","r":"Paragraph 204","p":47,"t":"204 Dangerous substances that give rise to a significant risk of fire during handling or processing include those classified under CHIP as explosive, oxidising, extremely flammable, highly flammable and flammable.","sub":204},{"k":"Guidance","r":"Paragraph 205","p":47,"t":"205 Control rooms and other occupied buildings on sites processing or handling significant quantities of dangerous substances should be positioned or designed to provide protection from potential fires, explosions and ingress of dangerous substances. Additional guidance on protecting buildings for chemical plant is contained in the Chemical Industries Association publication Guidance for the location and design of occupied buildings on chemical manufacturing sites.20","sub":205},{"k":"Guidance","r":"Paragraph 206","p":47,"t":"206 To minimise the risk of fire arising from the release of a dangerous substance: (a) Ducts, trunks and casings should be designed and installed to: (i) minimise condensation of vapour or deposition of solids; (ii) maintain adequate velocity throughout its length with smooth inner surfaces and large-radius bends; (iii) incorporate suitable inspection and cleaning access points. (b) Plant and equipment should be designed and operated to: (i) prevent unintentional accumulation of dangerous substances and their flammable residues; (ii) avoid reaching a surface temperature that may cause residues to catch fire and ignite any explosive atmosphere that may be present.","sub":206},{"k":"Guidance","r":"Paragraph 207","p":47,"t":"207 Mitigation measures for plant and equipment processing highly flammable solids and dusts include rotary valves, explosion suppression barriers, fast-acting valves, chokes and baffles. Mitigation measures for interconnected plant and equipment processing flammable gases and vapours include flame arresters (see BS EN ISO 1685221), fast-acting valves and suppression barriers.","sub":207},{"k":"ACOP","r":"Paragraph 208","p":47,"t":"208 Where plant contains openings such as inlets and outlets, these have the potential to release dangerous substance and employers must ensure: (a) plant doors, access points or charge/discharge points are provided with interlocks, valves or systems of work to prevent or minimise release; (b) plant is fitted with isolation valves to minimise leaks after use, to control leaks during use and to enable safe isolation of the plant for maintenance; (c) where personnel would be exposed to danger when operating valves manually during an emergency, plant is fitted with remotely operated isolation/shut off valves (ROSOVs).","sub":208},{"k":"ACOP","r":"Paragraph 209","p":48,"t":"209 Elimination or minimisation of the release of dangerous substances by using closed systems or suitable processing and handling methods should be the first consideration. Employers should ensure proportionate, appropriate measures are taken to prevent the formation of hazardous explosive atmospheres or to limit their extent. Ventilation is (and should be) designed to dilute the concentration of any dangerous substances to a safe level (below that which could form an explosive atmosphere) by providing air changes through: (a) an adequate number of appropriately sized openings, for natural ventilation, on all external walls at high and low levels (where reasonably practicable); (b) mechanical extract ventilation (MEV), local exhaust ventilation (LEV) and/ or forced ventilation at process and storage areas where natural ventilation cannot achieve the required air change rate to safely disperse the dangerous substance(s). LEV should be provided for processes where there is unavoidable release of a dangerous substance; (c) any required mechanical ventilation system should be monitored for continuous operation, including a flow failure detection and alarm or other system which is suitable for the plant size and configuration. For complex areas adequate air flow should be verified by flow measurements throughout each compartment.","h":"Ventilation","sub":209},{"k":"ACOP","r":"Paragraph 210","p":48,"t":"210 Where the release of a dangerous substance could give rise to explosive atmospheres the following measures, ranked in preference order and forming a hierarchy of control, should be considered in order to dilute the concentration of foreseeable releases to a safe level: (a) location in the open air. Where weather protection is required, it should be designed to prevent the accumulation of dangerous substances; (b) adequate natural ventilation for any potential source of release inside any enclosure or building where the flow of air is liable to be restricted. The ventilation should be designed to dilute the concentration of foreseeable releases of dangerous substances to a safe level by maintaining the average concentration during normal operations to below that which could form an explosive atmosphere; (c) enclosure within a cabinet or other suitable enclosure which is constructed of fire-resisting materials and directly provided with LEV exhausting to a safe place; (d) adequate LEV, provided and positioned to prevent or minimise releases of potentially unsafe concentrations, into the work area or room; (e) adequate mechanical general ventilation to the workspace in the event that closely positioned LEV is either not reasonably practicable or is insufficient by itself to dilute concentrations of releases of dangerous substances to a safe level.","sub":210},{"k":"ACOP","r":"Paragraph 211","p":48,"t":"211 The following steps should also be taken where appropriate: (a) prevent the formation of explosive atmospheres in enclosed spaces forming part of plant, equipment or ductwork; (b) dryers, ovens, cabinets, connecting ducts, trunks and their associated ventilation casings should be fire-resisting structures; (c) safely disperse vaporising liquid leaks from fixed liquefied gas vessels away from vulnerable populations and locations.","sub":211},{"k":"Guidance","r":"Paragraph 212","p":49,"t":"212 Locating plant and storage facilities in the open air normally ensures the best possible dispersion of dangerous substances to limit the formation and extent of hazardous explosive atmospheres. Certain features may affect the ready dispersal of any releases of dangerous substances, eg buildings, pits, and structures providing weather protection. Employers should, as appropriate, ensure these features are: (a) sufficient distance away; or (b) of suitable design to prevent the accumulation of dangerous substances; and where necessary: (c) the ground should be graded to direct vapours away from occupied buildings and vulnerable populations, eg to provide safe dispersal of vapourising liquid leaks from fixed liquefied gas vessels.","h":"Ventilation: First choice – natural dispersion","sub":212},{"k":"Guidance","r":"Paragraph 213","p":49,"t":"213 Where plant and storage facilities handling dangerous substances are located indoors, the employer should ensure that ventilation is adequate to limit the formation and extent of hazardous explosive atmospheres. The greater the air flow from and to open air (natural ventilation) the better. If possible one or more solid sides to an enclosure should be removed. Ventilation should: (a) ensure there are no stagnant or poorly ventilated areas in the building, room or enclosure containing plant or stores where the dangerous substance can accumulate to form a hazardous explosive atmosphere; and (b) prevent the formation of such atmospheres in any other parts of the building.","h":"Ventilation: Second choice – indoors and ventilated from open air","sub":213},{"k":"Guidance","r":"Paragraph 214","p":49,"t":"214 When considering the design and size of the ventilation requirement the employer needs to consider the nature and location of potential leak scenarios – typically this will be in two parts: (a) the ventilation required to limit the formation and extent of hazardous explosive atmospheres that might occur during normal operations, including foreseeable deviations or excursions from normal conditions; and (b) the emergency measures required to deal with substantial leaks that might arise in the event of accident or incident (regulation 8). Regulation 6(4)(d) is specifically concerned with the ventilation requirements for normal operations and foreseeable departures from normal.","sub":214},{"k":"Guidance","r":"Paragraph 215","p":49,"t":"215 In determining the ventilation requirement, the employer should take account of the range of dangerous substances that may be present and the conditions under which all activities take place, including the temperature of the workplace.","sub":215},{"k":"Guidance","r":"Paragraph 216","p":49,"t":"216 In a workplace where combustible dusts are likely to be present, the design of the ventilation system should take into consideration any deposits that may arise. For example, dust leaks from the plant should not be allowed to build up in such quantity that, if disturbed or dispersed, they could form a hazardous explosive atmosphere.","sub":216},{"k":"Guidance","r":"Paragraph 217","p":49,"t":"217 Adequate ventilation can sometimes prevent the formation of an explosive atmosphere. The variations associated with work activities mean, however, that typical effectiveness is likely to be limited to a reduction in the likelihood (chances) of a hazardous explosive atmosphere forming and/or a reduction in the extent of the hazardous area (zones). There may be sufficient ventilation in some circumstances for the extent of the hazardous area to be treated as a zone 2 of negligible extent (zone 2NE) because a sufficiently small volume of explosive atmosphere would have insignificant over-pressure or thermal effects if it ignited. See regulation 7 and Schedule 2 for classification.","sub":217},{"k":"Guidance","r":"Paragraph 218","p":50,"t":"218 Where necessary, check that the ventilation is adequate, eg congestion or obstructions may affect the air flow. Checks may be carried out using smoke or tracer gas tests. Alternatively, where a more detailed assessment is sought, computational fluid dynamics (CFD) modelling may be used if appropriate.","sub":218},{"k":"Guidance","r":"Paragraph 219","p":50,"t":"219 Adequate ventilation is typically taken to be that which limits the average concentration to no more than 25% of the LEL within the building, room or enclosure containing the dangerous substance.","sub":219},{"k":"Guidance","r":"Paragraph 220","p":50,"t":"220 When storing dangerous substances indoors, natural ventilation provided by an adequate number of appropriately sized openings on the external walls at high and low level is usually sufficient. For buildings, the openings should be provided on opposite walls to ensure through ventilation to prevent stagnant or poorly ventilated areas. Roof ventilation openings may provide the high-level ventilation. It is acceptable for compartments and rooms to have one external wall with high- and low-level ventilation, providing stagnant or poorly ventilated areas are unlikely to occur.","sub":220},{"k":"Guidance","r":"Paragraph 221","p":50,"t":"221 Further guidance on assessing and designing for natural ventilation is available in BS 5925,22 Natural ventilation in non-domestic buildings,23 and Environmental design.24","sub":221},{"k":"Guidance","r":"Paragraph 222","p":50,"t":"222 Generic advice on the ventilation requirements for flammable liquids, compressed gases and LPG is available in The storage of flammable liquids in containers HSG51,13 Guidance for the storage of gas cylinders in the workplace GN 2,10 and Code of Practice 7 Storage of Full and Empty LPG Cylinders and Cartridges.9","sub":222},{"k":"Guidance","r":"Paragraph 223","p":50,"t":"223 If sufficient natural ventilation cannot be achieved, MEV should be provided. This should be designed to ensure the space is adequately ventilated. Ventilation openings should be correctly located in the external wall(s) of the building, room or enclosure.","h":"Ventilation: Third choice – mechanical ventilation","sub":223},{"k":"Guidance","r":"Paragraph 224","p":50,"t":"224 Process areas where releases of dangerous substances might be expected to occur during normal operations will typically require LEV to ensure adequate ventilation to limit the formation and extent of hazardous explosive atmospheres. Ventilation should also take account of the potential toxicity of any dangerous substance that might foreseeably be released to make sure people are not exposed to concentrations of the substance that are likely to cause injury or ill health. This requirement under COSHH will often result in a higher standard of ventilation requirement than that required to prevent or limit the extent of an explosive atmosphere. Further information on ventilation requirements under COSHH may be found in the following: (a) Clearing the air. A simple guide to buying and using local exhaust ventilation (LEV) INDG408;25 (b) Time to clear the air! A workers’ pocket guide to local exhaust ventilation (LEV) INDG409;26 (c) Controlling airborne contaminants at work: A guide to local exhaust ventilation (LEV) HSG258;27 (d) local exhaust ventilation (LEV) workplace dust and fume extraction HSE webpages at www.hse.gov.uk/lev.","sub":224},{"k":"Guidance","r":"Paragraph 225","p":51,"t":"225 LEV (and MEV) systems should be monitored to detect any reduction in exhaust flow that would result in inadequate ventilation. Should this occur, appropriate warning and/or automatic actions should be initiated.","sub":225},{"k":"Guidance","r":"Paragraph 226","p":51,"t":"226 The LEV extraction openings should be located as close as possible to the sources of potential release of the dangerous substance to limit the extent of any hazardous explosive atmosphere. LEV should be provided in other locations where explosive atmospheres might accumulate. The exact position should take account of the density of the dangerous substance (which for the majority of substances will normally be at low/floor level).","sub":226},{"k":"Guidance","r":"Paragraph 227","p":51,"t":"227 LEV (and MEV) systems should discharge to a safe location outdoors.","sub":227},{"k":"Guidance","r":"Paragraph 228","p":51,"t":"228 Where it is not reasonably practicable, or it is considered unnecessary to provide LEV, adequate ventilation may be achieved by general MEV to the workroom. However, such ventilation systems can affect the comfort of the occupants.","h":"Ventilation: Fourth and last choice – extraction ventilation to the entire workspace","sub":228},{"k":"Guidance","r":"Paragraph 229","p":51,"t":"229 Plant and machinery containing dangerous substances should be provided with adequate ventilation to prevent hazardous explosive atmospheres from occurring so far as reasonably practicable. For plant and machinery purchased from within the EU, this should be confirmed by the supplier in compliance with their duties under the Machinery Directive 2006/42/EC implemented in UK law by the Supply of Machinery (Safety) Regulations 2008 (SI 2008/1597). Documentary information should show that ‘machinery is designed and constructed to avoid any risk of explosion posed by the machinery itself or by gases, liquids, dusts, vapours or other substances produced or used by the machinery’.","h":"Ventilation of plant and machinery","sub":229},{"k":"Guidance","r":"Paragraph 230","p":51,"t":"230 Where the plant or machinery is manufactured by the employer or imported from outside the EU, the employer takes on the responsibility for ensuring its safe design and use.","sub":230},{"k":"Guidance","r":"Paragraph 231","p":51,"t":"231 Plant and machinery should be properly installed to ensure the ventilation operates as designed and exhausts to a safe place, a recovery unit or a disposal unit.","sub":231},{"k":"Guidance","r":"Paragraph 232","p":51,"t":"232 Plant burning dangerous substances (not covered by the Gas Appliances (Safety) Regulations 1995 (SI 1995/1629)) should be provided with means of purging the combustion chamber and other parts in which a hazardous explosive atmosphere might occur before starting and completing an ignition cycle.","sub":232},{"k":"Guidance","r":"Paragraph 233","p":51,"t":"233 Ventilation for plant and machinery is normally considered adequate if it limits the average concentration of any dangerous substance that might potentially be present to no more than 25% of the LEL. However, an increase up to a maximum 50% LEL can be acceptable where additional safeguards are provided to prevent the formation of a hazardous explosive atmosphere. For example, gas detectors linked to emergency shutdown of the process might be used together with maintaining or increasing the exhaust ventilation on solvent evaporating ovens and gas turbine enclosures.","h":"Adequate ventilation","sub":233},{"k":"Guidance","r":"Paragraph 234","p":52,"t":"234 Temporary exhaust ventilation systems may be provided for non-routine higher-risk activities, such as cleaning, repair or maintenance in tanks and other confined spaces or in an emergency after a release. The work procedures for such activities should be carefully considered (see also paragraphs 333–343). The atmosphere should be continuously monitored to ensure that ventilation is adequate and the area remains safe. Where workers will enter the space, the ventilation should ensure that the concentration of the dangerous substance does not exceed 10% of the LEL (irrespective of the provision of suitable breathing apparatus).","h":"Temporary exhaust ventilation systems","sub":234},{"k":"Guidance","r":"Paragraph 235","p":52,"t":"235 Industry guidance on ventilation at sites storing and handling LPG has been produced by UKLPG.9, 28–29","sub":235},{"k":"ACOP","r":"Paragraph 236","p":52,"t":"236 To avoid contaminating other parts of the workplace in the event of a loss of containment, employers should take measures so far as reasonably practicable to: (a) contain spillages of dangerous substances; (b) ensure flammable vapours/gases cannot discharge from the point of spillage into other parts of the building or into other buildings on the premises; (c) contain and collect spills or leaks likely to give rise to a hazardous situation by means of run-off to a container or to a safe place, or otherwise treat to make it safe; (d) provide underground storage tanks for flammable liquids and associated pipework and fittings with secondary containment or leak detection to identify leaks before a hazardous situation can arise; (e) store solids or powders in closed vessels constructed to an appropriate domestic (or international) standard where available. Granular materials contain a proportion of dust and may be stored in designated open compounds provided adequate dust control measures are in place.","h":"Containment and collection of spillages and leaks","sub":236},{"k":"Guidance","r":"Paragraph 237","p":52,"t":"237 Employers should use the risk assessment carried out in accordance with regulation 5 to decide on the need, location and type of valves necessary for isolating the supply after use, during maintenance and in the event of an emergency. Additional information on the containment of large volumes of flammable liquids may be found in: (a) Safety and environmental standards for fuel storage sites;30 (b) Secondary and Tertiary Containment of Bulk Hazardous Liquids at COMAH Establishments.31","sub":237},{"k":"ACOP","r":"Paragraph 238","p":52,"t":"238 Unnecessary ignition sources should be avoided throughout the workplace as a general principle. Ignition sources include open flames, electrostatic discharges, unprotected powered mobile plant etc. Where the risk of a flammable atmosphere cannot be eliminated, the employer may have to control risks of ignition. Consideration of ignition sources under regulation 6 should include those that employers must consider under hazardous area classification.","h":"Control and avoidance of ignition sources including electrostatic discharges","sub":238},{"k":"ACOP","r":"Paragraph 239","p":53,"t":"239 If an employer decides to create a designated smoking area for employees and visitors, this should not be sited in or near a hazardous zone.","sub":239},{"k":"ACOP","r":"Paragraph 240","p":53,"t":"240 Ignition sources outside the hazardous (classified) areas should also be considered where they could pose a risk of a fire or similar event spreading into a zone where there could be an explosive atmosphere.","sub":240},{"k":"ACOP","r":"Paragraph 241","p":53,"t":"241 In areas where the ignition of dangerous substances could affect safety, measures must be taken to avoid ignition sources occurring or being brought into those areas. The measures employers should take include: (a) selecting and installing appropriate electrical and non-electrical equipment that has been designed to be safe in hazardous areas. All equipment for places where an explosive atmosphere may occur should meet the essential safety requirements appropriate to the equipment category as detailed in EPS; (b) implementing inspection, testing, cleaning and maintenance regimes for equipment to minimise ignition sources occurring as a result of overheating or fault conditions; (c) ensuring that any portable or mobile equipment brought into hazardous areas is either suitably protected or is only brought into those areas under safe conditions ensured by implementation of a permit-to-work scheme. See regulation 6(8) and part 6 of Schedule 1 of DSEAR and the ACOP text between paragraphs 306–352 (safe maintenance, repair and cleaning procedures); (d) prohibiting the use of open flames; (e) implementing controls and procedures to prevent the occurrence of hazardous electrostatic discharges; (f) ensuring heating equipment installed in areas where dangerous substances are stored or used cannot act as an ignition source. Ensuring that heating equipment or storage conditions cannot cause dangerous substances to reach their auto-ignition temperature or, where relevant, their self-accelerating decomposition temperature (SADT) for packaged materials, or the onset temperature at which thermal decomposition occurs within bulked materials; (g) preventing the accumulation of waste materials or deposits that are liable to spontaneously combust or are readily ignited. Such materials should be placed in a closed metal bin or removed to a safe place. Deposits should be removed in such a way that their removal does not create a risk of ignition; (h) avoiding incompatible materials that could either react together to produce heat or flames or give rise to incendive sparks following frictional contact during impact, machining, grinding or polishing. The employer’s assessment of where incompatible materials could occur should consider the dangerous substances being processed and the materials of construction of plant, equipment, process areas and tools.","sub":241},{"k":"ACOP","r":"Paragraph 242","p":53,"t":"242 In identifying potential ignition sources, the employer should consider the properties of the dangerous substance in relation to how it is handled or may accumulate, whether unintentionally or not. If accumulations of certain fugitive dusts might self-heat and potentially ignite then such accumulations should be prevented.","sub":242},{"k":"ACOP","r":"Paragraph 243","p":53,"t":"243 The following factors are among the most likely ways that electrostatic discharge events presenting a risk of ignition may be generated and therefore should be avoided: (a) personnel wearing clothing and/or footwear capable of generating a build up of static electricity; (b) containers and equipment handling dangerous substances/flammable liquids that have not been earthed/bonded correctly or have been constructed of unsuitable materials; (c) manual cleaning operations using unsuitable equipment and/or materials; (d) incompatible reactive materials – this includes both tools and other plant as well as dangerous substances; (e) humidity not maintained to a range that reduces static build-up.","sub":243},{"k":"ACOP","r":"Paragraph 244","p":54,"t":"244 Employers should ensure that all visitors who are given access to hazardous areas of the premises are wearing appropriate antistatic clothing and are made aware of the hazards before entering any location where a potentially explosive atmosphere may exist.","sub":244},{"k":"ACOP","r":"Paragraph 245","p":54,"t":"245 Where mechanical exhaust ventilation (MEV) is provided and after having eliminated or minimised any releases to reduce the hazardous area of any potentially explosive atmosphere, employers should then eliminate or establish controls on ignition sources by considering all relevant factors in relation to the MEV systems. This includes: (a) for a potentially explosive atmosphere, selection and installation of equipment and protective systems designed to be safe for the zone of the hazardous area. Such equipment and systems supplied after June 2003 should meet the essential safety requirements detailed in the EPS; (b) not siting electric motors of fans within ducts that may contain dangerous substances, where build-up of residues may lead to overheating; (c) designing (protecting) and installing only fan impellers, bearings, pulleys etc suitable for such use if they are in a hazardous area/zone, for example inside ductwork; (d) providing equipment, inspection testing, cleaning and maintenance schemes to minimise overheating or fault conditions with the potential to lead to ignition of the dangerous substance; (e) equipotentially bonding MEV, to prevent electrostatic build-up; (f) making provision to prevent the accumulation of flammable/combustible waste deposits and enabling safe access for safe cleaning and maintenance.","sub":245},{"k":"Guidance","r":"Paragraph 246","p":54,"t":"246 Guidance on preventing ignition from non-electrical equipment, eg by use of sensors, is contained in BS EN 13463-6.32","sub":246},{"k":"Guidance","r":"Paragraph 247","p":54,"t":"247 Advice on the control of electrostatic hazards is contained in: (a) BS 5958-1 Code of Practice for control of undesirable static electricity. General considerations.33 Also in (b) PD CLC/TR 50404 Electrostatics. Code of Practice for the avoidance of hazards due to static electricity,34 which includes a range of measures applicable to various industrial situations such as petrochemical installations and flammable powder handling.","sub":247},{"k":"Guidance","r":"Paragraph 248","p":54,"t":"248 Some clothing, including footwear, contains materials that can generate electrostatic discharges during use. Such discharges can ignite certain types of explosive atmospheres, eg gases or vapours and even some types of dust that are very easily ignited. Employees working in these atmospheres should be provided with antistatic footwear if the assessment indicates an ignition risk. Providing the floor is not highly insulating, antistatic footwear alone may be sufficient to control the risk because the risk from electrostatic discharges from clothing can be reduced if the wearer is earthed by the footwear and suitable flooring such as concrete or steel grids. Antistatic footwear and flooring should be tested routinely and replaced if it is found that its antistatic properties have deteriorated.","sub":248},{"k":"Guidance","r":"Paragraph 249","p":55,"t":"249 Employees such as electricians who need insulated footwear for other purposes will need reminding to change their footwear before entering a hazardous area unless the area can be made safe for them. This is likely to be sufficient for places classified into zone 0, 1 or 2 as specified in Schedule 2. In a small number of cases special footwear may also be needed for zones 20, 21 and 22. Other antistatic clothing must also be provided if the assessment shows this to be necessary.","sub":249},{"k":"Guidance","r":"Paragraph 250","p":55,"t":"250 The employer must also ensure that any personal protective equipment provided for o
